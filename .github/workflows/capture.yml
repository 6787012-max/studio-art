name: capture
on:
  workflow_dispatch:
    inputs:
      job: { description: 'capture/<job>', required: true }
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # 11/11/2026: security.ubuntu.com stopped answering and every part hung 77 min in apt, then failed.
      # Use the Azure mirror for all sources, short timeouts with retries, and a static ffmpeg from GitHub if apt still fails.
      - name: system packages
        timeout-minutes: 15
        run: |
          echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99net >/dev/null
          sudo sed -i -E 's#https?://(security|archive)\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update -q || true
          if ! sudo apt-get install -y -q ffmpeg fontconfig; then
            echo "apt ffmpeg failed - using static build"
            curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - name: playwright
        timeout-minutes: 20
        run: pip install -q playwright psutil && python -m playwright install --with-deps chromium
      # 02/11/2026: a failed scene used to turn the run red = one GitHub e-mail per failed part (dozens a day).
      # The failure is now reported in out/FAILED.txt and the run stays green; capture_remote.py reads it and fails locally.
      - name: capture
        run: |
          set +e
          python3 capture_job.py "${{ inputs.job }}" 2>&1 | tee /tmp/cap.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            mkdir -p "capture/${{ inputs.job }}/out"
            tail -c 4000 /tmp/cap.log > "capture/${{ inputs.job }}/out/FAILED.txt"
            echo "capture failed (rc=$rc) - reported in FAILED.txt"
          fi
          exit 0
      - name: push results
        run: |
          set +e
          git config user.name studio-bot
          git config user.email studio-bot@users.noreply.github.com
          git add capture/${{ inputs.job }}/out
          git commit -m "capture ${{ inputs.job }}" || echo "nothing to commit"
          for i in $(seq 1 20); do git pull --rebase -q && git push -q && echo pushed && exit 0; sleep $((RANDOM % 15 + 5)); done
          echo "push failed 20 times - capture_remote.py will report missing results"
          exit 0
