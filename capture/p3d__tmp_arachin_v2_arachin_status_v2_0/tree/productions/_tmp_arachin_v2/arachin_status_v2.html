  const amp = age < 0.3 ? 16 * (1 - age / 0.3) : 0;
  return {scale: scale, alpha: alpha, dx: amp * Math.sin(61 * t), dy: amp * Math.cos(53 * t)};

        ctx.save();
        ctx.globalAlpha = st.alpha;
        ctx.translate(W / 2 + st.dx, it.top + fs * 0.6 + st.dy);
        ctx.scale(st.scale, st.scale);
        ctx.font = '800 ' + fs + 'px AF, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.65)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = it.gold ? GOLD : CREAM;
        ctx.fillText(T[it.k], 0, 0);
        ctx.restore();
      }
    });
    ctx.globalAlpha = 1;
    // quick white flash at each hard cut (not at the very start)
    if (idx > 0 && t - sc.s < 0.12) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * (1 - (t - sc.s) / 0.12)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  });
}

window.__dur = DUR;
window.__shots = [{t0: 0, dur: 4.5}, {t0: 4.5, dur: 6}, {t0: 10.5, dur: 8}, {t0: 18.5, dur: 5}, {t0: 23.5, dur: 6.5}];
window.__seek = function (t) { render(t); };

Promise.all([document.fonts.load('800 40px AF')].concat(loads))
  .catch(() => {})
  .then(() => { render(0); window.__ready = true; });
</script>
