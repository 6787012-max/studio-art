          segs.push([1.4, 2.6, () => ({ gesture: 'hand', smile: .5, facing: cornerDir(sx, sz, 0) + .8 })]);
          [0, 1, 3, 2].forEach((cc, q) => segs.push([2.6 + q * .8, 3.4 + q * .8, () => ({ gesture: 'pt2', talk: .5, smile: .4, facing: cornerDir(sx, sz, cc) })]));
          segs.push([5.8, 9.4, () => ({ gesture: 'explain', talk: .4, smile: .4, facing: face(sx, sz, 6, 3.8) - .5 })]);
        } else if (i === 2 || i === 9) {
          segs.push([5.4, 9.4, t => ({ gesture: sn(t * 2.2 + i) > -.2 ? 'finger' : 'explain', talk: .6, smile: 0, brow: .5, look: sn(t * 6.5 + i), facing: i === 2 ? PI / 2 : -PI / 2 })]);
        }
        segs.push([0, 9.5, t => ({ gesture: t > 1.5 && t < 7 ? ['rest', 'think', 'rest', 'shrug'][i % 4] : 'think', smile: .25, look: .9 * sn(t * .8 + i), brow: .3 })]);
        segs.push([ts, te, () => ({ gesture: 'rest', smile: .6 })]);
        segs.push([te, 16, t => ({ gesture: 'rest', smile: .8, talk: .3, look: .5 * sn(t + i) })]);
        fns[i] = track(K, segs); men(Wd, GROUP16[i], fns[i]);
      }
      heroProxy(Wd, t => xz(fns, PIDX, t));
      const cam = path([[0, [6.0, 1.7, 3.8], [1.0, 1.4, 2.0], 38], [7.8, [6.2, 1.8, 3.9], [0.8, 1.4, 2.0], 38], [10.8, [0, 6.4, 10.8], [0, .8, -4], 66], [15, [0, 6.6, 10.6], [0, .5, -6], 74]]);
      return Object.assign(Wd, { cam });
    }),

    // D8 - FINGERS: one pair close - fists bounce on a beat, fingers thrown out (2 against 4), the winner raises his other hand first and walks to a new partner.
    shot(16, ['CAP_D_16', 'CAP_D_17'], [0.5, 8.1], () => {
      const Wd = mkHall();
      const SL = [[-7.5, -2.5], [-2.5, -2.5], [2.5, -2.5], [7.5, -2.5], [7.5, 2.5], [2.5, 2.5], [-2.5, 2.5], [-7.5, 2.5]];
      const U = [cs(15 * D2R), sn(15 * D2R)], TR = [.6, 7.3, 13.4];
      const sp = (p, side) => { const q = side ? 1 : -1; return [SL[p][0] + U[0] * .6 * q, SL[p][1] + U[1] * .6 * q, Math.atan2(-U[0] * q, -U[1] * q)]; };
      let occ = SL.map((_, p) => [2 * p, 2 * p + 1]);
      const keys = Array.from({ length: 16 }, () => []), ev = Array.from({ length: 16 }, () => []);
      occ.forEach((o, p) => o.forEach((man, s) => { const q = sp(p, s); keys[man].push([0, q[0], q[1], q[2]]); }));
      TR.forEach((Tr, r) => {
        const ws = Array.from({ length: 8 }, (_, p) => (p + r) % 2), nocc = SL.map(() => [0, 0]);
        for (let p = 0; p < 8; p++) {
          const w = occ[p][ws[p]];
          occ[p].forEach((man, s) => ev[man].push({ Tr, side: s, win: s === ws[p] }));
          const q = (p + 1) % 8; nocc[q][1 - ws[q]] = occ[q][1 - ws[q]]; nocc[q][ws[q]] = w;
        }
        for (let p = 0; p < 8; p++) occ[p].forEach(man => { const k = keys[man][keys[man].length - 1]; keys[man].push([Tr + 3.5, k[1], k[2], k[3]]); });
        if (r < 2) for (let p = 0; p < 8; p++) {
          const w = occ[p][ws[p]], q = (p + 1) % 8, dest = sp(q, ws[q]), lp = sp(q, 1 - ws[q]);
          keys[w].push([Tr + 5.6, dest[0], dest[1], face(dest[0], dest[1], lp[0], lp[1])]);
        }
        if (r < 2) occ = nocc;
      });
      const fns = [];
      for (let i = 0; i < 16; i++) {
        const E = ev[i];
        const st = t => {
          for (const e of E) {
            const Tr = e.Tr;
            if (t >= Tr && t < Tr + 1.75) return { gesture: rbG(t, Tr, .55), smile: .8, talk: .2 };
            if (t >= Tr + 1.75 && t < Tr + 3.4) {
              if (e.win && t > Tr + 2.4) return { gesture: e.side ? 'wP' : 'wS', smile: 1, talk: .4 };
              return { gesture: e.side ? 'shP' : 'shS', smile: .8 };
            }
            if (t >= Tr + 3.4 && t < Tr + 3.7) return { gesture: e.win ? 'rest' : 'shrug', smile: 1, talk: .4 };
          }
          return { gesture: 'rest', smile: .6 };
        };
        const lastK = keys[i][keys[i].length - 1]; keys[i].push([17, lastK[1], lastK[2], lastK[3]]);
        fns[i] = track(keys[i], [[0, 99, st]]); men(Wd, GROUP16[i], fns[i]);
      }
      HAIM(Wd, () => ({ pos: [11, 0, -6], facing: -PI / 2, gesture: 'rest', smile: .9 }));
      const HERO = 3;   // winner of the pair at slot 1 in round one
      heroProxy(Wd, t => xz(fns, HERO, t));
      const cam = t => {
        const p = fns[HERO](t).pos;
        return { pos: [p[0] - 1.4, 1.7, p[2] - 3.7], look: [p[0] - .2, 1.2, p[2]], fov: 32 };
      };
      return Object.assign(Wd, { cam });
    }),

    // D9 - WHY DID YOU CHOOSE: the four corner groups; in each one man speaks with a hand on his chest, the others listen and nod. Medium sweep from group to group.
    shot(14, ['CAP_D_18', 'CAP_D_19'], [0.5, 7.1], () => {
      const Wd = mkHall();
      cornerSheets(Wd);
      const NRM = [[0, 1], [0, 1], [1, 0], [-1, 0]], ORDER = [2, 0, 1, 3], WIN = [[0.3, 4.4], [4.0, 8.0], [7.6, 11.4], [11.0, 14.2]], OFF = [0, 55, -55, 110];
      const CEN = SHEETS.map((s, c) => [s.x + NRM[c][0] * 2.4, s.z + NRM[c][1] * 2.4]);
      const slotOf = (c, k) => { const n = NRM[c], a = Math.atan2(-n[0], -n[1]) + OFF[k] * D2R; return { x: CEN[c][0] + sn(a) * .85, z: CEN[c][1] + cs(a) * .85, a }; };
      ORDER.forEach((c, gi) => {
        for (let k = 0; k < 4; k++) {
          const man = c * 4 + k, s = slotOf(c, k), f = face(s.x, s.z, CEN[c][0], CEN[c][1]), w = WIN[gi];
          const P = men(Wd, GROUP16[man], t => {
            const spk = k === 0 && t > w[0] && t < w[1];
            return { pos: [s.x, 0, s.z], facing: f + .05 * sn(t * .6 + man), gesture: spk ? (sn(t * .9) > .6 ? 'explain' : 'heart') : 'rest', talk: spk ? .6 + .3 * sn(t * 7) : 0, smile: .6, look: .4 * sn(t * .5 + man) };
          });
          lean(Wd, P, t => ({ facing: f, ang: -(k !== 0 && t > w[0] + .8 && t < w[1] ? .09 * Math.max(0, sn((t - w[0]) * 2.6 + k * 1.7)) : 0) }));
        }
      });
      const cp = c => [CEN[c][0] + NRM[c][0] * 5.6, 1.9, CEN[c][1] + NRM[c][1] * 5.6];
      const cl = c => [CEN[c][0] - NRM[c][0] * .6, 1.3, CEN[c][1] - NRM[c][1] * .6];
      const cam = path([[0, cp(2), cl(2), 36], [3.4, [cp(2)[0] + .3, 1.9, cp(2)[2] + .3], cl(2), 36], [7.2, cp(0), cl(0), 36], [10.8, cp(1), cl(1), 36], [14, cp(3), cl(3), 36]]);
      heroProxy(Wd, t => { const gi = t < WIN[1][0] ? 0 : t < WIN[2][0] ? 1 : t < WIN[3][0] ? 2 : 3, s = slotOf(ORDER[gi], 0); return [s.x, 0, s.z]; });
      return Object.assign(Wd, { cam });
    }),
  ],
});
