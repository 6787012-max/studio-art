name: render
on:
  workflow_dispatch:
    inputs:
      job: { description: 'render/<job>', required: true }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: ffmpeg -hide_banner -filters 2>/dev/null | grep -E " (ass|zoompan|xfade) " ; nproc
      - run: python3 render_job.py "${{ inputs.job }}"
      - name: push results
        run: |
          git config user.name studio-bot
          git config user.email studio-bot@users.noreply.github.com
          git add render/${{ inputs.job }}/out
          git commit -m "render ${{ inputs.job }}" || echo "nothing to commit"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep 7; done
