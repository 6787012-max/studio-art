<!doctype html>
<html><meta charset="utf-8"><title>הרב בתלת-ממד — בקוד</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
// 16 שניות: הרב (כולו בקוד) מסביר, מצביע, מנפנף והולך, והמצלמה מקיפה אותו 360 מעלות ועולה ויורדת.
import * as THREE from 'three';
import { figure, POSES, walkPose, mixPose } from '../../lib/figure3d.js';
import { illus } from '../../lib/illus3d.js';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, preserveDrawingBuffer: true }); r.setSize(W, H, false);
const I = illus(THREE, r, W, H, { width: 1.8 });
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xf2e7d0);
sc.add(new THREE.HemisphereLight(0xffffff, 0xcdbb9e, 1.5)); const d = new THREE.DirectionalLight(0xfff3e2, 2.4); d.position.set(-2, 4, 3); sc.add(d);
const gd = new Uint8Array([200, 200, 200, 255, 255, 255, 255, 255]), gm = new THREE.DataTexture(gd, 2, 1, THREE.RGBAFormat); gm.minFilter = gm.magFilter = THREE.NearestFilter; gm.needsUpdate = true;
const T = c => new THREE.MeshToonMaterial({ color: c, gradientMap: gm });
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), T(0xe8d6b2)); floor.rotation.x = -Math.PI / 2; sc.add(floor);
// כמה חפצים מסביב כדי שירגישו את העומק כשהמצלמה מסתובבת: שולחן עם ספרים, שטנדר, עציץ
const table = new THREE.Group(); const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, .06, .6), T(0x9a6a40)); top.position.y = .75; table.add(top);
for (const [x, z] of [[-.55, -.25], [.55, -.25], [-.55, .25], [.55, .25]]) { const l = new THREE.Mesh(new THREE.BoxGeometry(.05, .75, .05), T(0x7a5232)); l.position.set(x, .375, z); table.add(l); }
['#7a2a2a', '#2a4a7a', '#3a6a3a', '#7a5a2a'].forEach((c, i) => { const b = new THREE.Mesh(new THREE.BoxGeometry(.06, .26, .2), T(c)); b.position.set(-.3 + i * .07, .91, 0); table.add(b); });
table.position.set(-2.4, 0, -1.8); table.rotation.y = .5; sc.add(table);
const stand = new THREE.Group(); const sp = new THREE.Mesh(new THREE.BoxGeometry(.45, .04, .35), T(0x8a5a32)); sp.position.y = 1.05; sp.rotation.x = -.5; stand.add(sp);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.03, .04, 1.0, 12), T(0x7a5232)); pole.position.y = .5; stand.add(pole); stand.position.set(2.1, 0, -1.4); stand.rotation.y = -.6; sc.add(stand);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(.18, .13, .3, 20), T(0xb0603a)); pot.position.set(2.2, .15, 1.9); sc.add(pot);
const bush = new THREE.Mesh(new THREE.SphereGeometry(.3, 20, 14), T(0x5a8a3a)); bush.position.set(2.2, .55, 1.9); sc.add(bush);
const rav = figure(THREE, {}); sc.add(rav.group);
const cam = new THREE.PerspectiveCamera(32, W / H, .05, 60);
// לוח זמנים של תנועות (שניות) — מעבר רך של 0.6 שנ' בין תנוחה לתנוחה
const SEQ = [[0, 'rest'], [1.2, 'explain'], [4.2, 'point'], [6.6, 'wave'], [8.8, 'walk'], [12.2, 'heart'], [14.2, 'wide']];
function poseAt(t) {
  let i = 0; while (i < SEQ.length - 1 && t >= SEQ[i + 1][0]) i++;
  const get = (n, tt) => n === 'walk' ? walkPose((tt - 8.8) * 5.2, 1) : POSES[n];
  const cur = get(SEQ[i][1], t), prev = i ? get(SEQ[i - 1][1], t) : cur, u = Math.min(1, (t - SEQ[i][0]) / .6), e = u * u * (3 - 2 * u);
  const p = mixPose(prev, cur, e);
  // נשימה ותנועות קטנות כל הזמן
  p.chest = (p.chest || [0, 0, 0]).map((v, k) => v + (k === 0 ? .02 * Math.sin(t * 1.8) : 0));
  p.head = (p.head || [0, 0, 0]).map((v, k) => v + (k === 1 ? .15 * Math.sin(t * .7) : k === 0 ? .05 * Math.sin(t * 2.1) : 0));
  return p;
}
window.__seek = t => {
  t = t || 0;
  const p = poseAt(t); rav.pose(p);
  const walkZ = t < 8.8 ? 0 : t < 12.2 ? (t - 8.8) * .55 : 1.87; rav.group.position.z = walkZ;
  const talk = (t > 1 && t < 6.5) || (t > 12) ? Math.max(0, Math.sin(t * 11) * .5 + Math.sin(t * 7.3) * .4) : 0;
  rav.face({ blink: (t % 3.3) < .14 ? 1 : 0, mouth: talk, smile: .4 + (t > 6.6 && t < 8.8 ? .6 : 0), brow: talk * .5, look: .3 * Math.sin(t * .5) });
  const a = t / 16 * Math.PI * 2 + .2, R = 5.2 - 1.3 * Math.sin(t / 16 * Math.PI), y = 1.35 + .6 * Math.sin(t / 16 * Math.PI * 2 + .5);
  cam.position.set(Math.sin(a) * R, y, walkZ + Math.cos(a) * R); cam.lookAt(0, 1.05, walkZ);
  I.render(sc, cam);
};
window.__seek(0); window.__ready = true;
</script>
</html>
