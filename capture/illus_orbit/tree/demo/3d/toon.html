<!doctype html>
<html><meta charset="utf-8"><title>3D illustrated</title>
<style>html,body{margin:0;background:#ddd}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }</script>
<script type="module">
// תלת-ממד "ציורי": אותו מודל בשלוש שפות — ימין: צללה מצוירת + קו דיו; אמצע: + משיכות מכחול (מסנן קווהארה) + נייר; שמאל: המקור.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const file = '../../assets/3d/rav_raw/trellis-community__TRELLIS_0.glb';
const W = 1920, H = 1080, PW = 640;
const cv = document.getElementById('c'), r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H, false); r.outputColorSpace = THREE.SRGBColorSpace; r.autoClear = false;
const rt = new THREE.WebGLRenderTarget(PW, H, { samples: 4 }); rt.texture.colorSpace = THREE.SRGBColorSpace;
// צללה מדורגת (3 טונים) — כמו צביעה ביד
const gd = new Uint8Array([110, 110, 110, 255, 190, 190, 190, 255, 255, 255, 255, 255]); const grad = new THREE.DataTexture(gd, 3, 1, THREE.RGBAFormat); grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
function outline(mesh, w) { const m = new THREE.MeshBasicMaterial({ color: 0x1a120c, side: THREE.BackSide });
  m.onBeforeCompile = s => { s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n transformed += normalize(normal) * ' + w.toFixed(4) + ';'); };
  const o = new THREE.Mesh(mesh.geometry, m); mesh.add(o); }
// מסנן קווהארה: מחליק לאזורים אחידים עם קצוות חדים — נראה כמו משיכות מכחול; ועליו גרעין נייר
const kuw = new THREE.ShaderMaterial({ uniforms: { tex: { value: rt.texture }, res: { value: new THREE.Vector2(PW, H) }, R: { value: 5 }, paper: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: `uniform sampler2D tex; uniform vec2 res; uniform int R; uniform float paper; varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
  void main(){ vec2 px=1./res; vec3 m[4]; vec3 s[4]; for(int k=0;k<4;k++){m[k]=vec3(0.);s[k]=vec3(0.);}
    float n=float((R+1)*(R+1));
    for(int j=-5;j<=5;j++) for(int i=-5;i<=5;i++){ if(abs(i)>R||abs(j)>R) continue; vec3 c=texture2D(tex,vUv+vec2(i,j)*px).rgb;
      if(i<=0&&j<=0){m[0]+=c;s[0]+=c*c;} if(i>=0&&j<=0){m[1]+=c;s[1]+=c*c;} if(i<=0&&j>=0){m[2]+=c;s[2]+=c*c;} if(i>=0&&j>=0){m[3]+=c;s[3]+=c*c;} }
    float best=1e9; vec3 col=vec3(0.); for(int k=0;k<4;k++){ vec3 mu=m[k]/n; vec3 v=abs(s[k]/n-mu*mu); float sg=v.r+v.g+v.b; if(sg<best){best=sg;col=mu;} }
    col=pow(col,vec3(1./2.2));   // מהמרחב הליניארי של היעד למסך
    float g=h(floor(vUv*res/2.))*.06+h(floor(vUv*res/9.))*.05; col*=1.-paper*g; col=mix(col, col*vec3(1.03,1.0,.94), .5);
    gl_FragColor=vec4(col,1.); }` });
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), kuw), qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); qs.add(quad);
function scene(kind, model) {
  const sc = new THREE.Scene(); sc.background = new THREE.Color(kind === 'real' ? 0xe9e2d4 : 0xf2e6cf);
  sc.add(new THREE.HemisphereLight(0xfff8ee, 0xb09a7a, kind === 'real' ? 2.0 : 1.3)); const d = new THREE.DirectionalLight(0xfff1dc, kind === 'real' ? 1.6 : 2.4); d.position.set(-2, 4, 3); sc.add(d);
  const m = model.clone(true);
  if (kind !== 'real') { const L = []; m.traverse(o => { if (o.isMesh) L.push(o); });
    for (const o of L) { const map = o.material.map; o.material = new THREE.MeshToonMaterial({ map, color: 0xffffff, gradientMap: grad }); outline(o, .006); } }
  sc.add(m); return sc;
}
new GLTFLoader().load(file, g => {
  g.scene.traverse(o => { if (o.isMesh && !o.geometry.attributes.normal) o.geometry.computeVertexNormals(); });   // לקובץ מ-TRELLIS אין כיווני משטח
  const m = g.scene; const b = new THREE.Box3().setFromObject(m), s = new THREE.Vector3(), c = new THREE.Vector3(); b.getSize(s); b.getCenter(c); m.position.sub(c);
  const S = { real: scene('real', m), toon: scene('toon', m), paint: scene('toon', m) }, h = s.y;
  const cam = new THREE.PerspectiveCamera(30, PW / H, .01, 100);
  window.__seek = t => { const a = (t || 0) * 70 * Math.PI / 180 + .5, R = h * 2.25; cam.position.set(Math.sin(a) * R, h * .1, Math.cos(a) * R); cam.lookAt(0, -h * .02, 0);
    r.setScissorTest(true); r.clear();
    r.setViewport(1280, 0, PW, H); r.setScissor(1280, 0, PW, H); r.render(S.toon, cam);
    r.setRenderTarget(rt); r.setViewport(0, 0, PW, H); r.setScissor(0, 0, PW, H); r.clear(); r.render(S.paint, cam); r.setRenderTarget(null);
    r.setViewport(640, 0, PW, H); r.setScissor(640, 0, PW, H); r.render(qs, qc);
    r.setViewport(0, 0, PW, H); r.setScissor(0, 0, PW, H); r.render(S.real, cam); };
  window.__seek(0); window.__ready = true;
}, undefined, e => console.error('load failed', e));
</script>
</html>
