      for (let i = 0; i < 12; i++) {

        actor(Wd, GROUP16[i], t => { const s = Object.assign(stOf(i), { smile: .7, talk: ((t * .6 + i * .31) % 1) < .25 ? .4 : 0 }); if (kf) s.ikL = sample(kf, t); else s.gesture = ((t * .35 + i * .37) % 1) < .6 ? 'rest' : 'explainA'; return s; });

        let pos = Hp(hold[0]), yaw = 0, pitch = 0, roll = 0;

      });

      const cam = t => { const a = (20 + 180 * ease.io(prog(t, 0, 14))) * D2R; return { pos: [1.2 * Math.sin(a), 1.6, 1.2 * Math.cos(a)], look: [-3.0 * Math.sin(a), 1.2, -3.0 * Math.cos(a)], fov: 64 }; };
      return Object.assign(Wd, { cam });
    }),

    // ============ B8 - MOLECULES: coloured paper in hands and under feet; the called colour goes into the middle
    wide(shot(16, ['CAP_B_19', 'CAP_B_20'], [0.5, 8.1], () => {
      const Wd = hallWorld(NEUTRAL_HALL());
      const GC = [[-3.4, -2.6], [3.4, -2.6], [-3.4, 2.6], [3.4, 2.6]], th0 = [0, 0, 0, 54], RC = [.85, .85, 1.0, .85], GOF = [0, 4, 8, 13];
      const COL = ['red', 'blue', 'green', 'yellow'], CALL = ['red', 'blue', 'yellow', 'green'], TC = [2.4, 5.2, 8.0, 11.0], WALKER = 9;

          for (let c = 0; c < 4; c++) { const uu = bump(t, TC[c] + .35, TC[c] + .8, TC[c] + 1.6, TC[c] + 2.0); if (uu > 0) { limb = o.indexOf(CALL[c]); if (i === WALKER && c === 2) limb = (limb + 1) % 4; u = uu; } }

        });
        holdSheet(Wd, P, 'A', o[0]); holdSheet(Wd, P, 'B', o[1]); footSheet(Wd, P, 'A', o[2]); footSheet(Wd, P, 'B', o[3]);

      const wideC = t => { const a = (10 + 40 * ease.io(prog(t, 0, 8))) * D2R; return { pos: [8.4 * Math.sin(a), 4.4, 8.4 * Math.cos(a)], look: [-1.5, 1.0, 1.0] }; };

      const cam = t => { const w = ease.io(prog(t, 3.0, 6.0)), a = wideC(t), b = closeC(t); return { pos: lerp3(a.pos, b.pos, w), look: lerp3(a.look, b.look, w), fov: lerp(46, 52, w) }; };
