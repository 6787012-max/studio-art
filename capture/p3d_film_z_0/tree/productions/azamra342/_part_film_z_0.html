<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>ותן טל ומטר</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../../lib/people_pro.js"></script>
<script src="../../lib/geo_eretz.js"></script>
<script>window.__T0=0.0000;</script>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
import { film, cloud, rain, THREE, prog, ease, clamp, lerp } from '../../lib/stage3d.js';
import { roadWorld, buildRoad, boy, route, cine, mkShot } from './road.js';

const PI = Math.PI;

film({
  title: 'ותן טל ומטר',
  shots: [
    // Z1 - gentle rain over green fields, a slow rise; a rainbow appears at the end
    mkShot(10.6, [`על פי הגיליון "אזמרה לשמך" מס' 342, פרשת נח תשפ"ז.`, 'הלכה למעשה — שואלים רב.'], () => {
      const Wd = roadWorld({ skyTop: 0x7f95b0, skyBottom: 0xd5d9d2, fogColor: 0xc9cfcb, fogNear: 60, fogFar: 380, sun: 1.25, hemi: 1.2 });
      const RD = buildRoad(Wd, { fields: false }); RD.stations.tal.label.visible = false;
      const cam = cine([[0, [0, 1.25, 40.2], 6, 1.0, 165, 44, .5], [3.4, [0, 1.4, 44], 8.6, 3.8, 172, 46, .3], [6.5, [0, 3, 70], 30, 12, 182, 50, .8], [10.6, [0, 6, 100], 52, 24, 190, 56, 16]]);
      const Rt = route([[0, 0, 40.2, PI], [10.6, 0, 40.2, PI]], { y: .17 });
      boy(Wd, t => Object.assign(Rt(t), { groundY: .17, gesture: 'up', smile: .85, seed: .6 }));
      const cls = [[-40, 40, 20], [30, 44, 60], [-70, 38, 90], [55, 46, 110], [-10, 50, 150], [80, 42, 30], [-90, 45, 40]].map(([x, y, z], i) => { const c = cloud({ seed: 120 + i, size: 9, color: 0xa9b3be, pos: [x, y, z], puffs: 6, cast: false }); Wd.add(c); return [c, x]; });
      Wd.on(t => cls.forEach(([c, x]) => { c.position.x = x + t * 1.3; }));
      rain(Wd, { x0: -34, x1: 34, z0: -34, z1: 34, top: 40, bottom: 0, count: 3200, speed: 16, len: .9, opacity: .55, color: 0xaec4de, seed: 8, offset: t => { const c = cam(t).pos; return [c[0], c[2] + 18]; } });
      const cols = [0xe8453c, 0xf59a3a, 0xf5d93a, 0x5fc25a, 0x3fa7e0, 0x4a5ac8, 0x9a56c4], bands = [];
      cols.forEach((c, i) => { const m = new THREE.Mesh(new THREE.TorusGeometry(40 + i * 1.1, .55, 6, 90, PI), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, depthWrite: false, fog: false })); m.position.set(0, 0, 150); Wd.add(m); bands.push(m); });
      Wd.on(t => { const k = ease.sm(prog(t, 5, 8.5)); bands.forEach(m => { m.visible = k > .01; m.material.opacity = .55 * k; }); });
      return Object.assign(Wd, { cam });
    }),
  ],
});
</script>
</html>
