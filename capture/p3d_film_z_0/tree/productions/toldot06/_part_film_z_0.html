// הולך: keys [t, x, z, stop?] -> מיקום, פאזת הליכה (לפי המרחק), כיוון התנועה

          for (const y of [.003, .27]) { const rg = new THREE.Mesh(new THREE.TorusGeometry(.1, .008, 8, 32), new THREE.MeshLambertMaterial({ color: 0x7fa9c4 })); rg.rotation.x = Math.PI / 2; rg.position.y = y; jar.add(rg); }
          const hl = new THREE.Mesh(new THREE.PlaneGeometry(.018, .2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .75 })); hl.position.set(-.05, .14, .088); hl.rotation.y = -.5; jar.add(hl);
          const wat = new THREE.Mesh(new THREE.CylinderGeometry(.094, .094, 1, 24), new THREE.MeshLambertMaterial({ color: 0x4f9ad8, transparent: true, opacity: .8 })); wat.geometry.translate(0, .5, 0); wat.position.y = .006; jar.add(wat); jar.userData.wat = wat;
          Wd.add(jar);
        }
        // הילד מביא את הצנצנת
        const jarSpot = new THREE.Vector3(JS[0] + Math.cos(.5) * -.08, standH, JS[2] + Math.sin(.5) * .08);
        const bw = walker([[29.6, -8.6, 10.9, true], [30.0, -8.6, 10.9], [33.0, JS[0] - .5, JS[2] + .58, true], [34.4, JS[0] - .5, JS[2] + .58, true], [35.4, JS[0] - 1.05, JS[2] + 1.2, true], [40, JS[0] - 1.05, JS[2] + 1.2, true]], () => 0);
        let camRef = null; Wd.on((t, c) => { camRef = c; });
        person(Wd, BOY, t => {
          const w = bw(t), moving = w.speed > .12, toJar = Math.atan2(JS[0] - w.pos[0], JS[2] - w.pos[2]), toCam = camRef ? Math.atan2(camRef.position.x - w.pos[0], camRef.position.z - w.pos[2]) : 0;
          let face = toJar, gesture = 'offer';
          if (t > 34.2 && t < 35.4) gesture = null; else if (t >= 35.4 && t < 37.6) { gesture = 'pointFwd'; } else if (t >= 37.6) { face = angLerp(toJar, toCam, clamp((t - 37.6) / .6, 0, 1)); gesture = 'thumb'; }
          return { hidden: t < 29.9, pos: w.pos, facing: moving && t < 33.2 ? w.dir : face, walk: w.phase, stride: clamp(w.speed / .9, 0, 1) * .85, gesture, smile: t > 37.4 ? .8 : .3, talk: t > 37.8 ? .4 + .4 * Math.sin(t * 9) : 0, bow: t > 33.2 && t < 34.3 ? .25 : 0 };
        }, { scale: .72 });
        Wd.on(t => {
          const w = bw(t), dir = t < 33.2 && w.speed > .12 ? w.dir : Math.atan2(JS[0] - w.pos[0], JS[2] - w.pos[2]);
          const hand = new THREE.Vector3(w.pos[0] + Math.sin(dir) * .3, .5, w.pos[2] + Math.cos(dir) * .3);
          const k = ease.io(prog(t, 33.2, 34.1));
          jar.visible = t > 29.9; jar.position.lerpVectors(hand, jarSpot, k); jar.position.y = lerp(.5, standH, k) + .05 * Math.sin(Math.PI * k);
          jar.userData.wat.scale.y = .004 + .05 * ease.sm(prog(t, 35.0, 39.8));
        });
        rain(Wd, { x0: JS[0] - 4.5, x1: JS[0] + 3.5, z0: JS[2] - 4.5, z1: JS[2] + 2.5, top: 6.5, bottom: 0, count: 900, speed: 9, len: .32, color: 0x6f9fd0, opacity: .6, amount: t => .85 * prog(t, 31.0, 33.0) });

        // הרב: מצביע אל הענן, הולך אל הסידור ומתפלל, ואז מביט אל השמים
        const rw = walker([[0, -1.6, -1.6, true], [10.8, -1.6, -1.6, true], [14.4, BOOK[0] - 1.25, BOOK[2] + 1.05, true], [40, BOOK[0] - 1.25, BOOK[2] + 1.05, true]], feet);
        person(Wd, RAV, t => {
          const w = rw(t), moving = w.speed > .15, toCam = camRef ? Math.atan2(camRef.position.x - w.pos[0], camRef.position.z - w.pos[2]) : 0, toBook = Math.atan2(BOOK[0] - w.pos[0], BOOK[2] - w.pos[2]);
          let face = toCam, gesture = null, lookY = 0, perform = 0;
          if (t < 10.8) { gesture = t > 2 ? 'up' : 'explain'; lookY = t > 2 ? -1 : 0; face = toCam - .4; }
          else if (t < 20.5) { face = angLerp(toBook, toCam, .25); gesture = t > 14.6 ? 'pray' : null; }
          else if (t < 30.2) { face = t < 22.8 ? angLerp(toBook, toCam, .9) : toCam - .14; gesture = t > 24.0 ? 'think' : null; lookY = -1; }
          else { face = toCam; gesture = 'explain'; perform = .7; }
          return { pos: w.pos, facing: moving ? w.dir : face, walk: w.phase, stride: clamp(w.speed / 1.1, 0, 1) * .85, gesture: moving ? null : gesture, lookY, perform,
            talk: (t > 3 && t < 9.5) || (t > 30.5) ? .5 + .5 * Math.sin(t * 9.1) : 0, nod: t > 20.5 && t < 30 ? -.05 : 0, tilt: t > 21 && t < 30 ? -.05 : 0 };
        });

        const cam = track([
          [0, [-8.4, 14.6, 14.6], [0, 3.0, -1.4], 50],
          [10.0, [-6.6, 12.6, 14.2], [-.4, 2.8, -1.4], 50],
          [13.4, [-2.4, 7.4, 12.6], [-2.0, 1.9, -1.0], 50],
          [20.0, [-1.9, 6.9, 12.0], [-1.8, 1.8, -1.0], 50],
          [22.8, [2.85, 1.2, 3.45], [4.8, 1.3, .2], 44],
          [29.6, [3.05, 1.15, 3.2], [4.85, 1.35, .15], 42],
          [32.4, [-1.6, 2.6, 13.0], [-5.6, .75, 8.4], 44],
          [36.0, [-2.9, 1.6, 11.4], [-5.7, .72, 8.2], 42],
          [40, [-3.3, 1.35, 10.75], [-5.75, .74, 8.15], 40, true],
        ]);
        fixInk(Wd.scene);
        return Object.assign(Wd, { cam });
      } },
  ],
});
