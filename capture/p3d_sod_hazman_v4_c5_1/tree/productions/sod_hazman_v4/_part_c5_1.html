  const sun = sunBall(Wd, .5); const mark = new THREE.Group(); mark.position.set(5.5, 0, 0); mark.add(cyl(.12, .2, 1.4, 0xd9c9a4, { pos: [0, .7, 0], inkW: .02 })); const mg = O.glow(2.6, 0xffd070, .35); mg.position.y = 1.7; mark.add(mg); Wd.add(mark);
  const ctr = new THREE.Mesh(new THREE.SphereGeometry(.7, 20, 12), toon(0x2a6fb8)); ctr.position.y = 1.4; Wd.add(ctr); Wd.hero = sun; const rg = goldRing(Wd); rg.position.set(5.5, 1.3, 0);

    const arrive = prog(g, t1, t1 + .3); mg.material.opacity = .35 + .65 * bump(g, t1 + .2, .5); mg.scale.setScalar(2.6 * (1 + .7 * bump(g, t1 + .2, .5))); ringAnim(rg, cam, g, t1, 1.3, .6, 3.2, .9); ctr.rotation.y = g * .5; });
  const cam = camSeq(a, b, [{ t: a, p: [[0, 7.5, 12], [-6, 4.6, 10]], l: [0, 1.4, 0], mm: 30 }, { t: b - 3.6, p: [[-6, 4.6, 10], [3.6, 2.4, 6.5]], l: [[0, 1.4, 0], [5.5, 1.2, 0]], mm: [30, 38] }]);

// ---------------------------------------------------------------- L16: the year counter (four drums, the last two roll)
function sDrums() {
  const a = C.START.L16, b = C.ENDOF('L16'), Wd = world({ fog: false }); C.baseCam(Wd, .05, 300);
  K4.boardRoom(Wd, {}); const ds = [0, 1, 2, 3].map(i => K.drum(Wd, { pos: [(i - 1.5) * 1.55, 3.0, 1.2], r: .75, w: 1.0 })); Wd.hero = ds[0].group;
  const from = [5, 7, 6, 9], to = [5, 7, 9, 7], tg = gs('L16', 0);
  Wd.on(t => { const g = t + a; ds.forEach((d, i) => { const k = i < 2 ? 0 : ease.io(prog(g, tg + (i - 2) * .5, tg + 2.6 + (i - 2) * .5)), v = lerp(from[i], to[i], k) + (i < 2 ? 0 : (to[i] > from[i] ? 0 : 10) * k * 0), settle = bump(g, tg + 2.8 + (i - 2) * .5, .4); d.set(i < 2 ? from[i] : lerp(from[i], to[i] < from[i] ? to[i] + 10 : to[i], k), settle); }); });
  const cam = camSeq(a, b, [{ t: a, p: [[0, 3.6, 11], [0, 3.3, 8.2]], l: [0, 3.0, 1], mm: 32 }, { t: tg + 1, p: [[1.4, 3.1, 6.5], [1.6, 3.0, 5.8]], l: [1.4, 3.0, 1.2], mm: 38 }]);
  return C.finish(Wd, cam, { dof: dofOf(cam, { ap: 3 }) });
}

// ---------------------------------------------------------------- L21: hook - a train whistle, steam enters the frame
function sHook() {
  const a = C.START.L21, b = C.ENDOF('L21'), Wd = world({ ground: 'dry', groundSize: 300, groundRep: [50, 50], fog: true, fogColor: 0xd89a70, fogNear: 25, fogFar: 140, skyTop: 0x3a4a8a, skyBottom: 0xf0a868 }); C.baseCam(Wd, .1, 500);
  O.lighting(Wd, { key: [0xffb070, 1.4, [-20, 12, 14]], hemi: [0xe0a890, 0x4a3a30, .9], fill: [0x7a8ac8, .3, [10, 4, 10]], rim: [0xffd0a0, .5, [10, 8, -10]], target: [0, 1, 0], shadowExt: 30, fog: [0xd89a70, 25, 140] });
  Wd.scene.fog = new THREE.Fog(0xd89a70, 25, 140);
  [-.6, .6].forEach(z => Wd.add(box(120, .1, .12, 0x6a6a72, { pos: [0, .2, z], inkW: .01 }))); for (let i = -40; i < 40; i++) Wd.add(box(.25, .1, 1.7, 0x5a3a20, { pos: [i * 1.2, .1, 0], ink: false }));
  O.hills(Wd, { colors: [0x6a6a58, 0x7a7a60], list: [[-30, -60, 30, 7, 16], [30, -64, 34, 9, 18], [0, -80, 60, 12, 20]] });
  const T = steamTrain(Wd, { pos: [0, 0, 0], scale: 1 }); Wd.hero = T.group; const t0 = T0('L21') + 1.2, tg = G0('L21');
  const xAt = t => -8 + 6.5 * ease.io(prog(t, t0, b - .4)); const clouds = []; for (let i = 0; i < 10; i++) { const s = O.glow(5, 0xf4efe6, .0); Wd.add(s); clouds.push(s); }
  Wd.on((t, cam) => { const g = t + a; T.update(g, xAt(g), 1); T.smoke(g, xAt, 0, 0, 2.6);
    clouds.forEach((s, i) => { const k = ease.out(prog(g, a + .2 + i * .25, a + 2.8 + i * .25)), x = lerp(-14, 6, ((g * .06 + i * .13) % 1)); s.position.set(-9 + i * 1.7 + (g - a) * .8, 2.2 + (i % 3) * .7, 2.2 + (i % 4) * .6); s.scale.setScalar(4 + (i % 3)); s.material.opacity = .5 * k * (1 - ease.in(prog(g, b - 2, b - .3))); }); });
  const cam = camSeq(a, b, [{ t: a, p: [[-1, 1.5, 9.5], [1.2, 1.7, 7.2]], l: [[-6, 1.8, 0], [-3, 1.6, 0]], mm: [34, 40], e: 'io' }]);
  return C.finish(Wd, cam, { dof: dofOf(cam, { ap: 4, maxR: 12 }) });
}
