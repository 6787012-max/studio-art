name: job
on:
  workflow_dispatch:
    inputs:
      job: { description: 'jobs/<job>', required: true }
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q "rembg[cpu]" opencv-python-headless pillow numpy
      - run: python3 job_runner.py "${{ inputs.job }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: push results
        run: |
          git config user.name studio-bot
          git config user.email studio-bot@users.noreply.github.com
          git add jobs/${{ inputs.job }}/out
          git commit -m "job ${{ inputs.job }}" || echo "nothing to commit"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep 7; done
