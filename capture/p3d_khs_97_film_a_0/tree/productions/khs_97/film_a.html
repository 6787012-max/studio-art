<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>khs 97 film a</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
// khs_97 / film_a (short97 "or bli kli", light without a vessel), phase B, round 2 (F1-F4 of short97_PHASE_B_FIXES).
// Portrait 1080x1920. OBJECTS ONLY. No people, hands, arms, feet, faces or silhouettes.
// 5 shots; caption boxes B1..B6 from captions_vault.json (shot starts = first box start of each shot).
// Look: deep twilight indigo-plum sky fading to violet, sand-beige plaza, oak plinth, clear soft-teal glass
// vessel with cream rim, warm golden light inside it. No Hebrew in this file: labels come from the vault.
window.CLIP_DUR = 25.54;
window.CAP_FS_SCALE = 1;
import { film, world, THREE, ease, clamp, lerp, mesh, toon, label } from '../../lib/stage3d.js';
import { installRichness } from '../../lib/richness.js';
const VAULT = await (await fetch('captions_vault.json?v=3')).json();

const PI = Math.PI;
const GY = -1.2;                                        // plaza top
const INDIGO = 0x2b1f4f, VIOLET = 0x7b5aa6, PLUM = 0x4a3370, HILL = 0x5a3f86, HILL_D = 0x3e2a64;
const SAND = 0xd9bf96, SAND_D = 0xc4a478, OAK = 0xc08a52, OAK_D = 0x8f5f33;
const TEAL = 0x7fd6cf, TEAL_D = 0x5fb3ab, TEAL_F = 0xd8f6f1, TEAL_L = 0xa6f2e8;
const GOLD = 0xffc24a, AMBER = 0xff9a2e, CREAM = 0xfff1d6, INK = 0x2a1a3a, STAR = 0xfff3c4;
const LEAF = 0x5fae7a, POT = 0xb8733a, STONE = 0xe6dcc4;
const UP = new THREE.Vector3(0, 1, 0);
// vessel geometry: glass body radius VR centred VY above the vessel origin (origin = plinth top + 0)
const VR = .9, VY = 1.0;
const BELLY = GY + .5 + VY;                             // world y of the belly centre (the light sits here)
const HS = 2.6;                                         // halo sprite size (world units)

// soft warm additive glow (no dark ring): radial gradient on a sprite
function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,214,120,1)'); gr.addColorStop(.3, 'rgba(255,170,60,.55)'); gr.addColorStop(1, 'rgba(255,150,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();

const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const sm = (t, a, b) => ease.sm(P(t, a, b));
const mk = (geo, color, o) => { o = o || {}; return mesh(geo, toon(color, o.mat), Object.assign({ inkW: .008, inkColor: INK }, o)); };
const put = (parent, geo, color, pos, o) => { const m = mk(geo, color, Object.assign({ pos }, o || {})); parent.add(m); return m; };
const Sph = (r, a, b) => new THREE.SphereGeometry(r, a || 24, b || 16);
const Cyl = (r1, r2, h, s) => new THREE.CylinderGeometry(r1, r2, h, s || 12);
const Bx = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const cam = (x, y, z, ly) => ({ pos: [x, y, z], look: [0, ly, 0], fov: 50 });

function heroBox(Wd, fn) {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial()); m.visible = false; g.add(m); Wd.add(g);
  Wd.on(t => { const bs = fn(t).filter(Boolean); if (!bs.length) return; const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const b of bs) for (let q = 0; q < 3; q++) { lo[q] = Math.min(lo[q], b[q] - b[q + 3]); hi[q] = Math.max(hi[q], b[q] + b[q + 3]); }
    g.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2); g.scale.set(Math.max(hi[0] - lo[0], .01), Math.max(hi[1] - lo[1], .01), Math.max(hi[2] - lo[2], .01)); });
  Wd.hero = g; return g;
}
// the plaza, violet hills, arches, and a field of small stars and motes in the upper band
function scene(heroFn, fs) {
  const Wd = world({ fogColor: PLUM, fogNear: 30, fogFar: 120, skyTop: INDIGO, skyBottom: VIOLET, hemiSky: 0xb9a6e6, hemiGround: 0x6b5590, hemi: .9, sunColor: 0xffd9a0, sun: .4, sunPos: [-4, 10, 6], shadowExt: 8, skyR: 260 });
  const S = Wd.scene;
  put(S, new THREE.CylinderGeometry(7.6, 7.8, .4, 64), SAND, [0, GY - .2, 0], { ink: false, mat: { emissive: SAND, emissiveIntensity: .3 } });
  put(S, new THREE.CylinderGeometry(4.6, 4.7, .03, 64), SAND_D, [0, GY + .02, 0], { ink: false });
  const h1 = put(S, Sph(1, 36, 20), HILL, [-7, GY, -24], { ink: false }); h1.scale.set(10, 3.6, 1);
  const h2 = put(S, Sph(1, 36, 20), HILL_D, [8, GY, -26], { ink: false }); h2.scale.set(11, 3.0, 1);
  [-4.2, 0, 4.2].forEach(x => put(S, new THREE.TorusGeometry(1.1, .14, 10, 28, PI), STONE, [x, GY, -7], { ink: false }));
  const motes = [];
  for (let i = 0; i < 46; i++) {
    const x = -7 + 14 * ((i * .618) % 1), y = 2.5 + 6.5 * ((i * .381 + .2) % 1), z = -10 - 6 * ((i * .293) % 1);
    const m = put(S, Sph(.06 + .03 * (i % 3), 8, 6), STAR, [x, y, z], { ink: false, mat: { emissive: STAR, emissiveIntensity: 1.2 } });
    m.userData.y0 = y; motes.push(m);
  }
  heroBox(Wd, heroFn);
  Wd.on(t => { window.CAP_FS_SCALE = fs || 1; motes.forEach((m, i) => { m.position.y = m.userData.y0 + .15 * Math.sin(t * .5 + i); }); });
  const rich = installRichness(S); Wd.on(rich.onFrame);   // scene-richness probe for verify_scene.py
  return { Wd, S };
}
// a plaque: cream board with the vault label, always facing the camera
function plaque(Wd, text, pos, o) {
  o = o || {};
  const sp = label(Wd, text, { size: 96, height: o.h || .6, bg: 'rgba(255,241,214,.95)', color: '#2a1a3a', weight: 800, pos });
  sp.userData.text = true; sp.visible = false; return sp;
}

// the whole set for one shot (each shot builds its own scene; each shot shows what it needs)
function build(heroFn, fs) {
  const { Wd, S } = scene(heroFn, fs);
  const E = { Wd, S };
  // oak plinth and the clear soft-teal glass vessel (group at the plinth top)
  E.plinth = put(S, Cyl(.9, 1.0, .5, 40), OAK, [0, GY + .25, 0], { ink: false });
  put(S, Cyl(1.05, 1.1, .12, 40), OAK_D, [0, GY + .06, 0], { ink: false });
  E.vg = new THREE.Group(); E.vg.position.set(0, GY + .5, 0); S.add(E.vg);
  const glassMat = { transparent: true, opacity: .5, depthWrite: false, emissive: TEAL, emissiveIntensity: .35 };
  E.glass = put(E.vg, Sph(VR, 40, 30), TEAL, [0, VY, 0], { ink: false, mat: Object.assign({}, glassMat) });
  E.glass.scale.set(1, 1.1, 1);
  E.neck = put(E.vg, Cyl(.28, .36, .4, 24), TEAL, [0, 2.19, 0], { ink: false, mat: Object.assign({}, glassMat) });
  put(E.vg, new THREE.TorusGeometry(.34, .05, 12, 32), CREAM, [0, 2.4, 0], { ink: false, rot: [PI / 2, 0, 0] });
  // cream contour: back-face shell slightly bigger than the glass, glows in S5
  E.outline = put(E.vg, Sph(VR + .06, 40, 30), CREAM, [0, VY, 0], { ink: false, mat: { side: THREE.BackSide, transparent: true, opacity: 0, depthWrite: false, emissive: CREAM, emissiveIntensity: .8 } });
  E.outline.scale.set(1, 1.1, 1);
  // ghost of a smaller vessel: clear teal back-face outline (S5)
  E.ghost = put(E.vg, Sph(VR, 32, 24), TEAL_L, [0, VY, 0], { ink: false, mat: { side: THREE.BackSide, transparent: true, opacity: 0, depthWrite: false } });
  E.shine = put(E.vg, Bx(.14, 1.5, .04), CREAM, [0, VY, .72], { ink: false, mat: { emissive: CREAM, emissiveIntensity: 1.5, transparent: true, opacity: 0, depthWrite: false } });
  // the golden light (orb), its soft warm glow (sprite, additive), the sparks it bursts into, and the star emblem (label LBL_F)
  E.orb = put(S, Sph(.34, 28, 20), GOLD, [0, GY + 3.05, 0], { ink: false, mat: { emissive: GOLD, emissiveIntensity: 1.6 } });
  E.halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffffff, transparent: true, opacity: .8, depthWrite: false, blending: THREE.AdditiveBlending }));
  E.halo.position.set(0, GY + 3.05, 0); E.halo.scale.setScalar(HS); S.add(E.halo);
  // draw the light after the glass, so the glass does not tint it green: glass renders first (renderOrder 1), light last
  E.orb.material.transparent = true; E.orb.material.opacity = 1; E.orb.renderOrder = 5;
  E.glass.renderOrder = 1; E.neck.renderOrder = 1; E.halo.renderOrder = 6;
  E.emb = label(Wd, VAULT.LBL_F, { size: 96, height: .42, bg: 'rgba(255,241,214,.95)', color: '#2a1a3a', weight: 800, pos: [0, GY + 3.05, .4] });
  E.emb.visible = false; E.emb0 = E.emb.scale.clone();
  E.sparks = [];
  for (let i = 0; i < 14; i++) {
    const a = i * 2.39996, fr = (i * .618) % 1;
    const d = new THREE.Vector3(Math.cos(a), .3 + .7 * fr, Math.sin(a)).normalize();
    const m = put(S, Sph(.07, 10, 8), GOLD, [0, GY + 3.05, 0], { ink: false, mat: { emissive: GOLD, emissiveIntensity: 2, transparent: true, opacity: 1, depthWrite: false } });
    m.visible = false; E.sparks.push({ m, d, r: .6 + .6 * fr });
  }
  // light rays: start at the glass surface of the vessel and fall outward and down to the plaza (S4, S5)
  E.rays = [];
  for (let i = 0; i < 8; i++) {
    const a = i * PI / 4, dir = new THREE.Vector3(Math.cos(a), -.9, Math.sin(a)).normalize();
    const r = put(S, Cyl(.05, .05, 1, 8), GOLD, [0, BELLY, 0], { ink: false, mat: { emissive: GOLD, emissiveIntensity: 1.4, transparent: true, opacity: 0, depthWrite: false } });
    r.quaternion.setFromUnitVectors(UP, dir);
    r.position.set(0, BELLY, 0).addScaledVector(dir, VR + .7); r.scale.set(1, 1.4, 1);
    r.visible = false; E.rays.push(r);
  }
  // columns at the back and the side (lit in S4), potted plants at the sides
  E.cols = [put(S, Cyl(.28, .32, 3.2, 16), STONE, [-3.2, GY + 1.6, -5.0], { ink: false }), put(S, Cyl(.28, .32, 3.2, 16), STONE, [3.2, GY + 1.6, -5.0], { ink: false })];
  [-1.6, 1.6].forEach(x => { put(S, Cyl(.3, .24, .45, 14), POT, [x, GY + .22, 3.2], { ink: false }); put(S, Sph(.45, 16, 12), LEAF, [x, GY + .85, 3.2], { ink: false }); });
  // in-scene labels (plaques from the vault); side plaques sit beside the vessel, not on it
  E.lblA = plaque(Wd, VAULT.LBL_A, [-1.75, GY + 1.2, .3]);
  E.lblC = plaque(Wd, VAULT.LBL_C, [1.75, GY + 1.6, .3]);
  E.lblE = plaque(Wd, VAULT.LBL_E, [1.6, GY + 1.7, .5]);
  E.lblD = plaque(Wd, VAULT.LBL_D, [0, GY + .4, 1.25], { h: .5 });
  E.lblG = plaque(Wd, VAULT.LBL_G, [-1.7, GY + 3.7, -5.0]);
  E.lblH = plaque(Wd, VAULT.LBL_H, [1.0, GY + 2.6, .9]);
  return E;
}

// shot 1 (0.00-3.32): a golden light floats above the plinth (plaques LBL_A, LBL_C); the empty glass vessel rises
// from the plinth; the orb descends toward the vessel rim. Camera: slow push-in.
function b1() {
  const E = build(() => [[0, GY + 1.7, 0, 1.0, 1.25, 1.0]], 1);
  E.Wd.cam = lt => cam(0, .4 + .2 * sm(lt, 0, 3.32), 9.6 - 1.2 * sm(lt, 0, 3.32), -.6);
  E.Wd.on(t => {
    const u = sm(t, 0, 1.4);
    E.vg.scale.setScalar(lerp(.2, 1, u)); E.vg.position.y = GY + .5 - .6 * (1 - u);
    E.orb.position.y = lerp(GY + 3.6, GY + 3.05, sm(t, .3, 3.0)) + .05 * Math.sin(t * 2.2);
    E.halo.position.copy(E.orb.position); E.halo.scale.setScalar(HS * (1 + .08 * Math.sin(t * 3)));
    E.lblA.visible = true; E.lblC.visible = true;
  });
  return E.Wd;
}

// shot 2 (3.32-8.86): the vessel dissolves; the orb is shown WITHOUT it and bursts into sparks that drift
// apart and fade over the plaza; the star emblem (LBL_F) inside cracks and fades; plaque LBL_E. Camera: low push + small arc.
function b2() {
  const E = build(() => [[0, GY + 2.6, 0, 1.6, 2.6, 1.0]], .9);
  E.Wd.cam = lt => { const a = .25 * sm(lt, 0, 5.54), d = lerp(9.6, 7.8, sm(lt, 0, 5.54)); return cam(d * Math.sin(a), .4, d * Math.cos(a), 0); };
  E.Wd.on(t => {
    const k = 1 - sm(t, 0, .8);
    E.vg.scale.setScalar(Math.max(k, .001)); E.vg.visible = k > .01;
    const oc = new THREE.Vector3(0, GY + 3.05, 0);
    const ok = t < 1.1 ? 1 - .6 * sm(t, .6, 1.1) : 0;
    E.orb.visible = t < 1.1; E.orb.scale.setScalar(Math.max(ok, .01)); E.halo.visible = t < 1.1; E.halo.scale.setScalar(HS * Math.max(ok, .01) * 1.3);
    E.sparks.forEach(s => {
      const r = t < .7 ? 0 : s.r * sm(t, .7, 2.8) * 2.8;
      s.m.visible = t >= .7 && t < 4.0;
      s.m.position.set(oc.x + s.d.x * r, oc.y + s.d.y * r - .3 * sm(t, .7, 3.5), oc.z + s.d.z * r);
      s.m.material.opacity = 1 - sm(t, 1.8, 3.4);
    });
    E.emb.visible = t < 1.4; E.emb.position.set(0, GY + 3.05, .4);
    E.emb.scale.copy(E.emb0).multiplyScalar(1 - .6 * sm(t, .4, 1.4)); E.emb.material.opacity = 1 - sm(t, .4, 1.4);
    E.lblE.visible = true;
  });
  return E.Wd;
}

// shot 3 (8.86-14.31): the vessel re-forms; sparks gather and the orb settles INSIDE the belly (plaque LBL_D on the base);
// the glass sweeps a white shine and clears, but stays darker than the bright light inside. Camera: half arc (40 deg).
function b3() {
  const E = build(() => [[0, GY + 1.7, 0, 1.0, 1.25, 1.0]], 1);
  E.Wd.cam = lt => { const a = lerp(0, .7, sm(lt, 0, 5.45)); return cam(9.0 * Math.sin(a), .6, 9.0 * Math.cos(a), -.6); };
  E.Wd.on(t => {
    const u = sm(t, 0, 1.0);
    E.vg.visible = true; E.vg.scale.setScalar(lerp(.2, 1, u)); E.vg.position.y = GY + .5;
    // glass: frosted pale teal -> clearer but duller teal (always darker than the light inside)
    const c = new THREE.Color(TEAL_F).lerp(new THREE.Color(TEAL_D), sm(t, 1.0, 3.0));
    E.glass.material.color.copy(c); E.neck.material.color.copy(c);
    E.glass.material.opacity = lerp(.7, .5, sm(t, 1.0, 3.0)); E.neck.material.opacity = E.glass.material.opacity;
    const sp = sm(t, .2, 2.2);
    E.sparks.forEach(s => {
      const r = s.r * (1 - sp) * 2.2;
      s.m.visible = t < 2.4;
      s.m.position.set(s.d.x * r, BELLY + s.d.y * r, s.d.z * r);
      s.m.material.opacity = 1 - sm(t, 1.9, 2.4);
    });
    const oa = sm(t, 1.4, 2.6);
    E.orb.visible = true; E.orb.position.set(0, BELLY, 0); E.orb.scale.setScalar(Math.max(oa, .01));
    E.orb.material.emissiveIntensity = 2.2 + .3 * Math.sin(t * 4);
    E.halo.visible = true; E.halo.position.set(0, BELLY, 0); E.halo.scale.setScalar(HS * Math.max(oa, .01));
    E.shine.position.x = lerp(-.5, .5, sm(t, 1.4, 3.2));
    E.shine.material.opacity = .55 * Math.sin(PI * P(t, 1.4, 3.2));
    E.lblD.visible = t >= .6;
    E.lblA.visible = false;
  });
  return E.Wd;
}

// shot 4 (14.31-17.61): the camera tilts up from the plaza to the glow; the light shines through the glass,
// rays start at the glass surface and fall to the floor and the columns; the column plaque LBL_G lights up.
function b4() {
  const E = build(() => [[0, GY + 1.7, 0, 1.2, 1.4, 1.0]], 1);
  E.Wd.cam = lt => cam(0, -.6, 7.8, lerp(-.8, .6, sm(lt, 0, 3.3)));
  E.Wd.on(t => {
    E.orb.position.set(0, BELLY, 0); E.halo.position.set(0, BELLY, 0);   // the light stays inside the belly
    const pulse = .8 + .2 * Math.sin(t * 5);
    E.orb.material.emissiveIntensity = 2.6 * pulse;
    E.halo.scale.setScalar(HS * (1 + .6 * sm(t, 0, 1.2))); E.halo.material.opacity = .6 + .3 * sm(t, 0, 1.2);
    E.glass.material.color.set(TEAL); E.glass.material.opacity = .5; E.neck.material.opacity = .5;
    E.rays.forEach((r, i) => { r.visible = true; r.material.opacity = .6 * sm(t, .2 + .05 * i, 1.2 + .05 * i) * pulse; });
    E.lblG.visible = true; E.lblG.material.opacity = .5 + .5 * sm(t, 0, 1.0);
    E.cols.forEach(c => { c.material.emissive.set(GOLD); c.material.emissiveIntensity = .35 * sm(t, .4, 1.6); });
  });
  return E.Wd;
}

// shot 5 (17.61-25.54): the vessel outline glows cream; a clear teal ghost of a slightly smaller vessel closes in
// around the light and dissolves over 1.5 s (the true vessel stays); plaque LBL_H; the camera rises and pulls back.
function b5() {
  const E = build(() => [[0, GY + 2.0, 0, 1.6, 2.6, 1.0]], .9);
  E.Wd.cam = lt => { const v = sm(lt, .5, 7.5); return cam(0, lerp(.4, 3.4, v), lerp(8.0, 13.0, v), lerp(0, .9, v)); };
  E.Wd.on(t => {
    E.orb.position.set(0, BELLY, 0); E.halo.position.set(0, BELLY, 0);   // the light stays inside the belly
    E.outline.material.opacity = .75 * sm(t, .2, 1.2) * (.85 + .15 * Math.sin(t * 3));
    const gk = lerp(.95, .55, sm(t, .8, 2.6));
    E.ghost.scale.set(gk, 1.1 * gk, gk);
    E.ghost.material.opacity = .5 * sm(t, .4, 1.0) * (1 - sm(t, 2.6, 4.1));
    E.orb.material.emissiveIntensity = 1.9;
    E.glass.material.color.set(TEAL); E.glass.material.opacity = .5; E.neck.material.opacity = .5;
    E.rays.forEach(r => { r.visible = true; r.material.opacity = .35; });
    E.lblH.visible = t >= 1.2; E.lblH.material.opacity = sm(t, 1.2, 2.0);
    E.lblG.visible = true; E.lblG.material.opacity = .6;
  });
  return E.Wd;
}

const SH = (id, dur, caps, capAt, build) => ({ id, dur, wide: true, caps, capAt, build });
film({
  W: 1080, H: 1920, xf: .0001, vault: 'captions_vault.json',
  shots: [
    SH('s01', 3.32, ['G_CAP_01'], [0, 3.32], b1),
    SH('s02', 5.54, ['G_CAP_04'], [0, 5.54], b2),
    SH('s03', 5.45, ['G_CAP_08'], [0, 5.45], b3),
    SH('s04', 3.30, ['G_CAP_13'], [0, 3.30], b4),
    SH('s05', 7.93, ['G_CAP_15', 'G_CAP_17'], [0, 3.30], b5),
  ]
});
// the caption gate (window.__caption) does not run the shot updaters, so give it the font step of the shot at time t
const CAP_SCALE_BY_SHOT = [1, 1, 1, 1, 1], SHOT_START = [0, 3.32, 8.86, 14.31, 17.61];
if (typeof window.__caption === 'function') {
  const origCaption = window.__caption;
  window.__caption = t => { let k = 0; while (k < SHOT_START.length - 1 && t >= SHOT_START[k + 1]) k++; window.CAP_FS_SCALE = CAP_SCALE_BY_SHOT[k]; return origCaption(t); };
}
</script>
</html>
