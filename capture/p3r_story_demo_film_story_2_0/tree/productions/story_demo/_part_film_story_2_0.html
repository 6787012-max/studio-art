// "Uri and the little robot" - 11 shots, children ~10, toon + ink. Deterministic: every motion is a pure function of t.

// ---------------- shared look constants ----------------

const MAN_B = { coat: '#2f3b4c', beard: '#6b5a48', beardLen: .45, hat: 'kippa', skin: '#e6bf9a', pants: '#1f2128', glasses: true };
const uri = (Wd, fn) => person(Wd, BOY, t => Object.assign({ scale: .72, smile: .6 }, fn(t)));
const sky = o => Object.assign({ ground: 'grass', skyTop: 0x4f9fe8, skyBottom: 0xfbe8c4, fogColor: 0xeaeedd, fogNear: 50, fogFar: 220, shadowExt: 30 }, o);
const mix3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const angMix = (a, b, k) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * k;
const faceTo = (from, to) => Math.atan2(to[0] - from[0], to[2] - from[2]);

// route: keys [[t,x,z,facing?],...] -> t => {pos, facing, walk?}  (stands when two keys are equal) - same as road.js, ground y = 0
function route(keys) {
  const K = keys.map(k => ({ t: k[0], x: k[1], z: k[2], f: k[3] })), n = K.length, seg = []; let ph = 0, head = K[0].f !== undefined ? K[0].f : 0;
  for (let i = 0; i < n - 1; i++) { const dx = K[i + 1].x - K[i].x, dz = K[i + 1].z - K[i].z, dist = Math.hypot(dx, dz), dt = Math.max(K[i + 1].t - K[i].t, 1e-3), mv = dist > .05, rate = clamp(dist / dt * 6.3, 3, 10);
    head = mv ? Math.atan2(dx, dz) : (K[i].f !== undefined ? K[i].f : head); seg.push({ mv, h: head, ph0: ph, rate }); if (mv) ph += rate * dt; }
  return t => { let i = 0; while (i < n - 2 && t > K[i + 1].t) i++; const l = clamp((t - K[i].t) / (K[i + 1].t - K[i].t || 1), 0, 1), s = seg[i]; let h = s.h;
    if (i > 0) { const hp = seg[i - 1].h, d = Math.atan2(Math.sin(h - hp), Math.cos(h - hp)); h = hp + d * ease.sm(clamp((t - K[i].t) / .5, 0, 1)); }

}
// cine: camera in polar coordinates around a moving target (monotone Hermite) - same as road.js

  return t => { let i = 0; while (i < n - 2 && t > K[i + 1].t) i++; const dt = K[i + 1].t - K[i].t, s = clamp((t - K[i].t) / dt, 0, 1), s2 = s * s, s3 = s2 * s;

}
const mkShot = (dur, caps, build, capAt, wide) => ({ dur, caps, capAt: capAt || caps.map((_, i) => .15 + i * (dur - .45) / caps.length), build, wide: !!wide });
const clouds = (Wd, list) => list.forEach(([x, y, z, s, sd]) => Wd.add(cloud({ seed: sd, size: s, color: 0xffffff, pos: [x, y, z] })));
// debug-only tracker (used by the measure tool): registered actors are projected with the camera of the frame that was just rendered

window.__trAll = sid => {

  for (const [k, h] of Object.entries(window.__ACT || {})) { if (!k.startsWith(sid + '.')) continue; const o = (h.figure && h.figure.group) || h.group || h; o.updateWorldMatrix(true, true);
    const bx = new THREE.Box3().setFromObject(o, true); if (bx.isEmpty()) continue; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, front = 0; const v = new THREE.Vector3();

const SHOTS = [

  // 4 - at the well: the lost robot (Idle, then Wave); Uri arrives. orbit around the robot, ends on both
  mkShot(10, ['ליד הבאר עמד רובוט קטן ועצוב.', 'הוא נופף ואמר: שלום, חבר!'], () => {

    const RB = [-2.5, 0, -3.7], UF = [-.2, 0, -3.1], T = [-1.3, 0, -3.4];

  mkShot(10, ['בכיכר היו הרבה אנשים.', 'שאלו אותם, אבל אף אחד לא ידע.'], () => {

    const UH = uri(Wd, t => Object.assign({ smile: .5, gesture: t > 2.9 ? 'explain' : undefined, talk: t > 2.9 ? .5 + .5 * Math.sin(t * 8) : 0 }, ur(t)));
    const MA = [-1.4, 0, 1.9], MB = [-3.2, 0, 1.0];

    person(Wd, MAN_B, t => ({ pos: MB, facing: faceTo(MB, UT), gesture: t > 6.5 ? 'shrug' : 'rest', smile: .3, seed: .7 }));
