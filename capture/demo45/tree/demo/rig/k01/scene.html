<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>נס המטוס: הדגמת בובה מאיורים</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../lib/marionette.js"></script>
<script src="../../../lib/sprite_rig.js"></script>
<script src="cues.js"></script>
<script src="subs.js"></script>
<script>
'use strict';
// הדגמה: 45 השניות הראשונות של "נס המטוס". הכול זז מקוד: המספר (בובת חיתוכים מאיורים, סנכרון שפתיים
// לקול של הרב), שכבות עומק בבית המדרש, והמטוס בין העננים. פונקציה של הזמן בלבד — הצילום קורא ל-__seek(t).
const M = MARIONETTE, T = M.track, EASE = M.EASE, clamp = M.clamp, lerp = M.lerp;
const W = 1920, H = 1080, FPS = 30, SUBS_N = 5, DUR = 45;
const main = document.getElementById('c'), mg = main.getContext('2d');
const sub = document.createElement('canvas'); sub.width = W; sub.height = H; const sg = sub.getContext('2d');
const IMG = {}, loadImg = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; });
let RIG = null;

// ---------- איזה קטע מתי ----------
const SHOTS = [[0, 'room'], [5.9, 'sky'], [18.2, 'room'], [28.1, 'sky'], [43.6, 'room']];
const shotAt = t => { let s = SHOTS[0]; for (const x of SHOTS) if (t >= x[0]) s = x; return s; };

// ---------- קפיצים: כל זווית רודפת אחרי היעד שלה ועוברת אותו קצת (תנועה חיה, לא רובוטית) ----------
function springTrack(fn, k, c) {
  let st = null;
  return t => {
    if (!st || t < st.t - 1e-9) st = { t: 0, p: fn(0), v: 0 };
    while (st.t < t - 1e-9) { const h = Math.min(1 / 240, t - st.t); st.t += h; st.v += (k * (fn(st.t) - st.p) - c * st.v) * h; st.p += st.v * h; }
    return st.p;
  };
}

// ---------- מחוות המספר (במעלות). ההכנה הקטנה לפני כל תנועה גדולה — כתובה במפתחות ----------
// A = יד ימין שלו (שמאל המסך), B = יד שמאל שלו
const K = (keys) => T(keys);
const RA = [96, -6], RB = [84, 6];
const uA = K([[0, RA[0]], [.35, 104], [.75, 200, 'out'], [2.2, 200], [2.6, RA[0]], [3.4, RA[0]], [3.8, 128, 'out'], [5.2, 128], [5.6, RA[0]],
             [18.2, RA[0]], [24.6, RA[0]], [24.9, 150, 'out'], [27.6, 150], [28.0, RA[0]], [43.6, RA[0]], [43.9, 128, 'out']]);
const eA = K([[0, RA[1]], [.35, -20], [.75, 75, 'back'], [2.2, 75], [2.6, RA[1]], [3.4, RA[1]], [3.8, -78, 'out'], [5.2, -78], [5.6, RA[1]],
             [18.2, RA[1]], [24.6, RA[1]], [24.9, 32, 'out'], [27.6, 32], [28.0, RA[1]], [43.6, RA[1]], [43.9, -62, 'out']]);
const uB = K([[0, RB[0]], [18.2, RB[0]], [18.9, RB[0]], [19.3, 62, 'out'], [22.3, 62], [22.7, RB[0]], [23.1, RB[0]], [23.5, 58, 'out'], [24.5, 58],
             [24.9, 30, 'out'], [27.6, 30], [28.0, RB[0]], [43.6, RB[0]], [43.9, 52, 'out']]);
const eB = K([[0, RB[1]], [18.2, RB[1]], [18.9, RB[1]], [19.3, -150, 'back'], [22.3, -150], [22.7, RB[1]], [23.1, RB[1]], [23.5, 78, 'out'], [24.5, 78],
             [24.9, -30, 'out'], [27.6, -30], [28.0, RB[1]], [43.6, RB[1]], [43.9, 62, 'out']]);
const SPR = [300, 22];
const sA = { u: springTrack(uA, ...SPR), e: springTrack(eA, ...SPR) }, sB = { u: springTrack(uB, ...SPR), e: springTrack(eB, ...SPR) };
const waveW = t => (t > .75 && t < 2.3) ? 14 * Math.sin((t - .75) * 2 * Math.PI * 2.3) * Math.min(1, (2.3 - t) * 3) : 0;
const handA = t => (t > .45 && t < 2.45) ? 'wave' : (t > 3.6 && t < 5.4) || (t > 24.8 && t < 27.8) || t > 43.8 ? 'wave' : 'rest';
const handB = t => (t > 19.1 && t < 22.5) ? 'point' : (t > 23.3 && t < 27.8) || t > 43.8 ? 'wave' : 'rest';
const BLINKS = [1.1, 4.3, 19.6, 23.0, 26.3, 44.2];
const blink = t => { let b = 0; for (const x of BLINKS) { const k = (t - x) / .17; if (k > 0 && k < 1) b = Math.max(b, 1 - Math.abs(2 * k - 1)); } return b; };
const headRot = t => 2.2 * Math.sin(t * 1.3) + 1.4 * Math.sin(t * 3.1 + 1) + ((t > 25 && t < 27.6) ? 7 * Math.sin((t - 25) * 9) * Math.min(1, (27.6 - t) * 2) : 0);
const nodT = springTrack(T([[0, 0], [19.2, 0], [19.4, 1], [19.7, 0], [23.4, 0], [23.6, .8], [23.9, 0], [43.8, 0], [44.0, -.6], [44.3, 0]]), 260, 16);
const squashT = springTrack(T([[0, 0], [.3, -.6], [.75, .5], [1.1, 0], [18.9, 0], [19.1, -.5], [19.35, .4], [19.7, 0], [24.6, 0], [24.8, -.6], [25.0, .5], [25.4, 0], [43.6, 0], [43.75, -.4], [44.0, .3], [44.3, 0]]), 200, 14);

function narrator(t) {
  return {
    head: { rot: headRot(t), nod: nodT(t), mouth: SPRITE_RIG.mouthAt(CUES, t), blink: blink(t) },
    arms: { A: { u: sA.u(t), e: sA.e(t), w: waveW(t), hand: handA(t) }, B: { u: sB.u(t), e: sB.e(t), hand: handB(t) } },
    squash: squashT(t), breath: Math.sin(t * 2 * Math.PI / 3.6), lean: .8 * Math.sin(t * .7),
  };
}

// ---------- מצלמה ושכבות ----------
function cover(g, im, cx, cy, z, px, py) {
  const s = Math.max(W / im.width, H / im.height) * z;
  g.drawImage(im, cx - im.width * s / 2 + px, cy - im.height * s / 2 + py, im.width * s, im.height * s);
}
const roomCam = t => ({ z: 1.04 + .05 * EASE.io(clamp(((t < 18.2 ? t : t - 18.2)) / 10)), x: 12 * Math.sin(t * .23), y: 6 * Math.sin(t * .31) });

const MOTES = Array.from({ length: 70 }, (_, i) => ({ x: (i * 397) % 1920, y: (i * 613) % 1080, s: 1 + (i % 5) * .6, v: .3 + (i % 7) * .08, ph: i }));
function drawRoom(g, t) {
  const cam = roomCam(t);
  cover(g, IMG.roomB, W / 2, H / 2, cam.z * 1.02, -cam.x * .35, -cam.y * .35);
  // אור חלון מהבהב בעדינות
  g.save(); g.globalCompositeOperation = 'screen';
  const gr = g.createRadialGradient(980 - cam.x * .35, 330, 40, 980, 420, 760); gr.addColorStop(0, `rgba(255,214,150,${.22 + .03 * Math.sin(t * 1.7)})`); gr.addColorStop(1, 'rgba(255,214,150,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
  // הדמות
  const sc = .84 * cam.z;
  g.drawImage(IMG.shadow, 760 - cam.x - 260 * cam.z, 1036 - 60, 520 * cam.z, 120);
  SPRITE_RIG.draw(g, RIG, Object.assign({ x: 760 - cam.x, y: 1030 - cam.y, sc }, narrator(t)));
  // אבק באור
  g.save(); g.globalCompositeOperation = 'screen';
  for (const m of MOTES) { const x = (m.x + t * 18 * m.v + 30 * Math.sin(t * .4 + m.ph)) % 1920, y = (m.y - t * 10 * m.v + 1080) % 1080; const a = .25 + .25 * Math.sin(t * 1.5 + m.ph);
    g.fillStyle = `rgba(255,236,200,${a * clamp(1 - Math.abs(x - 1000) / 700)})`; g.beginPath(); g.arc(x, y, m.s, 0, 7); g.fill(); }
  g.restore();
  // שולחן בקדמה — זז מהר יותר (עומק)
  const tb = IMG.tableB, ts = 1.55 * cam.z;
  g.drawImage(tb, 1180 - cam.x * 1.6, 1080 - tb.height * ts * .62 - cam.y * 1.6, tb.width * ts, tb.height * ts);
}

// ---------- השמים והמטוס ----------
const CLOUDS = Array.from({ length: 14 }, (_, i) => ({ d: [.25, .5, 1.1][i % 3], y: [300, 520, 760][i % 3] + ((i * 71) % 140) - 70, x: (i * 523) % 2600, k: i % 2, s: [.45, .75, 1.35][i % 3] }));
function planeMotion(t) {
  // 5.9-18.2 צלילה ויציאה ממנה; 28.1-33.5 טיסה שלווה; 33.5-43.6 הטייס-משנה מסיט ומפיל
  let pitch = 0, bank = 0, dy = 0, shake = 0, alarm = 0;
  if (t < 18.2) {
    const k = clamp((t - 6.2) / 2.2), r = clamp((t - 13.5) / 3);
    pitch = 24 * EASE.io(k) * (1 - EASE.io(r)); dy = 260 * EASE.io(k) * (1 - EASE.io(r)); shake = (k > 0 && r < 1) ? 1 - r : 0; alarm = shake * .6;
  } else {
    const k = clamp((t - 34.2) / 1.6), k2 = clamp((t - 41.5) / 1.5);
    bank = -22 * EASE.io(k) + 8 * Math.sin(t * 2.3) * k; pitch = 10 * EASE.io(k) + 18 * EASE.io(k2); dy = 120 * EASE.io(k) + 220 * EASE.io(k2);
    shake = k * .7 + k2 * .5; alarm = k;
  }
  return { pitch, bank, dy, shake, alarm };
}
function drawSky(g, t) {
  const pm = planeMotion(t), sh = pm.shake * 9, sx = sh * Math.sin(t * 47), sy = sh * Math.sin(t * 39 + 1);
  cover(g, IMG.sky, W / 2 + sx * .3, H / 2 - pm.dy * .15 + sy * .3, 1.08, 0, 0);
  const speed = 160 + pm.pitch * 6;
  const layer = d => { for (const c of CLOUDS.filter(c => c.d === d)) {
    const im = d > 1 ? (c.k ? IMG.cloud2B : IMG.cloud1B) : (c.k ? IMG.cloud2 : IMG.cloud1), w = im.width * c.s, x = ((c.x - t * speed * c.d) % 2600 + 2600) % 2600 - 400;
    g.save(); g.globalAlpha = d < .4 ? .75 : 1;
    g.drawImage(im, x + sx * d, c.y - pm.dy * d * .25 + sy * d, w, im.height * c.s); g.restore(); } };
  layer(.25); layer(.5);
  // המטוס: נדנוד קטן תמידי + הצלילה/ההטיה
  const pl = IMG.plane, ps = 1.25, cx = 960 + 40 * Math.sin(t * .6) + sx, cy = 470 + pm.dy + 14 * Math.sin(t * 1.9) + sy;
  g.save(); g.translate(cx, cy); g.rotate((pm.pitch + 2 * Math.sin(t * 1.3)) * Math.PI / 180); g.scale(1, Math.cos(pm.bank * Math.PI / 180));
  g.drawImage(pl, -pl.width * ps / 2, -pl.height * ps / 2, pl.width * ps, pl.height * ps); g.restore();
  layer(1.1);
  if (pm.alarm > .02) { g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = `rgba(255,120,110,${pm.alarm * (.25 + .2 * Math.max(0, Math.sin(t * 8)))})`; g.fillRect(0, 0, W, H); g.restore(); }
}

// ---------- כתוביות וכותרת ----------
function text(g, s, x, y, font, fill, stroke, lw, a) {
  g.save(); g.globalAlpha = a; g.font = font; g.direction = 'rtl'; g.textAlign = 'center'; g.lineJoin = 'round';
  g.strokeStyle = stroke; g.lineWidth = lw; g.strokeText(s, x, y); g.fillStyle = fill; g.fillText(s, x, y); g.restore();
}
function overlays(g, t) {
  const ta = clamp((t - .4) / .4) * clamp((5.6 - t) / .4);
  if (ta > 0) { text(g, 'נס המטוס', 1450, 420, '400 150px "Secular One"', '#fff', '#14203a', 16, ta);
    text(g, "משל לעבודת ה'", 1450, 510, '700 62px Assistant', '#ffc850', '#101010', 10, ta);
    text(g, 'קצר ולענין · הרב אבשלום שניידר', 1450, 585, '700 46px Assistant', '#ffffff', '#101010', 9, ta); }
  const s = SUBS.find(s => t >= s.t0 && t < s.t1);
  if (s) text(g, s.text, W / 2, H - 70, '700 70px Assistant', '#fff', '#101010', 11, 1);
}

function renderScene(g, t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.filter = 'none'; g.globalAlpha = 1;
  const [t0, kind] = shotAt(t);
  if (kind === 'room') drawRoom(g, t); else drawSky(g, t);
  const since = t - t0, fade = clamp(1 - since / .35);            // מעבר רך בין קטעים
  if (fade > 0 && t0 > 0) { g.fillStyle = `rgba(0,0,0,${fade * .85})`; g.fillRect(0, 0, W, H); }
  overlays(g, t);
  const vig = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.0); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(15,8,3,.45)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
}

window.__seek = t => {
  const sh = .5 / FPS;
  for (let i = 0; i < SUBS_N; i++) { renderScene(sg, Math.max(0, t + (i / (SUBS_N - 1) - .5) * sh)); mg.globalAlpha = 1 / (i + 1); mg.drawImage(sub, 0, 0); }
  mg.globalAlpha = 1;
};
Promise.all([
  SPRITE_RIG.loadSync('../../../assets/rig/haredi').then(r => { RIG = r; }),
  loadImg('room', '../../../assets/ai/demo1/bg_room_empty.png'), loadImg('sky', '../../../assets/ai/demo1/sky_plate.png'),
  loadImg('table', '../../../assets/rig/props/fg_table.png'), loadImg('plane', '../../../assets/rig/props/plane_side.png'),
  loadImg('cloud1', '../../../assets/rig/props/cloud_1.png'), loadImg('cloud2', '../../../assets/rig/props/cloud_2.png'),
  document.fonts.load('400 128px "Secular One"'), document.fonts.load('700 70px Assistant'),
]).then(() => {
  // טשטוש מחושב פעם אחת (ולא בכל פריים — זה מה שהאט)
  const blurred = (im, px, pad) => { pad = pad || 0; const c = document.createElement('canvas'); c.width = im.width + pad * 2; c.height = im.height + pad * 2; const x = c.getContext('2d'); x.filter = `blur(${px}px)`; x.drawImage(im, pad, pad); return c; };
  IMG.roomB = blurred(IMG.room, 2.5); IMG.tableB = blurred(IMG.table, 5, 12);
  IMG.cloud1B = blurred(IMG.cloud1, 6, 14); IMG.cloud2B = blurred(IMG.cloud2, 6, 14);
  const sh = document.createElement('canvas'); sh.width = 520; sh.height = 120; const x = sh.getContext('2d'); x.filter = 'blur(12px)'; x.fillStyle = 'rgba(30,15,5,.4)'; x.beginPath(); x.ellipse(260, 60, 210, 26, 0, 0, Math.PI * 2); x.fill(); IMG.shadow = sh;
  window.__seek(0); window.__ready = true; }).catch(e => console.error('load failed', e));
</script>
</html>
