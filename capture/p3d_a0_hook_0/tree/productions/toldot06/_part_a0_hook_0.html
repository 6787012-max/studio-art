      { const m0 = CL.children[0].material, cm = m0.clone(); cm.color.set(0x99a2b2); cm.emissive = new THREE.Color(0x4c5566); cm.fog = false;
        const top = cm.clone(); top.color.set(0xb4bccb); top.emissive = new THREE.Color(0x5c6577);

      Wd.add(CL);
      const cloudPos = track([[18.0, [-125, 24, 7], [0, 0, 0]], [26, [-38, 15.5, 7], [0, 0, 0]], [34.5, [-15, 12.6, 6.5], [0, 0, 0]], [42, [-11, 12.2, 6.3], [0, 0, 0], 45, true]]);
      Wd.on(t => { const c = cloudPos(t).pos; CL.position.set(...c); CL.visible = t > 17.6; CL.rotation.y = Math.PI / 2 + .25 + t * .003; const s = .8 + .2 * prog(t, 18, 30); CL.scale.setScalar(s); });

      // ---- טיפות: טיפה, טבעת התזה, אבק קטן שמתרומם, וכתם רטוב שנשאר ----
      const DROPS = [[29.0, 0, 0, 1.25], [30.7, .5, -.38, 1.8], [31.7, -.55, .32, 3.2], [32.0, .22, .55, 4.6], [32.5, -.3, -.6, 4.8], [32.9, .75, .15, 5], [33.25, -.85, -.1, 5], [33.6, .38, -.85, 5.2], [33.9, -.15, .9, 5.2], [34.2, .95, -.5, 5.4]];
      { const r = rng(77); for (let t = 34.6; t < 41.8; t += .22 + r() * .2) { const a = r() * 6.283, rr = .5 + Math.sqrt(r()) * 2.6; DROPS.push([t, Math.cos(a) * rr, Math.sin(a) * rr * 1.2 - .4, 5.6]); } }
      const wetTex = canvasTex(128, 128, (g, w, h) => { const r = rng(5); g.fillStyle = 'rgba(62,38,22,.8)'; g.beginPath();
        for (let k = 0; k <= 24; k++) { const a = k / 24 * 6.283, rr = 46 + r() * 12; k ? g.lineTo(64 + Math.cos(a) * rr, 64 + Math.sin(a) * rr) : g.moveTo(64 + Math.cos(a) * rr, 64 + Math.sin(a) * rr); } g.fill();
        g.fillStyle = 'rgba(60,40,24,.35)'; for (let k = 0; k < 7; k++) { const a = r() * 6.283, rr = 52 + r() * 8; g.beginPath(); g.arc(64 + Math.cos(a) * rr, 64 + Math.sin(a) * rr, 3 + r() * 4, 0, 7); g.fill(); } });
      const ringGeo = new THREE.RingGeometry(.9, 1, 48), dropGeo = new THREE.SphereGeometry(.026, 16, 12), crownGeo = new THREE.SphereGeometry(.012, 8, 6);
      const trailGeo = new THREE.CylinderGeometry(.004, .012, .13, 8), trailMat = new THREE.MeshBasicMaterial({ color: 0xcfe6ff, transparent: true, opacity: .45, depthWrite: false });

        const dr = new THREE.Mesh(dropGeo, dropMat); dr.scale.set(1, 1.75, 1); ink(dr, .0035, 0x2c5a85); Wd.add(dr);
        const trail = new THREE.Mesh(trailGeo, trailMat); trail.position.y = .1; dr.add(trail);
        const rings = [0, 1].map(k => { const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: k ? 0x6b4a2e : 0xeef7ff, transparent: true, depthWrite: false, side: THREE.DoubleSide })); m.rotation.x = -Math.PI / 2; m.position.set(x, gy + .02 + k * .002, z); m.renderOrder = 3; Wd.add(m); return m; });
        const wet = new THREE.Mesh(new THREE.CircleGeometry(1, 28), new THREE.MeshBasicMaterial({ map: wetTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 })); wet.rotation.x = -Math.PI / 2; wet.rotation.z = ti * 7; wet.position.set(x, gy + .015, z); Wd.add(wet);

        const puff = new THREE.Sprite(new THREE.SpriteMaterial({ map: dustTex, transparent: true, depthWrite: false })); Wd.add(puff);
        const big = ti < 31.2;   // שתי הטיפות הראשונות: גדולות ובולטות יותר
        Wd.on(t => {
          const fall = (ti - t) * sp; dr.visible = t < ti && fall < 3.2; trail.scale.y = sp / 2.4; dr.position.set(x - fall * .05, gy + .05 + fall, z);
          const u = (t - ti);
          rings.forEach((m, k) => { const v = clamp((u - k * .12) / (big ? 1.0 : .7), 0, 1); m.visible = u > k * .12 && v < 1; const R0 = (big ? .36 : .24) * (k ? .62 : 1); m.scale.setScalar(.02 + R0 * ease.out(v)); m.material.opacity = (k ? .4 : .75) * (1 - v); });
          const ws = (big ? .2 : .14) * ease.out(clamp(u / .25, 0, 1)); wet.visible = u > 0; wet.scale.setScalar(Math.max(ws, .001));
          const cu = u / .38; crown.forEach((c, k) => { c.visible = cu > 0 && cu < 1; const a = k / 7 * 6.283 + ti, rr = .03 + cu * (big ? .2 : .13); c.position.set(x + Math.cos(a) * rr, gy + .02 + 4 * (big ? .1 : .07) * cu * (1 - cu), z + Math.sin(a) * rr); });
          const pu = clamp(u / .9, 0, 1); puff.visible = u > 0 && pu < 1; puff.position.set(x, gy + .06 + pu * .12, z); puff.scale.setScalar((big ? .12 : .08) + pu * (big ? .32 : .2)); puff.material.opacity = .45 * (1 - pu);
        });
      }
      // גשם דקיק מתחת לענן בסוף
      rain(Wd, { x0: -14, x1: -8, z0: 3, z1: 10.5, top: 9.6, bottom: 1.6, count: 520, speed: 8, len: .6, color: 0xd2e2f2, opacity: .6, amount: t => .9 * prog(t, 35.5, 40) });

      // ---- המצלמה ----
      const Y = (z, dy, dx) => H(cx(z) + (dx || 0), z) + dy;
      const cam = track([
        [0, [cx(-38) + .4, Y(-38, 1.05), -38], [cx(-26) - .3, Y(-26, 1.9), -26], 50],
        [8.6, [cx(-28.5) + .2, Y(-28.5, 1.15), -28.5], [cx(-16) - .4, Y(-16, 1.75), -16], 48],
        [13.2, [cx(-18.6) - .2, Y(-18.6, 1.3), -18.6], [cx(-6) + .2, Y(-6, 1.7), -6], 48],
        [17.4, [cx(-8.5) + .1, Y(-8.5, 1.45), -8.5], [cx(3) - .2, Y(3, 1.9), 3], 48],
        [20.2, [cx(-4.8), Y(-4.8, 2.6), -4.8], [-14, 4.5, 4], 50],
        [23.0, [cx(-3.6) + .6, Y(-3.6, 4.3), -3.6], [-60, 11, 7], 52],
        [26.0, [cx(-2.6) + .3, Y(-2.6, 4.7), -2.6], [-48, 15, 7], 50, true],
        [28.0, [DZ.x + 1.2, Y(DZ.z - 1.5, .55, DZ.x - cx(DZ.z - 1.5) + 1.2), DZ.z - 1.5], [DZ.x, H(DZ.x, DZ.z) + .28, DZ.z], 38, true],
        [34.4, [DZ.x + 1.5, Y(DZ.z - 1.85, .7, DZ.x - cx(DZ.z - 1.85) + 1.5), DZ.z - 1.85], [DZ.x + .05, H(DZ.x, DZ.z) + .12, DZ.z - .1], 40],
        [38.8, [DZ.x + 5.2, 4.9, DZ.z - 3.2], [-12, 8.6, 6.5], 48],
