<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
import { film, path, world, cloud } from '../../lib/stage3d.js';
import { hallWorld, shot, ease, prog, clamp, lerp, THREE, P } from './hall.js';
import { GROUP16, NEUTRAL_HALL, men } from './people_v2.js';
import { D2R, face, hash, track, heroProxy, evening, EVE } from './games_d.js';

const sn = Math.sin, cs = Math.cos, PI = Math.PI;
const DOOR = [-13.5, 11.2];

film({
  title: 'TITLE_E', kicker: 'KICKER_E', recap: ['RECAP_E_1', 'RECAP_E_2', 'RECAP_E_3'], vault: 'captions_vault.json',
  shots: [
    // E1 - evening: the men leave the hall in twos and threes; one shows the finger game to his friend on the way out. Camera pulls back to the door.
    shot(14, ['CAP_E_01', 'CAP_E_02'], [0.5, 7.1], () => {
      const Wd = evening(hallWorld(NEUTRAL_HALL(EVE)));
      // groups: members, start centre, leave time
      const GR = [[[0, 1], [3.5, -1.5], 0.2], [[2, 3, 4], [5.5, 1.5], 1.6], [[5, 6], [2.5, 2.8], 3.2], [[7, 8, 9], [6.5, -2.8], 4.6], [[10, 11], [3.0, -3.5], 6.0], [[12, 13, 14], [4.5, 3.8], 7.4]];
      let heroFn = null;
      GR.forEach(([ms, c, tl], g) => {
        ms.forEach((man, k) => {
          const sx = c[0] + (k - (ms.length - 1) / 2) * .9, sz = c[1] + .3 * k, tx = DOOR[0] + k * .7, tz = DOOR[1] + (k % 2) * .4, dur = 9.5;
          const f0 = face(sx, sz, tx, tz), end = tl + dur;
          const K = [[0, sx, sz, f0 + .5 * sn(g + k)], [tl, sx, sz, f0], [end, tx, tz, f0], [20, tx, tz, f0]];
          const demo = g === 1 && k === 0, friend = g === 1 && k === 1;
          const segs = [];
          if (demo) segs.push([tl + 1.2, end - .5, t => ({ gesture: sn(t * 2.4) > 0 ? 'shS' : 'shP', talk: .5, smile: 1, look: -.6 })]);
          else if (friend) segs.push([tl + 1.2, end - .5, t => ({ gesture: 'rest', talk: .3, smile: 1, look: .6 })]);
          segs.push([tl, end, t => ({ gesture: ['rest', 'explainA', 'rest', 'explain'][Math.floor((t * .3 + man * .7) % 4)], talk: .4, smile: .7, look: .4 * sn(t * .5 + man) })]);
          segs.push([end - .1, 99, () => ({ hidden: true })]);
          const fn = track(K, segs, () => ({ gesture: 'rest', smile: .5, talk: .3 }));
          men(Wd, GROUP16[man], fn);
        });
      });
      // pre-positioned stragglers so the first frames are full of people chatting
      heroProxy(Wd, t => [lerp(3, -9, prog(t, 1.5, 11)), 0, lerp(0, 8, prog(t, 1.5, 11))], [6, 1.75, 4]);
      const cam = path([[0, [-3.5, 1.8, 3.2], [3.5, 1.3, -0.5], 50], [7, [-6.5, 2.2, 4.2], [1.5, 1.3, 0.5], 48], [14, [-9.5, 2.7, 5.4], [-1.5, 1.3, 1.5], 46]]);
      return Object.assign(Wd, { cam });
    }),

    // E2 - a wide green field of a farm in daylight, a few trees and a wooden fence. No people, no signs, no text. Slow crane.
    shot(12, ['CAP_E_03'], [0.5], () => {
      const Wd = world({ ground: 'grass', skyTop: 0x5fa6e4, skyBottom: 0xfdeed2, fogColor: 0xe9efe0, fogNear: 60, fogFar: 260, sun: 1.9, hemi: 1.5, hemiGround: 0x8fa070, sunPos: [-30, 50, 25] });
      [[-8, -2], [4, -2], [16, -2]].forEach(([x, z]) => P.fence(Wd, { pos: [x, 0, z], len: 11 }));
      P.fence(Wd, { pos: [-14, 0, 5], len: 14, rot: PI / 2 });
      [[-12, -7, 0, 1.3], [-6, -10, 0, 1.0], [3, -9, 1, 1.1], [11, -8, 0, 1.4], [18, -6, 1, 1.0], [-17, -3, 1, 1.0]].forEach(([x, z, kind, sc]) => P.tree(Wd, { pos: [x, 0, z], kind, scale: sc }));
      [[-3, -6], [8, -5]].forEach(([x, z]) => P.bush(Wd, { pos: [x, 0, z], scale: 1.1 }));
      Wd.add(cloud({ pos: [-20, 32, -70], size: 5, seed: 2 })); Wd.add(cloud({ pos: [28, 36, -80], size: 6, seed: 5 }));
      Wd.hero = null;
      heroProxy(Wd, () => [2, 0, -6], [16, 5, 8]);
      const cam = t => { const u = ease.io(prog(t, 0, 12)), a = lerp(-18, 22, u) * D2R, r = lerp(15, 20, u), h = lerp(1.8, 9.5, u); return { pos: [2 + sn(a) * r, h, -4 + cs(a) * r], look: [2, lerp(1.6, .6, u), -6], fov: 46 }; };
      return Object.assign(Wd, { cam });
    }),
  ],
});
