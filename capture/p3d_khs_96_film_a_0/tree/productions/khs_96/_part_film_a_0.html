<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
// khs_96 / film_a (short96 "kelev bechagora", phase B, round 2). Portrait 1080x1920. OBJECTS ONLY plus ONE round toon dog.
// No people, hands, arms, feet, faces or silhouettes. 8 shots, one caption box per shot (boxes from captions_vault.json).
// Framing: closer camera, horizon near y 33%, meadow fills the hero zone; sky filled with clouds, sun, distant hills,
// a wooden fence line and round trees. Stations: cage (x=-1.3), post (x=1.5), toy village (x=3.3). No Hebrew in this file.
window.CLIP_DUR = 32.98;
window.CAP_FS_SCALE = 1;
import { film, world, THREE, ease, clamp, lerp, mesh, toon, label } from '../../lib/stage3d.js';
import { installRichness } from '../../lib/richness.js';
const VAULT = await (await fetch('captions_vault.json')).json();

const PI = Math.PI;
const GY = -1.2;                                  // meadow top
const CX = -1.3, PX = 1.5, VX = 3.3, GX = -2.4;   // cage, post, toy village, gauge
const CW = 2.0, CH = 1.8, CD = 1.2;               // cage size
const CAMY = -0.2, PITCH = .079;                  // camera height; pitch makes the horizon sit near y 33%
const SKY_T = 0xffe9a6, SKY_B = 0xfff8e6, GRASS = 0x8fd16a, LEAF = 0x5fae46, LEAF_D = 0x3f8a3a;
const NAVY = 0x23365a, TOMATO = 0xe8403a, OAK = 0xd9b07a, OAK_D = 0xb98b55, CREAM = 0xfff1d6;
const CARAMEL = 0xb8733a, CARAMEL_D = 0x8f5626, INK = 0x3a2418, APPLE = 0xe0283a, STONE = 0xd8cbb0;
const HOUSE = 0xfff3c8, ROOF = 0xe8603c, GOLD = 0xffd44a, DUST = 0xf6f0e0, WING = 0xffa640, TRUNK = 0x7a4a2c, CLOUD = 0xffffff;
const UP = new THREE.Vector3(0, 1, 0);
const ANCHOR = [PX, GY + 1.5, .12];               // leash tie on the post

const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const sm = (t, a, b) => ease.sm(P(t, a, b));
const mk = (geo, color, o) => { o = o || {}; return mesh(geo, toon(color, o.mat), Object.assign({ inkW: .008, inkColor: INK }, o)); };
const put = (parent, geo, color, pos, o) => { const m = mk(geo, color, Object.assign({ pos }, o || {})); parent.add(m); return m; };
const Sph = (r, a, b) => new THREE.SphereGeometry(r, a || 24, b || 16);
const Cyl = (r1, r2, h, s) => new THREE.CylinderGeometry(r1, r2, h, s || 12);
const Bx = (x, y, z) => new THREE.BoxGeometry(x, y, z);
// camera at x, distance d (z), looking at lx on the ground plane; pitch keeps the horizon at y ~33%
const camAt = (x, d, lx, y) => { const cy = y === undefined ? CAMY : y; return { pos: [x, cy, d], look: [lx === undefined ? x : lx, cy - PITCH * d, 0], fov: 50 }; };

function heroBox(Wd, fn) {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial()); m.visible = false; g.add(m); Wd.add(g);
  Wd.on(t => { const bs = fn(t).filter(Boolean); if (!bs.length) return; const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const b of bs) for (let q = 0; q < 3; q++) { lo[q] = Math.min(lo[q], b[q] - b[q + 3]); hi[q] = Math.max(hi[q], b[q] + b[q + 3]); }
    g.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2); g.scale.set(Math.max(hi[0] - lo[0], .01), Math.max(hi[1] - lo[1], .01), Math.max(hi[2] - lo[2], .01)); });
  Wd.hero = g; return g;
}
// scene: meadow, sky life (clouds drift, sun, hills, fence, round trees); fs = caption font step of this shot
function scene(heroFn, fs) {
  const Wd = world({ fogColor: 0xfff3d0, fogNear: 40, fogFar: 140, skyTop: SKY_T, skyBottom: SKY_B, hemiSky: 0xffffff, hemiGround: 0xe9f5c8, hemi: 1.0, sunColor: 0xfff6d6, sun: .7, sunPos: [3, 10, 8], shadowExt: 8, skyR: 260 });
  const S = Wd.scene;
  put(S, Bx(260, .4, 260), GRASS, [0, GY - .2, 0], { ink: false, mat: { emissive: GRASS, emissiveIntensity: .2 } });
  // distant soft hills
  const h1 = put(S, Sph(1, 36, 20), LEAF, [-6, GY, -22], { ink: false }); h1.scale.set(9, 3.2, 1);
  const h2 = put(S, Sph(1, 36, 20), LEAF_D, [7, GY, -24], { ink: false }); h2.scale.set(10, 2.6, 1);
  // sun disc (top right)
  put(S, Sph(1.3, 32, 20), GOLD, [3.6, 6.2, -16], { ink: false, mat: { emissive: GOLD, emissiveIntensity: .9 } });
  // flat drifting clouds (top band)
  const clouds = [[-3.6, 5.6, -12, 1.0], [.6, 6.5, -14, 1.3], [4.6, 4.9, -11, .9]].map(([x, y, z, s]) => {
    const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); S.add(g);
    [[0, 0, 0, 1.0], [1.0, -.2, 0, .8], [-.9, -.25, 0, .7]].forEach(([cx, cy, cz, r]) => put(g, Sph(r, 20, 14), CLOUD, [cx, cy, cz], { ink: false, mat: { emissive: CLOUD, emissiveIntensity: .25 } }));
    return { g, x0: x };
  });
  // low wooden fence line and round trees far back
  for (let i = -6; i <= 6; i += .9) put(S, Cyl(.07, .08, 1.0, 8), OAK, [i, GY + .45, -5.5], { ink: false });
  put(S, Bx(13, .09, .09), OAK_D, [0, GY + .72, -5.5], { ink: false });
  put(S, Bx(13, .09, .09), OAK_D, [0, GY + .35, -5.5], { ink: false });
  [[-4.2, -8], [5.4, -9]].forEach(([x, z]) => { put(S, Cyl(.14, .18, 1.6, 8), TRUNK, [x, GY + .8, z], { ink: false }); put(S, Sph(1.1, 18, 12), LEAF, [x, GY + 2.1, z], { ink: false }); });
  heroBox(Wd, heroFn);
  Wd.on(t => { window.CAP_FS_SCALE = fs || 1; clouds.forEach((c, i) => { c.g.position.x = c.x0 + .35 * Math.sin(t * .18 + i * 2); }); });
  const rich = installRichness(S); Wd.on(rich.onFrame);   // scene-richness probe for verify_scene.py
  return { Wd, S };
}
// in-scene sign: wooden pole and a cream board; the Hebrew label sits on the board
function sign(Wd, S, x, y, z, text, o) {
  o = o || {};
  const up = o.up === undefined ? 1.05 : o.up;
  const sp = label(Wd, text, { size: 96, height: o.h || .62, bg: null, color: o.color || '#23365a', weight: 800, pos: [x, y + up, z + .14] });
  sp.userData.text = true;
  const g = new THREE.Group(); S.add(g);
  put(g, Bx(sp.scale.x + .3, sp.scale.y + .24, .06), CREAM, [x, y + up, z + .05], { ink: true });
  put(g, Cyl(.04, .04, Math.max(up, .05), 8), OAK_D, [x, y + up / 2, z], { ink: false });
  return { g, sp };
}
const showSign = (s, on) => { s.g.visible = on; s.sp.visible = on; };

// the one round toon dog: bean body, big round head with cream muzzle and black nose, floppy ears, short legs, curved tail
function makeDog(S) {
  const g = new THREE.Group(); S.add(g);
  const root = new THREE.Group(); g.add(root);
  const body = put(root, Sph(.5, 28, 20), CARAMEL, [0, .55, 0], { ink: false }); body.scale.set(1.2, .95, 1.0);
  const head = new THREE.Group(); head.position.set(.5, 1.05, 0); root.add(head);
  put(head, Sph(.42, 28, 20), CARAMEL, [0, 0, 0], { ink: false });
  const muz = put(head, Sph(.22, 20, 14), CREAM, [.3, -.12, 0], { ink: false }); muz.scale.set(1.1, .8, 1);
  put(head, Sph(.09, 12, 10), INK, [.56, -.02, 0], { ink: false });
  const eyes = [put(head, Sph(.07, 12, 10), INK, [.26, .1, .25], { ink: false }), put(head, Sph(.07, 12, 10), INK, [.26, .1, -.25], { ink: false })];
  const ears = [1, -1].map(s => { const e = put(head, Sph(.2, 16, 12), CARAMEL_D, [-.12, .12, s * .36], { ink: false }); e.scale.set(.5, 1.3, .32); return e; });
  const tail = new THREE.Group(); tail.position.set(-.95, .7, 0); root.add(tail);
  put(tail, new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(-.15, .25, 0), new THREE.Vector3(-.05, .5, 0)]), 10, .08, 8, false), CARAMEL, [0, 0, 0], { ink: false });
  put(root, new THREE.TorusGeometry(.3, .06, 10, 28), TOMATO, [.42, .8, 0], { ink: false, rot: [0, PI / 2, 0] });   // collar
  const legs = [[.3, .25], [.3, -.25], [-.3, .25], [-.3, -.25]].map(([x, z]) => {
    const lg = new THREE.Group(); lg.position.set(x, .28, z); root.add(lg); put(lg, Cyl(.13, .12, .4, 12), CARAMEL, [0, -.2, 0], { ink: false }); return lg; });
  return { g, root, body, head, tail, legs, eyes, ears };
}
// pose: sleep 0..1 (curled ball, closed eyes), run = leg swing, wag = tail, lean = tilt, bob = head bob
function pose(d, t, o) {
  o = o || {};
  const s = o.sleep || 0, run = o.run || 0, wag = o.wag || 0;
  d.body.scale.set(lerp(1.2, 1.25, s), lerp(.95, .62, s) * (1 + .02 * Math.sin(t * 3) * (1 - run)), lerp(1, 1.05, s));
  d.body.position.y = lerp(.55, .4, s);
  d.head.position.set(lerp(.5, .42, s), lerp(1.05, .45, s) + (o.bob || 0), 0);
  d.eyes.forEach(e => { e.scale.y = lerp(1, .1, s); });
  d.legs.forEach((lg, i) => { lg.rotation.z = run * .5 * Math.sin(t * 11 + i * PI / 2) * (i % 2 ? 1 : -1); lg.scale.y = lerp(1, .35, s); });
  d.tail.rotation.z = .25 * (1 - s) + wag * Math.sin(t * 13);
  d.root.rotation.z = o.lean || 0;
}
// place the dog: heading (vx, vz); a 3/4 turn toward the camera; lift = jump height
function place(d, x, z, vx, vz, lift) {
  d.g.position.set(x, GY + .12 + (lift || 0), z);
  d.g.rotation.y = (vx || vz ? -Math.atan2(vz || 0, vx || 0) : 0) - .45;
}
// thick tomato-red leash from the post ring to the collar
function leashOn(E, on) {
  E.leash.visible = on; if (!on) return;
  const d = E.dog.g, ry = d.rotation.y;
  const a = new THREE.Vector3(ANCHOR[0], ANCHOR[1], ANCHOR[2]);
  const b = new THREE.Vector3(d.position.x + .42 * Math.cos(ry), GY + 1.05, d.position.z - .42 * Math.sin(ry));
  const v = new THREE.Vector3().subVectors(b, a); const L = Math.max(v.length(), .01);
  E.leash.position.copy(a).addScaledVector(v, .5);
  E.leash.scale.set(1, L, 1);
  E.leash.quaternion.setFromUnitVectors(UP, v.normalize());
}
function ring(r, x, y, z, s, op) { r.position.set(x, y, z); r.scale.setScalar(Math.max(s, .01)); r.material.opacity = op; r.visible = op > .01; }
function setGauge(E, h) { E.fill.scale.y = Math.max(h, .01); E.fill.position.y = GY + .2 + h / 2; }

// the whole set (every shot builds it; each shot shows what it needs)
function build(heroFn, fs) {
  const { Wd, S } = scene(heroFn, fs);
  const E = { Wd, S };
  [[-3.9, -2.5], [-.6, -3.0], [1.6, -2.6], [3.9, -3.2], [5.6, -2.2]].forEach(([x, z]) => put(S, Sph(.6, 18, 12), LEAF, [x, GY + .1, z], { ink: false }));
  // cage (hinged door at its left side)
  const C = new THREE.Group(); C.position.set(CX, GY, 0); S.add(C); E.cage = C;
  put(C, Bx(CW + .16, .09, CD + .16), NAVY, [0, CH, 0], { ink: false });
  put(C, Bx(CW + .16, .12, CD + .16), NAVY, [0, .06, 0], { ink: false });
  for (let i = 0; i <= 8; i++) put(C, Cyl(.035, .035, CH, 8), NAVY, [-CW / 2 + i * CW / 8, CH / 2, -CD / 2], { ink: false });
  for (const sx of [-CW / 2, CW / 2]) for (let i = 1; i < 4; i++) put(C, Cyl(.035, .035, CH, 8), NAVY, [sx, CH / 2, -CD / 2 + i * CD / 4], { ink: false });
  put(C, Cyl(.035, .035, CH, 8), NAVY, [CW / 2, CH / 2, CD / 2], { ink: false });
  const door = new THREE.Group(); door.position.set(-CW / 2, 0, CD / 2); C.add(door); E.door = door;
  for (let i = 0; i <= 5; i++) put(door, Cyl(.035, .035, CH, 8), NAVY, [i * CW / 5, CH / 2, 0], { ink: false });
  put(door, Bx(CW, .08, .08), NAVY, [CW / 2, CH, 0], { ink: false });
  put(door, Bx(CW, .08, .08), NAVY, [CW / 2, .05, 0], { ink: false });
  // post station
  const PG = new THREE.Group(); PG.position.set(PX, GY, 0); S.add(PG); E.post = PG;
  put(PG, Cyl(.11, .13, 2.3, 14), OAK, [0, 1.15, 0], { ink: false });
  put(PG, new THREE.TorusGeometry(.14, .035, 8, 20), TOMATO, [0, 1.5, .12], { ink: false });
  // toy village on a round green platform
  const V = new THREE.Group(); V.position.set(VX, GY, 0); V.scale.setScalar(1.2); S.add(V); E.village = V;
  put(V, Cyl(.6, .66, .14, 28), LEAF, [0, .07, 0], { ink: false });
  [[-.3, .2, .2], [.12, .2, -.15], [.34, .2, .22]].forEach(([x, y, z]) => {
    put(V, Bx(.28, .28, .28), HOUSE, [x, y, z], { ink: false });
    put(V, new THREE.ConeGeometry(.24, .22, 4), ROOF, [x, y + .22, z], { ink: false, rot: [0, PI / 4, 0] }); });
  [[-.45, .15], [.45, .05], [.05, .45]].forEach(([x, z]) => { put(V, Cyl(.03, .03, .2, 6), TRUNK, [x, .17, z], { ink: false }); put(V, new THREE.ConeGeometry(.12, .3, 8), LEAF_D, [x, .4, z], { ink: false }); });
  // toy thermometer (gauge) left of the cage: tall tube, red fill from the bottom
  put(S, Cyl(.2, .2, 2.4, 14), CREAM, [GX, GY + 1.2, 0], { ink: false });
  put(S, Sph(.35, 16, 12), TOMATO, [GX, GY + .1, 0], { ink: false });
  E.fill = put(S, Cyl(.13, .13, 1, 12), TOMATO, [GX, GY + .2, 0], { ink: false });
  // apple stand beside the cage (right side, in front), with glow
  const ped = put(S, Cyl(.22, .26, .8, 16), STONE, [CX + 1.45, GY + .4, 1.0], { ink: false });
  E.apple = put(S, Sph(.27, 20, 14), APPLE, [CX + 1.45, GY + .98, 1.0], { ink: false });
  const leaf = put(S, new THREE.ConeGeometry(.08, .2, 6), LEAF, [CX + 1.49, GY + 1.3, 1.0], { ink: false });
  E.glow = put(S, Sph(.5, 20, 14), GOLD, [CX + 1.45, GY + .98, 1.0], { ink: false, mat: { transparent: true, opacity: .1, emissive: GOLD, emissiveIntensity: 1 } });
  E.apParts = [ped, E.apple, leaf, E.glow];
  E.apParts.forEach(m => { m.visible = false; });
  // dog, leash, butterfly, tufts, dust, rings
  E.dog = makeDog(S);
  E.leash = put(S, Cyl(.05, .05, 1, 8), TOMATO, [0, 0, 0], { ink: false }); E.leash.visible = false;
  E.bf = new THREE.Group(); S.add(E.bf); E.bf.visible = false;
  const bBody = put(E.bf, Sph(.07, 12, 10), INK, [0, 0, 0], { ink: false }); bBody.scale.set(1, 3.2, 1);
  E.wings = [[.2, .06, 1], [-.2, .06, -1], [.15, -.1, 1], [-.15, -.1, -1]].map(([x, y]) => put(E.bf, new THREE.CircleGeometry(.2, 14), WING, [x, y, 0], { ink: false }));
  E.tufts = [0, 1, 2, 3, 4, 5].map(() => { const m = put(S, new THREE.ConeGeometry(.12, .35, 6), LEAF, [0, GY, 0], { ink: false }); m.visible = false; return m; });
  E.dust = [0, 1, 2, 3, 4].map(() => put(S, Sph(.18, 12, 10), DUST, [0, GY, 0], { ink: false, mat: { transparent: true, opacity: 0 } }));
  E.snap = [0, 1].map(() => put(S, new THREE.TorusGeometry(.2, .05, 8, 24), TOMATO, [0, 0, 0], { ink: false, mat: { transparent: true, opacity: 0 } }));
  E.barks = [0, 1, 2].map(() => put(S, new THREE.TorusGeometry(.5, .09, 10, 36, 1.6), 0xff7a1a, [0, 0, 0], { ink: false, rot: [0, 0, -.8], mat: { transparent: true, opacity: 0 } }));
  // ground arrow from the cage sign to the post sign (behind both stations)
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(CX, GY + .06, -1.0), new THREE.Vector3((CX + PX) / 2, GY + .06, -2.3), new THREE.Vector3(PX, GY + .06, -1.0)]);
  E.arrow = put(S, new THREE.TubeGeometry(curve, 36, .17, 10, false), 0xffe600, [0, 0, 0], { ink: false, mat: { emissive: GOLD, emissiveIntensity: 0 } });
  E.ahead = put(S, new THREE.ConeGeometry(.24, .45, 10), GOLD, [PX + .3, GY + .1, -1.0], { ink: false, rot: [0, 0, -PI / 2], mat: { emissive: GOLD, emissiveIntensity: 0 } });
  // signs (Hebrew from the vault), all placed above the bars / beside the dog, inside the frame
  E.sA = sign(Wd, S, CX + .6, GY + CH, .8, VAULT.LBL_A, { up: .75 });
  E.sH = sign(Wd, S, CX, GY + CH, .8, VAULT.LBL_H, { up: .75 });
  E.sB = sign(Wd, S, -1.3, GY, 1.1, VAULT.LBL_B, { up: 1.6, h: .6 });
  E.sD = sign(Wd, S, CX + 1.45, GY, 1.9, VAULT.LBL_D, { up: .9, h: .45 });
  E.sF = sign(Wd, S, CX + .8, GY, -1.4, VAULT.LBL_F, { up: 2.4, h: .5 });
  E.sG = sign(Wd, S, PX + .7, GY, -1.4, VAULT.LBL_G, { up: 2.4 });
  E.sE = sign(Wd, S, PX + .85, GY, -.5, VAULT.LBL_E, { up: 1.7 });
  E.sC = sign(Wd, S, .3, GY + 3.2, -1.2, VAULT.LBL_C, { up: .2, h: .9 });
  [E.sA, E.sH, E.sB, E.sD, E.sF, E.sG, E.sE, E.sC].forEach(s => showSign(s, false));
  return E;
}

// shot 1 (box CAP_01-02, 0.00-3.60): evil must have power. Closed cage, dog asleep (curled), gauge almost empty.
function b1() {
  const E = build(() => [[CX, GY + 1.0, 0, 1.3, 1.0, .7], [GX, GY + 1.2, 0, .3, 1.3, .2]], 1);
  E.Wd.cam = lt => camAt(CX - .5, lerp(7.2, 6.6, clamp(lt / 3.6, 0, 1)));
  place(E.dog, CX, 0);
  E.Wd.on(t => { pose(E.dog, t, { sleep: 1 }); setGauge(E, .08 + .08 * sm(t, 0, 3.6)); });
  return E.Wd;
}

// shot 2 (box CAP_03, 3.60-7.10): limited in a cage. Plaque LBL_H above the cage roof.
function b2() {
  const E = build(() => [[CX, GY + 1.3, 0, 1.3, 1.3, .7]], 1);
  E.Wd.cam = lt => camAt(CX - .5, lerp(6.8, 6.2, clamp(lt / 3.5, 0, 1)));
  place(E.dog, CX, 0);
  E.Wd.on(t => { pose(E.dog, t, { sleep: 1 }); showSign(E.sH, t >= .6); setGauge(E, .12); });
  return E.Wd;
}

// shot 3 (box CAP_04-07, 7.10-10.69): "we want a FREE dog". Door swings open, dog leaps out and runs a happy circle,
// gauge fills fast, LBL_A (above the cage) and LBL_B (behind the circle, fully in frame) appear, grass tufts fly.
function b3() {
  const E = build(() => [[-.1, GY + .9, 0, 1.6, 1.1, 1.1], [CX, GY + .9, 0, .9, 1.0, .7]], .85);
  E.Wd.cam = () => camAt(-.7, 7.6, -.7);
  E.Wd.on(t => {
    E.door.rotation.y = -2.2 * sm(t, .2, 1.0);
    let x, z, vx, vz, lift = 0, run = 0, sleep = 0, wag = 0;
    if (t < .9) { sleep = 1 - sm(t, .2, .9); x = CX; z = 0; vx = 1; vz = 0; }
    else if (t < 1.5) { const u = sm(t, .9, 1.5); x = lerp(CX, -1.1, u); z = 0; vx = 1; vz = 0; lift = .5 * Math.sin(PI * P(t, .9, 1.5)); run = 1; }
    else { const th = PI + (t - 1.5) * 2.2; x = -.1 + Math.cos(th); z = Math.sin(th); vx = -Math.sin(th); vz = Math.cos(th); run = .8; wag = .8; }
    place(E.dog, x, z, vx, vz, lift);
    pose(E.dog, t, { sleep, run, wag });
    setGauge(E, .2 + 2.0 * sm(t, .8, 2.6));
    showSign(E.sA, t >= .2 && t < 1.0); showSign(E.sB, t >= 1.0);
    E.tufts.forEach((tf, i) => { const th = PI + i * PI / 3; const k = P(t, 1.0 + i * .2, 2.4 + i * .2);
      tf.visible = k > 0 && k < 1; tf.position.set(-.1 + Math.cos(th) * 1.25, GY + .15 + .9 * Math.sin(PI * k), Math.sin(th) * 1.25); });
  });
  return E.Wd;
}

// shot 4 (box CAP_08-10, 10.69-15.56): "caught on a leash". Dog runs to the post; red collar and thick leash tie to the
// post ring (camera pans to the post station); LBL_E on the post.
function b4() {
  const E = build(() => [[(PX + CX) / 2 + .5, GY + 1.3, 0, 2.8, 1.5, 1.1]], 1);
  E.Wd.cam = lt => { const u = sm(lt, 0, 4.87); return camAt(lerp(-.4, PX + .2, u), 8.2); };
  E.Wd.on(t => {
    const u = sm(t, 0, 1.4);
    const x = lerp(-.9, 1.95, u), z = lerp(.5, .3, u);
    place(E.dog, x, z, 1.9, -.2, 0);
    pose(E.dog, t, { run: t < 1.4 ? 1 : .2, wag: .6, lean: t > 1.6 ? -.06 : 0 });
    leashOn(E, t >= .9);
    E.snap.forEach((r, i) => { const k = P(t, .9 + i * .15, 1.6 + i * .15); ring(r, ANCHOR[0], ANCHOR[1], ANCHOR[2] + .05, .3 + 1.2 * k, 1 - k); });
    showSign(E.sE, t >= 2.4);
  });
  return E.Wd;
}

// shot 5 (box CAP_11-13, 15.56-19.47): "still wants to take over the whole world". Dog strains toward the village,
// leash taut, post wobbles, village shakes, dust at the paws. The dog never reaches it.
function b5() {
  const E = build(() => [[1.8, GY + 1.2, 0, 3.2, 1.7, 1.1]], 1);
  E.Wd.cam = () => camAt(1.6, 9.5, 1.6);
  E.Wd.on(t => {
    const pull = sm(t, 0, 1.5);
    const x = 1.95 + .08 * pull + .02 * Math.sin(t * 9), z = .3;
    place(E.dog, x, z, 1, 0);
    pose(E.dog, t, { run: .7, wag: .4, lean: -.12 * pull });
    leashOn(E, true);
    E.village.position.x = VX + .04 * Math.sin(t * 40) * sm(t, 1, 2);
    E.post.rotation.z = .05 * Math.sin(t * 16) * sm(t, .5, 1.5);
    E.dust.forEach((d, k) => { const tk = .8 + k * .6, q = P(t, tk, tk + 1.2);
      d.material.opacity = (1 - q) * .8; d.scale.setScalar(.3 + .8 * q); d.position.set(x - .5 - .4 * q, GY + .1 + .5 * q, z + .3 * (k % 2 ? 1 : -1)); });
  });
  return E.Wd;
}

// shot 6 (box CAP_14-16, 19.47-23.46): "two stages". Camera pans back to the cage; the leash is let go and the dog walks
// into the cage; LBL_F (cage) and LBL_G (post) and LBL_D (apple stand) appear; apple glow stays dim.
function b6() {
  const E = build(() => [[CX + .5, GY + 1.3, 0, 2.6, 1.5, 1.0]], 1);
  E.Wd.cam = lt => { const u = sm(lt, 0, 3.99); return camAt(lerp(1.6, CX + .4, u), lerp(9.5, 7.2, u), lerp(1.6, CX + .4, u)); };
  E.Wd.on(t => {
    const u2 = sm(t, .3, 2.6);
    const x = lerp(1.9, CX + .1, u2), z = lerp(.3, 0, u2) + .5 * Math.sin(PI * u2);
    const walking = t > .3 && t < 2.6;
    place(E.dog, x, z, CX + .1 - 1.9, 0, 0);
    pose(E.dog, t, { run: walking ? 1 : 0, sleep: sm(t, 3.0, 3.8) });
    leashOn(E, false);
    E.door.rotation.y = -2.2 * (sm(t, 1.9, 2.3) - sm(t, 3.1, 3.5));
    showSign(E.sF, t >= .5); showSign(E.sG, t >= .5); showSign(E.sD, t >= .5);
    E.apParts.forEach(m => { m.visible = true; });
    E.glow.material.opacity = .08 + .02 * Math.sin(t * 2);
    setGauge(E, .2);
  });
  return E.Wd;
}

// shot 7 (box CAP_17-18, 23.46-27.18): "a dog in a cage does not excite you". Push-in on the caged dog asleep;
// a butterfly (body, two pairs of flapping wings) lands calmly on the cage roof.
function b7() {
  const E = build(() => [[CX, GY + 1.0, 0, 1.6, 1.4, .8]], 1);
  E.Wd.cam = lt => camAt(CX + .2, lerp(7.0, 6.4, clamp(lt / 3.72, 0, 1)));
  place(E.dog, CX + .1, 0);
  E.Wd.on(t => {
    pose(E.dog, t, { sleep: 1 });
    const u = sm(t, .4, 2.2);
    E.bf.visible = t >= .4;
    E.bf.position.set(lerp(CX + 1.8, CX, u), lerp(GY + 3.0, GY + CH + .35, u) + .12 * Math.sin(t * 4) * (1 - u), lerp(.9, .1, u));
    const s = .9 * Math.sin(t * 26) * (1 - sm(t, 2.4, 3.0));
    E.wings.forEach((w, i) => { w.rotation.y = s * (i % 2 ? -1 : 1); });
    setGauge(E, .2);
  });
  return E.Wd;
}

// shot 8 (box CAP_19-22, 27.18-32.98). Local t: 0-0.9 dog runs out to the post; leash snaps; 1.0-2.7 the leashed dog
// BARKS (3 sound rings repeating from its open mouth, apple glows bright); 2.7-5.8 camera rises and pulls back to show
// both stations; gold arrow from LBL_F to LBL_G lights up; big sign LBL_C lights in the upper area.
function b8() {
  const E = build(() => [[(CX + PX) / 2, GY + 1.2, 0, 3.4, 1.5, 1.2]], .85);
  E.Wd.cam = lt => {
    const pan = sm(lt, 0, 1.0), v = sm(lt, 2.7, 5.8);
    const x = lerp(lerp(CX + .2, 1.2, pan), .4, v), y = lerp(CAMY, 1.2, v), d = lerp(9.0, 13.0, v);
    return camAt(x, d, lerp(lerp(CX + .2, 1.2, pan), .4, v), y);
  };
  E.Wd.on(t => {
    const u = sm(t, .1, .9);
    const x = lerp(CX + .1, 1.9, u), z = lerp(0, .3, u) + .35 * Math.sin(PI * u);
    const running = t >= .1 && t < .9;
    const barking = t >= 1.0 && t < 2.7;
    place(E.dog, x, z, running ? 1 : 1, running ? .3 : 0, 0);
    pose(E.dog, t, { sleep: 1 - sm(t, 0, .2), run: running ? 1 : .15, wag: .9, lean: barking ? -.08 : 0, bob: barking ? .06 * Math.sin(t * 30) : 0 });
    E.door.rotation.y = -2.2 * sm(t, 0, .2);
    leashOn(E, t >= .9);
    E.snap.forEach((r, i) => { const k = P(t, .9 + i * .15, 1.3 + i * .15); ring(r, ANCHOR[0], ANCHOR[1], ANCHOR[2] + .05, .3 + 1.2 * k, 1 - k); });
    // sound rings from the open mouth: 3 rings, each repeating every 0.9 s
    const mx = x + .75, my = GY + 1.15, mz = z + .35;
    E.barks.forEach((r, i) => { const ph = ((t - 1.0 - i * .3) % .9 + .9) % .9 / .9; ring(r, mx, my, mz, .6 + .7 * ph, barking ? (ph < .85 ? 1 : (1 - ph) * 6.7) : 0); });
    E.apParts.forEach(m => { m.visible = true; });
    E.apple.position.y = GY + .98 + .03 * Math.sin(t * 6) * sm(t, 1.0, 2);
    E.glow.material.opacity = .1 + .5 * sm(t, 1.0, 1.6) * (.7 + .3 * Math.sin(t * 8));
    E.arrow.material.emissiveIntensity = 2.5 * sm(t, 2.7, 3.4);
    E.ahead.material.emissiveIntensity = 1.2 * sm(t, 2.7, 3.4);
    showSign(E.sF, true); showSign(E.sG, true); showSign(E.sD, true); showSign(E.sE, false);
    showSign(E.sC, t >= 2.7);
    if (t >= 2.7) E.sC.sp.material.opacity = .55 + .45 * sm(t, 2.7, 3.4);
    setGauge(E, .2);
  });
  return E.Wd;
}

const SH = (id, dur, caps, capAt, build) => ({ id, dur, wide: true, caps, capAt, build });
film({
  W: 1080, H: 1920, xf: .0001, vault: 'captions_vault.json',
  shots: [
    SH('s01', 3.60, ['G_CAP_01'], [0, 3.60], b1),
    SH('s02', 3.50, ['G_CAP_03'], [0, 3.50], b2),
    SH('s03', 3.59, ['G_CAP_04'], [0, 3.59], b3),
    SH('s04', 4.87, ['G_CAP_08'], [0, 4.87], b4),
    SH('s05', 3.91, ['G_CAP_11'], [0, 3.91], b5),
    SH('s06', 3.99, ['G_CAP_14'], [0, 3.99], b6),
    SH('s07', 3.72, ['G_CAP_17'], [0, 3.72], b7),
    SH('s08', 5.80, ['G_CAP_19'], [0, 5.80], b8),
  ]
});
// the caption gate (window.__caption) does not run the shot updaters, so give it the font step of the shot at time t
const CAP_SCALE_BY_SHOT = [1, 1, .85, 1, 1, 1, 1, .85], SHOT_START = [0, 3.6, 7.1, 10.69, 15.56, 19.47, 23.46, 27.18];
if (typeof window.__caption === 'function') {
  const origCaption = window.__caption;
  window.__caption = t => { let k = 0; while (k < SHOT_START.length - 1 && t >= SHOT_START[k + 1]) k++; window.CAP_FS_SCALE = CAP_SCALE_BY_SHOT[k]; return origCaption(t); };
}
