<script type="module">
// תלת-ממד בסגנון איור: צביעה בשני גוונים, צבעים "שטוחים" (החלקת רעש), וקו דיו אחיד שמזוהה בתמונה עצמה
// מתוך קפיצות בעומק ובכיוון המשטח — כמו קו עט סביב כל צורה. ארבע זוויות זו לצד זו (t מסובב את כולן).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P = new URLSearchParams(location.search), file = P.get('f') || '../../assets/3d/illus/rav_hat_a__trellis-community__TRELLIS_0.glb';
const W = 1920, H = 1080, PW = 1920;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, preserveDrawingBuffer: true });
r.setSize(W, H, false); r.autoClear = false;

const comp = new THREE.ShaderMaterial({ uniforms: { col: { value: rtC.texture }, dep: { value: rtC.depthTexture }, nor: { value: rtN.texture }, res: { value: new THREE.Vector2(PW, H) }, bg: { value: new THREE.Color(0xf6eedc) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: `uniform sampler2D col; uniform sampler2D dep; uniform sampler2D nor; uniform vec2 res; uniform vec3 bg; varying vec2 vUv;
  float ld(vec2 u){ float z=texture2D(dep,u).x; float n=.05, f=60.; return (2.*n)/(f+n-(z*2.-1.)*(f-n)); }

      e=max(e, step(.012*d0+.0006, abs(ld(vUv+o)-d0))); e=max(e, smoothstep(.35,.6, distance(texture2D(nor,vUv+o).rgb,n0))); }
    // צבעים שטוחים: ממוצע אזורי קטן (מוחק רעש של הטקסטורה) ואז צמצום גוונים עדין
    vec3 c=vec3(0.); for(int i=-2;i<=2;i++) for(int j=-2;j<=2;j++) c+=texture2D(col,vUv+vec2(i,j)*px).rgb; c/=25.;
    c=pow(c,vec3(1./2.2)); c=mix(c, floor(c*14.+.5)/14., .6);

  const L = []; g.scene.traverse(o => { if (o.isMesh) L.push(o); });
  for (const o of L) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); o.material = new THREE.MeshToonMaterial({ map: o.material.map, gradientMap: grad }); }

  const cam = new THREE.PerspectiveCamera(30, PW / H, .05, 60), h = s.y;

    m.rotation.y = .12 * Math.sin(t * .9); m.position.y = -c.y + .006 * Math.sin(t * 2.2) * h;
