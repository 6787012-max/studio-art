const GOLDBG = 'rgba(150,100,10,.95)';

// ---------- small shared pieces ----------
const glowTex = (c0, c1) => canvasTex(128, 128, (g, w, h) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, c0); r.addColorStop(1, c1); g.fillStyle = r; g.fillRect(0, 0, w, h); });

  s.scale.set(size, size, 1); if (pos) s.position.set(...pos); Wd.add(s); return s; };
// a green check in a circle that pops up at t0 (a billboard sprite)
function tick(Wd, pos, t0, o) {
  o = o || {}; const sz = o.size || 1.1;
  const tex = canvasTex(128, 128, g => { g.fillStyle = '#2fae5a'; g.beginPath(); g.arc(64, 64, 60, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 6; g.beginPath(); g.arc(64, 64, 57, 0, 7); g.stroke();
    g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 17; g.beginPath(); g.moveTo(33, 66); g.lineTo(55, 88); g.lineTo(96, 42); g.stroke(); });

// ---------- day / evening / night ----------
const C = c => new THREE.Color(c);
const STOPS = [   // k, skyTop, skyBottom, fog, hemi, hemiSky, hemiGround, sunColor, sunI
  [0, C(0x5aa5ee), C(0xfbeacb), C(0xeaeedd), 1.3, C(0xfffbf0), C(0x8a7a52), C(0xfff1dc), 1.95],
  [.45, C(0x5f86c8), C(0xffcf94), C(0xf3d2a4), 1.2, C(0xffe9cf), C(0x8a6a4a), C(0xffbe80), 1.75],
  [.75, C(0x3a4c92), C(0xf59a62), C(0xb88390), 1.0, C(0xc8aed0), C(0x5a4a60), C(0xff9468), 1.1],
  [1, C(0x0d1639), C(0x2a3b72), C(0x1f2d5c), .95, C(0xb4c6ff), C(0x3a466e), C(0xa9c4ff), .9]];
function stopsAt(k) { k = clamp(k, 0, 1); let i = 0; while (i < STOPS.length - 2 && k > STOPS[i + 1][0]) i++; const a = STOPS[i], b = STOPS[i + 1], f = clamp((k - a[0]) / (b[0] - a[0]), 0, 1);

// the village outdoors: grass, hills, trees, the beit knesset with windows that can glow, lamps, stars and a moon
function townWorld(o) {
  const Wd = roadWorld(Object.assign({ ground: 'grass', groundSize: 700, shadowExt: 42, fogNear: 100, fogFar: 420 }, o || {}));
  const hr = rng(3), hc = ['#6f9a52', '#7aa65a', '#628c4c', '#86ad62'];
  for (let i = 0; i < 12; i++) { const x = -330 + i * 60 + (hr() - .5) * 30, z = 225 + hr() * 60, r = 45 + hr() * 30;
    const h = ball(1, hc[i % 4], { pos: [x, -3, z], scale: [r * 1.5, r * .42, r], ink: false }); h.castShadow = false; Wd.add(h); }
  for (let i = 0; i < 8; i++) { const sx = i % 2 ? 1 : -1, x = sx * (170 + hr() * 110), z = 10 + hr() * 190, r = 40 + hr() * 30;

  // beit knesset windows (warm light, grows at night)
  const winMats = [], warm = [];
  for (const sx of [-1, 1]) { const wx = sx * 4.6, sh = new THREE.Shape(); sh.moveTo(wx - 1.1, 1.6); sh.lineTo(wx + 1.1, 1.6); sh.lineTo(wx + 1.1, 4.9);
    for (let i = 0; i <= 14; i++) { const a = i / 14 * Math.PI; sh.lineTo(wx + Math.cos(a) * 1.1, 4.9 + Math.sin(a) * 1.1); } sh.lineTo(wx - 1.1, 1.6);
    const m = new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0, fog: false, depthWrite: false }), me = new THREE.Mesh(new THREE.ShapeGeometry(sh), m);
    me.position.set(0, 0, ZV + .36); me.rotation.y = Math.PI; me.renderOrder = 2; Wd.add(me); winMats.push(m);
    const gs = glowSprite(Wd, WARMT, 10, [sx * 4.6, 4, ZV - .8], 0); warm.push([gs, .7]); }
  { const sp = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshBasicMaterial({ map: WARMT, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0, fog: false }));
    sp.rotation.x = -Math.PI / 2; sp.position.set(0, .07, ZV - 5); Wd.add(sp); warm.push([sp, .8]); }
  for (const sx of [-1, 1]) { Wd.add(cyl(.09, .12, 3.2, 0x2e2a26, { pos: [sx * 6, 1.6, ZV - 5.2], ink: false }));
    const lm = new THREE.Mesh(new THREE.SphereGeometry(.28, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffe6a0, fog: false })); lm.position.set(sx * 6, 3.4, ZV - 5.2); Wd.add(lm);
    warm.push([glowSprite(Wd, WARMT, 6, [sx * 6, 3.4, ZV - 5.2], 0), .95]); }

function sunBall(Wd, r) {

  const rays = new THREE.Group(); g.add(rays); for (let i = 0; i < 12; i++) { const a = i / 12 * 6.2832, c = new THREE.Mesh(new THREE.ConeGeometry(r * .17, r * .9, 4), new THREE.MeshBasicMaterial({ color: 0xffc21a, fog: false })); c.position.set(Math.cos(a) * r * 1.7, Math.sin(a) * r * 1.7, 0); c.rotation.z = a - Math.PI / 2; rays.add(c); }

}
function bigStar(Wd, pos, size, ph) {
  const g = new THREE.Group(); g.position.set(...pos); Wd.add(g); const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.2832 + Math.PI / 2, r = i % 2 ? .42 : 1; if (i) sh.lineTo(Math.cos(a) * r, Math.sin(a) * r); else sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); } sh.closePath();

  const gl = glowSprite(Wd, GOLDT, size * 6); g.add(gl);
  Wd.on((t, cam) => { g.rotation.y = Math.atan2(cam.position.x - pos[0], cam.position.z - pos[2]); g.scale.setScalar(1 + .07 * Math.sin(t * 2.4 + ph)); });
  return g;
}

// ---------- the sun's arc, the big sundial ----------
const SUN_C = [0, 0, 36], SUN_R = 32, TILT = 12 * DEG;

function skyArc(Wd) { const dm = new THREE.MeshBasicMaterial({ color: 0xffd45a, fog: false });
  for (let d = 8; d <= 172; d += 4) { const p = sunAt(d * DEG), m = new THREE.Mesh(new THREE.SphereGeometry(Math.abs(d - 90) < 3 ? .55 : .32, 8, 6), dm); m.position.set(...p); Wd.add(m); } }

  const g = new THREE.Group(); g.position.set(x, 0, z); Wd.add(g);
  g.add(cyl(8.4, 8.7, .3, 0xb99a68, { pos: [0, .15, 0] })); g.add(cyl(7.8, 7.8, .28, 0xeadcb8, { pos: [0, .44, 0] })); g.add(cyl(7.0, 7.0, .04, 0xf6ecd0, { pos: [0, .6, 0], ink: false }));

}

// ---------- the beit knesset inside ----------
const CHAZ = { coat: '#1d1d24', beard: '#3a2a20', beardLen: .6, hat: 'hat', skin: '#efcfb0', glasses: false };

function shabbat(Wd, glowAmt) {   // white tablecloths, candlesticks, challot
  const cl = 0xfbf8ef;
  for (const sx of [-1, 1]) { const tx = sx * 5.4;
    Wd.add(box(1.4, .02, 6.3, cl, { pos: [tx, .832, 0], ink: false })); for (const s2 of [-1, 1]) Wd.add(box(.03, .56, 6.3, cl, { pos: [tx + s2 * .7, .56, 0], ink: false })); for (const s2 of [-1, 1]) Wd.add(box(1.4, .56, .03, cl, { pos: [tx, .56, s2 * 3.15], ink: false }));
    for (const z of [-1.4, 1.4]) { Wd.add(cyl(.1, .13, .12, 0xd8d2c0, { pos: [tx, .91, z] })); Wd.add(cyl(.03, .045, .34, 0xd8d2c0, { pos: [tx, 1.14, z] })); Wd.add(cyl(.035, .035, .3, 0xfff4d6, { pos: [tx, 1.46, z], ink: false }));
      const fl = new THREE.Mesh(new THREE.ConeGeometry(.045, .15, 8), new THREE.MeshBasicMaterial({ color: 0xffc84a, fog: false })); fl.position.set(tx, 1.69, z); Wd.add(fl);
      const gs = glowSprite(Wd, WARMT, .9, [tx, 1.7, z]); Wd.on(t => { const k = 1 + .08 * Math.sin(t * 9 + z * 3 + sx); gs.scale.set(.9 * k * glowAmt(t), .9 * k * glowAmt(t), 1); fl.scale.set(1, k, 1); }); }
    for (const dz of [-.3, .3]) Wd.add(ball(.2, 0xd9923a, { pos: [tx, .98, dz], scale: [1.5, .6, .9] })); }
  Wd.add(box(1.1, .02, .9, cl, { pos: [-2.8, 1.09, 4.0], ink: false }));
}
