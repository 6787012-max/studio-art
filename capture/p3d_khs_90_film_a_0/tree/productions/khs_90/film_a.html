<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
// khs_90 / film_a - portrait 1080x1920, OBJECTS ONLY (no people, no hands, no faces, no silhouettes).
// Idea: only one who has questions enters the shiur. The angel does Hashem's will and feels no question (a messenger);
// Israel, who had the questions, will be inside and understand; the curious enjoy, the "everything is fine" will not.
// Look: deep BURGUNDY / plum walls, warm GOLD light on the inside, cool dim side outside, soft IVORY, small TEAL accents. Flat toon, ink outline.
// Camera: PENDULUM PAN - the camera stands in front of one partition wall with a doorway; it swings left and right; the final shot passes through the doorway.
// Every state is a pure function of the global time T (no Math.random / Date / rAF).
window.CLIP_DUR = 61.96;
import { film, world, THREE, ease, clamp, lerp, mesh, toon, canvasTex } from '../../lib/stage3d.js';

const TAU = Math.PI * 2, PI = Math.PI;
const BURG = 0x5c1a33, PLUM = 0x2e1028, PLUM_D = 0x1c0a1a, GOLD = 0xffd27a, IVORY = 0xfff6e2, WHITE = 0xffffff;
const TEAL = 0x2ad0c0, TEAL_D = 0x1a7c70, CORAL = 0xff7f6e, RED = 0xc8262f, DARK = 0x1a0a14, GREEN = 0x3fd27a;
const COPPER = 0xc87533, INKC = 0x1a0a14, DOOR = 0x7a2a46, BOXC = 0x3d2a3a;
const FLOOR = -0.87;          // top of the floor slab (objects stand on it)
const TZ = -3;                // z of the hero plane (objects stand in front of the wall)
const WZ = -4.6;              // z of the partition wall (doorway in the middle)
const DOORX = .8;             // half width of the doorway
const UPV = .2;               // framing: hero in the upper-middle band; caption box is below 64%
const T0 = [0, 10.6, 21.49, 27.08, 37.99, 45.14, 55.76];   // global start of each shot
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const sm = (t, a, b) => ease.sm(P(t, a, b));
// pendulum pan keys (global time -> look x)
const PANK = [[0, -.6], [5.3, .5], [10.6, -.4], [21.5, -.5], [27.1, .2], [38.0, .9], [45.1, .6], [55.8, 0], [62.8, 0]];
function piece(T, keys) {
  if (T <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) { const a = keys[i][0], va = keys[i][1], b = keys[i + 1][0], vb = keys[i + 1][1]; if (T <= b) return lerp(va, vb, ease.sm(clamp((T - a) / (b - a), 0, 1))); }
  return keys[keys.length - 1][1];
}
const PANX = T => piece(T, PANK);
// camera height stays; it walks forward only in the last shot, through the doorway
const CAMZ = T => T < 55.76 ? TZ + 6.6 : lerp(TZ + 6.6, TZ + 2.8, ease.sm(clamp((T - 55.76) / 7.0, 0, 1)));

// ---------------- helpers ----------------
let GT = null;
const glowTex = () => GT || (GT = canvasTex(128, 128, (g, w, h) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); }));
const spr = (tex, size, op, tint) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: tint === undefined ? 0xffffff : tint, depthWrite: false, transparent: true, fog: false, opacity: op, blending: THREE.AdditiveBlending })); s.scale.set(size, size, 1); s.renderOrder = 10; return s; };
const mk = (geo, color, o) => { o = o || {}; return mesh(geo, toon(color, o.mat), Object.assign({ inkW: .008, inkColor: INKC }, o)); };
const plainM = (geo, color, pos, parent) => { const m = new THREE.Mesh(geo, toon(color)); m.position.set(pos[0], pos[1], pos[2]); parent.add(m); return m; };
const aimUp = (pos, tgt, fov, up) => { const d = Math.hypot(pos[0] - tgt[0], pos[1] - tgt[1], pos[2] - tgt[2]); return [tgt[0], tgt[1] - up * 2 * Math.tan(fov * PI / 360) * d, tgt[2]]; };
const glowMat = (color, intensity) => ({ emissive: color, emissiveIntensity: intensity });
const V_UP = new THREE.Vector3(0, 1, 0);
// place a thin cylinder between two points (emissive thread)
function link(m, a, b) { const d = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]); const L = d.length(); m.position.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2); m.quaternion.setFromUnitVectors(V_UP, d.normalize()); m.scale.set(1, Math.max(L, .001), 1); }
const addlight = (geo, color, op) => { const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })); return m; };
// pendulum camera: fixed position in front of the wall, the look target swings left/right; walks through the doorway at the end
function camFor(T) { const cz = CAMZ(T), tx = PANX(T); const pos = [0, .7, cz]; const tgt = [tx, .3, cz - 6.6]; return { pos, look: aimUp(pos, tgt, 58, UPV), fov: 58 }; }
function heroBox(Wd, fn) {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial()); m.visible = false; g.add(m); Wd.add(g);
  Wd.on(t => { const bs = fn(t).filter(Boolean); if (!bs.length) return; const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const b of bs) for (let q = 0; q < 3; q++) { lo[q] = Math.min(lo[q], b[q] - b[q + 3]); hi[q] = Math.max(hi[q], b[q] + b[q + 3]); }
    g.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2); g.scale.set(Math.max(hi[0] - lo[0], .01), Math.max(hi[1] - lo[1], .01), Math.max(hi[2] - lo[2], .01)); });
  Wd.hero = g; return g;
}
function scene(k, heroFn) {
  const Wd = world({ fogColor: 0x240d1c, fogNear: 22, fogFar: 80, skyTop: 0x2a0d20, skyBottom: 0x3a1428, hemiSky: 0xfff0d8, hemiGround: 0x3a1a2a, hemi: 1.05, sunColor: 0xffd9a0, sun: .6, sunPos: [3, 10, 8], shadowExt: 10, skyR: 300 });
  const S = Wd.scene;
  // the partition: cool dim plum on the outside (left), warm burgundy on the inside (right), doorway in the middle with a lintel
  plainM(new THREE.BoxGeometry(30, 14, .5), PLUM, [-15.8, FLOOR + 6, WZ], S);
  plainM(new THREE.BoxGeometry(30, 14, .5), BURG, [15.8, FLOOR + 6, WZ], S);
  plainM(new THREE.BoxGeometry(1.6, 11, .5), BURG, [0, FLOOR + 8.5, WZ], S);
  plainM(new THREE.BoxGeometry(60, .4, 26), PLUM_D, [0, FLOOR - .2, TZ - 8], S);   // floor slab, top at FLOOR
  const warm = spr(glowTex(), 7, .35, GOLD); warm.position.set(3.2, FLOOR + 3.4, WZ + .3); S.add(warm);
  const cool = spr(glowTex(), 6, .25, 0x7fb8d8); cool.position.set(-3.4, FLOOR + 3.4, WZ + .3); S.add(cool);
  heroBox(Wd, heroFn);
  Wd.cam = t => camFor(T0[k] + t);
  return { Wd, S };
}
// the doorway door: pivot on its left edge; lock shaped like a question mark on the front face
function door(S) {
  const dp = new THREE.Group(); dp.position.set(-DOORX, FLOOR, WZ); S.add(dp);
  dp.add(mk(new THREE.BoxGeometry(1.6, 3.0, .22), DOOR, { pos: [DOORX, 1.5, 0] }));
  sign(dp, DARK, [DOORX, 1.85, .16], .42);
  return dp;
}
// question mark (or, after morph, exclamation mark): hook + stem + dot; morph(m) 0 = '?', 1 = '!'
function sign(parent, col, pos, size) {
  const g = new THREE.Group(); g.position.set(pos[0], pos[1], pos[2]); g.scale.setScalar(size); parent.add(g);
  const hook = mk(new THREE.TorusGeometry(.2, .06, 14, 28, PI * 1.5), col, { pos: [0, .22, 0], rot: [0, 0, -PI / 2], ink: false });
  const stem = mk(new THREE.BoxGeometry(.13, .5, .1), col, { pos: [0, .12, 0], ink: false });
  const dot = mk(new THREE.SphereGeometry(.07, 14, 10), col, { pos: [0, -.25, 0], ink: false });
  g.add(hook); g.add(stem); g.add(dot);
  stem.scale.set(1, .001, 1);
  const parts = [hook, stem, dot];
  return {
    g,
    morph(m) { hook.scale.setScalar(Math.max(.001, 1 - m)); stem.scale.set(1, Math.max(.001, m), 1); },
    tint(c1, c2, m) { const A = new THREE.Color(c1), B = new THREE.Color(c2); parts.forEach(p => { if (p.material && p.material.color) p.material.color.lerpColors(A, B, m); }); }
  };
}
// small white sealed envelope with two small white wings (an object, no face)
function env(parent, x, y, z, s) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s || 1); parent.add(g);
  g.add(mk(new THREE.BoxGeometry(.9, .6, .08), IVORY, { pos: [0, 0, 0] }));
  g.add(mk(new THREE.BoxGeometry(.55, .12, .05), WHITE, { pos: [-.62, .22, 0], rot: [0, 0, .5], ink: false }));
  g.add(mk(new THREE.BoxGeometry(.55, .12, .05), WHITE, { pos: [.62, .22, 0], rot: [0, 0, -.5], ink: false }));
  return g;
}
// oil lamp: copper base and a small gold flame (object)
function lamp(parent, x, y, z, s) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s || 1); parent.add(g);
  g.add(mk(new THREE.CylinderGeometry(.14, .2, .3, 18), COPPER, { pos: [0, 0, 0] }));
  g.add(mk(new THREE.SphereGeometry(.17, 16, 12), GOLD, { pos: [0, .3, 0], ink: false, mat: glowMat(0xffc85a, 1.3) }));
  return g;
}
// open book on a lectern: teal-dark hard cover, two ivory pages in a V
function book(S, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); S.add(g);
  g.add(mk(new THREE.BoxGeometry(2.2, .1, 1.3), TEAL_D, { pos: [0, 0, 0], ink: false }));
  [-1, 1].forEach(side => {
    const pg = new THREE.Group(); pg.position.set(side * .55, .17, 0); pg.rotation.z = side * .35; g.add(pg);
    pg.add(mk(new THREE.BoxGeometry(1.1, .05, 1.1), IVORY, { pos: [0, 0, 0], ink: false }));
    for (let i = 0; i < 5; i++) pg.add(mk(new THREE.BoxGeometry(.85, .012, .04), 0x6b5a3a, { pos: [0, .03, -.38 + i * .19], ink: false }));
  });
  return g;
}
function bg(S, col, pos, size, op) { const s = spr(glowTex(), size, op, col); s.position.set(pos[0], pos[1], pos[2]); S.add(s); return s; }

// ---------------- shot 1 (0-10.6): Rashi - angels (envelopes) outside, the warm hall with lamps inside; an envelope asks "?" toward the inside ----------------
function b01() {
  const k = 0;
  const { Wd, S } = scene(k, t => [[-1.2, FLOOR + 2.4, TZ, 1.8, 1.8, 1.0], [2.0, FLOOR + 1.0, TZ, 1.0, 1.0, 1.0]]);
  const E = [[-1.9, FLOOR + 2.8, TZ + .3, 1.0], [-1.2, FLOOR + 3.7, TZ + .1, .9], [-1.6, FLOOR + 1.7, TZ + .5, .85], [-0.7, FLOOR + 2.6, TZ + .6, .8]];
  const envs = E.map(([x, y, z, s]) => env(S, x, y, z, s));
  [[1.2, TZ - .2], [1.9, TZ - .3], [2.6, TZ - .1]].forEach(([x, z]) => lamp(S, x, FLOOR + .2, z, .9));
  bg(S, GOLD, [2.0, FLOOR + 1.0, TZ - .6], 4.5, .35);
  const bub = new THREE.Group(); S.add(bub);
  bub.add(mk(new THREE.SphereGeometry(.42, 20, 14), IVORY, { pos: [0, 0, 0], ink: false }));
  const q = sign(bub, CORAL, [0, 0, .4], .9); q.morph(0);
  Wd.on(t => {
    envs.forEach((g, i) => { g.position.y = E[i][1] + .12 * Math.sin(t * 1.6 + i * 1.7); });
    envs[0].rotation.y = -.7 * sm(t, 3.0, 6.0);          // the first angel turns toward the doorway
    const f = sm(t, 4.5, 9.0);
    bub.visible = t > 3.0;
    bub.position.set(E[0][0] + f * (2.2 - E[0][0]), E[0][1] + .9 + .6 * f, TZ + .3);
  });
  return Wd;
}

// ---------------- shot 2 (10.6-21.49): the reward of the future - an open book on a lectern; ONE golden beam rises from it ----------------
function b02() {
  const k = 1;
  const { Wd, S } = scene(k, t => [[.4, FLOOR + 3.0, TZ, 2.2, 3.4, 1.0]]);
  plainM(new THREE.BoxGeometry(1.1, 1.2, 1.0), BURG, [.4, FLOOR + .6, TZ], S);
  book(S, .4, FLOOR + 1.22, TZ);
  const beam = addlight(new THREE.CylinderGeometry(.09, .09, 1, 14), GOLD, .95); beam.visible = false; S.add(beam);
  const glow = bg(S, GOLD, [.4, FLOOR + 1.4, TZ + .2], 3.2, 0);
  Wd.on(t => {
    const b = sm(t, 1.2, 4.0), h = .2 + 5.0 * b;
    beam.visible = b > .01; beam.scale.set(1, h, 1); beam.position.set(.4, FLOOR + 1.25 + h / 2, TZ);
    glow.material.opacity = .8 * b;
  });
  return Wd;
}

// ---------------- shot 3 (21.49-27.08): who enters? an envelope with no key bumps the door and floats back; the question-mark key opens the door for the lamp ----------------
function b03() {
  const k = 2;
  const { Wd, S } = scene(k, t => [[0, FLOOR + 1.8, WZ + .3, 1.8, 2.4, 1.2]]);
  const dp = door(S);
  const ev = env(S, -2.2, FLOOR + 1.9, WZ + .5, 1.0);
  const lp = lamp(S, 0, FLOOR + 1.1, TZ + .5, 1.0);
  const kg = sign(S, GOLD, [2.8, FLOOR + 1.1, TZ + .5], .5);
  Wd.on(t => {
    const bump = sm(t, .2, .8) - sm(t, .9, 1.6);
    ev.position.x = -2.2 + 1.2 * bump;
    const g1 = sm(t, 1.6, 3.0), g2 = sm(t, 4.4, 5.5);
    const lx = lerp(2.8, 0, g1), ly = lerp(FLOOR + 1.1, FLOOR + 1.9, g1), lz = lerp(TZ + .5, WZ + 1.0, g1);
    lp.position.set(lx, ly, lerp(lz, WZ - 1.6, g2));
    lp.scale.setScalar(1 - .3 * g2);
    const kf = sm(t, 3.0, 3.6);   // the key is carried above the lamp, then slides into the lock
    kg.g.position.set(lerp(lx, 0, kf), lerp(ly + .75, FLOOR + 1.85, kf), lerp(lz + .25, WZ + .16, kf));
    kg.g.visible = t < 3.7;
    dp.rotation.y = 1.45 * sm(t, 3.6, 4.4);   // the door opens after the key fits
  });
  return Wd;
}

// ---------------- shot 4 (27.08-37.99): the angel flies along a straight teal line with a green check stamp; cracks below it; it does not slow or turn ----------------
function b04() {
  const k = 3;
  const { Wd, S } = scene(k, t => [[0, FLOOR + 1.8, TZ, 3.2, 2.2, 1.0]]);
  const LY = FLOOR + 2.4;
  const line = mk(new THREE.CylinderGeometry(.035, .035, 1, 10), TEAL, { ink: false, mat: glowMat(0x2ad0c0, 1.0) });
  S.add(line); link(line, [-3.4, LY, TZ], [3.4, LY, TZ]);
  const e = env(S, -3.4, LY, TZ + .4, 1.2);
  const check = new THREE.Group(); check.position.set(0, 0, .06); e.add(check);
  check.add(mk(new THREE.BoxGeometry(.32, .08, .04), GREEN, { pos: [-.1, -.06, .05], rot: [0, 0, -.7], ink: false }));
  check.add(mk(new THREE.BoxGeometry(.56, .08, .04), GREEN, { pos: [.14, .07, .05], rot: [0, 0, .75], ink: false }));
  [[-2.4, .8, .5], [-.7, .6, .7], [.9, 1.0, .4], [2.5, .7, .6]].forEach(([x, h, r]) => {
    S.add(mk(new THREE.ConeGeometry(.3 * r + .15, h, 4), DARK, { pos: [x, FLOOR + h / 2, TZ - .2], rot: [0, 0, .25], ink: false }));
    S.add(mk(new THREE.BoxGeometry(.6, .05, .05), RED, { pos: [x + .2, FLOOR + .9, TZ + .3], rot: [0, 0, .9], ink: false }));
  });
  Wd.on(t => {
    e.position.x = lerp(-3.4, 3.4, P(t, .6, 8.4));
    check.scale.setScalar(Math.max(.001, sm(t, 0, .6)));
  });
  return Wd;
}

// ---------------- shot 5 (37.99-45.14): Israel inside - many coral question marks over the lamps slowly straighten into gold exclamation marks ----------------
function b05() {
  const k = 4;
  const { Wd, S } = scene(k, t => [[0, FLOOR + 2.4, TZ, 2.4, 2.6, 1.0]]);
  const pos = [[-1.6, FLOOR + 2.3], [-.4, FLOOR + 3.3], [.9, FLOOR + 2.0], [1.7, FLOOR + 3.4], [-1.0, FLOOR + 4.2]];
  const sg = pos.map(([x, y], i) => sign(S, CORAL, [x, y, TZ + .1 * i - .2], .8 + .1 * (i % 2)));
  [[-1.2, FLOOR + .2], [.2, FLOOR + .2], [1.3, FLOOR + .2]].forEach(([x, y]) => lamp(S, x, y, TZ, .9));
  const glow = bg(S, GOLD, [.2, FLOOR + 2.6, TZ - .2], 4, 0);
  Wd.on(t => {
    sg.forEach((s, i) => {
      const m = sm(t, .6 + .5 * i, 2.4 + .5 * i);
      s.morph(m); s.tint(CORAL, GOLD, m);
      s.g.position.y = pos[i][1] + .15 * Math.sin(t * 1.3 + i);
    });
    glow.material.opacity = .8 * sm(t, 2.0, 4.0);
  });
  return Wd;
}

// ---------------- shot 6 (45.14-55.76): the curious - round teal question balls drop into a glass jar and the gold level rises; a jagged red complaint is pushed away ----------------
function b06() {
  const k = 5;
  const { Wd, S } = scene(k, t => [[.2, FLOOR + 1.6, TZ, 2.6, 2.4, 1.0]]);
  const JX = 1.2;
  const jar = new THREE.Mesh(new THREE.CylinderGeometry(.75, .75, 2.4, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0xbff3ee, transparent: true, opacity: .28, depthWrite: false, side: THREE.DoubleSide }));
  jar.position.set(JX, FLOOR + 1.3, TZ); S.add(jar);
  plainM(new THREE.CylinderGeometry(.75, .75, .12, 32), TEAL_D, [JX, FLOOR + .06, TZ], S);
  const lvl = new THREE.Mesh(new THREE.CylinderGeometry(.66, .66, 1, 28), new THREE.MeshBasicMaterial({ color: GOLD })); S.add(lvl);
  const JIT = [-.2, .15, 0, -.1, .2, -.2, .1, 0, .15];
  const balls = JIT.map((j, i) => { const m = mk(new THREE.SphereGeometry(.15, 16, 12), TEAL, { pos: [0, 0, 0], ink: false, mat: glowMat(0x2ad0c0, .5) }); S.add(m); return m; });
  const cmp = mk(new THREE.IcosahedronGeometry(.42, 0), RED, { pos: [0, 0, 0], ink: true });
  S.add(cmp);
  Wd.on(t => {
    balls.forEach((m, i) => {
      const a = .6 + .6 * i, s = sm(t, a, a + 1.0);
      m.visible = t > a - .1;
      m.position.set(JX + JIT[i], lerp(FLOOR + 3.8, FLOOR + .2 + .22 * i, s), TZ + .1);
    });
    const h = .1 + 2.0 * sm(t, 1.2, 6.4);
    lvl.scale.set(1, h, 1); lvl.position.set(JX, FLOOR + .1 + h / 2, TZ);
    cmp.position.set(lerp(.2, -1.6, sm(t, 1.0, 4.5)), FLOOR + 1.2, TZ + .4);
    cmp.rotation.y = 1.2 * t;
  });
  return Wd;
}

// ---------------- shot 7 (55.76-62.76): the apathetic "everything is fine" - a flat closed box outside; the door closes in front of it; the camera passes through the doorway ----------------
function b07() {
  const k = 6;
  const { Wd, S } = scene(k, t => [[-1.0, FLOOR + .8, TZ, 1.4, 1.2, 1.0], [0, FLOOR + 1.8, WZ, .9, 2.4, .6]]);
  const dp = door(S);
  mk(new THREE.BoxGeometry(1.4, .9, .5), BOXC, { pos: [-1.4, FLOOR + .45, TZ + .4] });
  S.add(mk(new THREE.BoxGeometry(1.4, .9, .5), BOXC, { pos: [-1.4, FLOOR + .45, TZ + .4] }));
  S.add(mk(new THREE.BoxGeometry(.6, .06, .03), TEAL, { pos: [-1.4, FLOOR + .5, TZ + .68], ink: false }));
  Wd.on(t => {
    dp.rotation.y = 1.45 * (1 - sm(t, .2, 1.5)) + 1.45 * sm(t, 2.6, 3.4);   // closes softly, then opens again for the camera
  });
  return Wd;
}

const SH = (id, dur, caps, capAt, build) => ({ id, dur, wide: true, caps, capAt, build });
film({
  W: 1080, H: 1920, xf: .4, vault: 'captions_vault.json',
  shots: [
    SH('s01', 10.6, ['G_CAP_01', 'G_CAP_05'], [0.0, 5.82, 10.6], b01),
    SH('s02', 10.89, ['G_CAP_09', 'G_CAP_14'], [0.0, 5.23, 10.89], b02),
    SH('s03', 5.59, ['G_CAP_18'], [0.0, 5.59], b03),
    SH('s04', 10.91, ['G_CAP_22', 'G_CAP_27'], [0.0, 5.83, 10.91], b04),
    SH('s05', 7.15, ['G_CAP_33'], [0.0, 7.15], b05),
    SH('s06', 10.62, ['G_CAP_37', 'G_CAP_40'], [0.0, 5.31, 10.62], b06),
