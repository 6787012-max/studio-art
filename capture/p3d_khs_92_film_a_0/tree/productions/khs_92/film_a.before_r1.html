<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>khs 92 film a</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
// khs_92 / film_a - portrait 1080x1920, OBJECTS ONLY (no people, no hands, no faces, no silhouettes).
// Look: MINT-TEAL + CREAM background, CORAL accent, deep NAVY rail, a little soft GOLD only for "actual". Bright studio daylight, flat toon.
// Central metaphor: a straight navy RAIL = the axis (time); ticks = years; stages = stages of growth; objects move along it.
// Camera: locked level camera per shot, slow dolly along the rail; hard cuts between shots (template).
// Every state is a pure function of the shot-local time lt (no Math.random / Date / rAF).
window.CLIP_DUR = 29.03;
import { film, world, THREE, ease, clamp, lerp, mesh, toon, canvasTex } from '../../lib/stage3d.js';

const PI = Math.PI;
const FLOOR = -0.9;           // top of the floor slab (objects stand on it)
const LEV = -0.05;            // camera / look height
const MINT = 0x8fdcc9, MINT_D = 0x3fae98, CREAM = 0xfff6e6, CORAL = 0xf2735f, NAVY = 0x1f2f4f;
const GOLD = 0xf2c14e, GOLD_L = 0xffe38a, LEAF = 0x4fbf8e, LEAF_D = 0x2f8f6a, POT = 0xf0a07e, BARK = 0x6b4e3d;
const GREYC = 0xb9c6c6, WHITE = 0xffffff, INK = 0x1b2a3a, BLUE = 0x4fb3e8, DUST = 0xf6ece0;

const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const sm = (t, a, b) => ease.sm(P(t, a, b));
const pop = (t, a, b) => Math.max(.001, sm(t, a, b));
// piecewise smooth track: keys [[t, x, y], ...] -> [x, y]
function track(t, keys) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const k = ease.sm(clamp((t - a[0]) / (b[0] - a[0]), 0, 1)); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
  }
  const z = keys[keys.length - 1]; return [z[1], z[2]];
}

// ---------------- helpers ----------------
const mk = (geo, color, o) => { o = o || {}; return mesh(geo, toon(color, o.mat), Object.assign({ inkW: .008, inkColor: INK }, o)); };
const put = (parent, geo, color, pos, o) => { const m = mk(geo, color, Object.assign({ pos }, o || {})); parent.add(m); return m; };
let GT = null;
const glowTex = () => GT || (GT = canvasTex(128, 128, (g, w, h) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); }));
const spr = (tex, size, op, tint) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: tint === undefined ? 0xffffff : tint, depthWrite: false, transparent: true, fog: false, opacity: op, blending: THREE.AdditiveBlending })); s.scale.set(size, size, 1); s.renderOrder = 10; return s; };
function heroBox(Wd, fn) {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial()); m.visible = false; g.add(m); Wd.add(g);
  Wd.on(t => { const bs = fn(t).filter(Boolean); if (!bs.length) return; const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const b of bs) for (let q = 0; q < 3; q++) { lo[q] = Math.min(lo[q], b[q] - b[q + 3]); hi[q] = Math.max(hi[q], b[q] + b[q + 3]); }
    g.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2); g.scale.set(Math.max(hi[0] - lo[0], .01), Math.max(hi[1] - lo[1], .01), Math.max(hi[2] - lo[2], .01)); });
  Wd.hero = g; return g;
}
// one scene: mint floor, locked level camera that dollies along x (the rail direction); o = {camZ, x0, x1, rise}
function scene(heroFn, dur, o) {
  o = o || {};
  const Wd = world({ fogColor: 0xe9fbf6, fogNear: 26, fogFar: 80, skyTop: 0xa7e6da, skyBottom: 0xfff6e6, hemiSky: 0xffffff, hemiGround: 0xbfe9dc, hemi: 1.0, sunColor: 0xfff1d0, sun: .7, sunPos: [3, 10, 8], shadowExt: 8, skyR: 200 });
  const S = Wd.scene;
  put(S, new THREE.BoxGeometry(60, .4, 30), MINT, [0, FLOOR - .2, -10], { ink: false });
  heroBox(Wd, heroFn);
  const cz = o.camZ || 6.5, x0 = o.x0 || 0, x1 = o.x1 || 0, rise = o.rise || 0;
  Wd.cam = lt => { const k = ease.sm(clamp(lt / dur, 0, 1)); const x = lerp(x0, x1, k);
    return { pos: [x, LEV + .2 + rise * k, cz], look: [x, LEV + rise * k * .5, 0], fov: 50 }; };
  return { Wd, S };
}
// navy rail along x, starting at x=-2.4, grows with s in 0..1
function rail(S) {
  const g = new THREE.Group(); g.position.set(-2.4, FLOOR + .06, 0); S.add(g);
  const bar = put(g, new THREE.BoxGeometry(1, .08, .08), NAVY, [0, 0, 0], { ink: false });
  const R = { g, bar, len: 4.8 };
  R.set = s => { bar.scale.x = Math.max(.001, R.len * s); bar.position.x = R.len * s / 2; };
  R.set(1);
  return R;
}
const tickX = [-1.8, -1.2, -.6, 0, .6, 1.2, 1.8];
function ticks(S) { return tickX.map(x => put(S, new THREE.BoxGeometry(.06, .45, .06), NAVY, [x, FLOOR + .25, 0], { ink: false })); }
function stage(S, x, h) { return put(S, new THREE.BoxGeometry(.5, h, .6), MINT_D, [x, FLOOR + h / 2, 0]); }
// question mark (hook + stem + dot)
function sign(parent, col, pos, size) {
  const g = new THREE.Group(); g.position.set(pos[0], pos[1], pos[2]); g.scale.setScalar(size); parent.add(g);
  g.add(mk(new THREE.TorusGeometry(.2, .06, 14, 28, PI * 1.5), col, { pos: [0, .22, 0], rot: [0, 0, -PI / 2], ink: false }));
  g.add(mk(new THREE.BoxGeometry(.13, .5, .1), col, { pos: [0, .12, 0], ink: false }));
  g.add(mk(new THREE.SphereGeometry(.07, 14, 10), col, { pos: [0, -.25, 0], ink: false }));
  return g;
}
// cream pedestal with a seed on top
function seed(S, x) {
  const g = new THREE.Group(); g.position.set(x, FLOOR, 0); S.add(g);
  put(g, new THREE.CylinderGeometry(.32, .34, .2, 28), CREAM, [0, .1, 0]);
  put(g, new THREE.SphereGeometry(.13, 16, 12), POT, [0, .3, 0], { ink: false });
  return g;
}
// sprout in a pot (base at local origin on the floor)
function sprout(S, x) {
  const g = new THREE.Group(); g.position.set(x, FLOOR, 0); S.add(g);
  put(g, new THREE.CylinderGeometry(.16, .12, .22, 18), POT, [0, .11, 0]);
  put(g, new THREE.CylinderGeometry(.025, .03, .4, 8), LEAF_D, [0, .42, 0], { ink: false });
  put(g, new THREE.SphereGeometry(.11, 14, 10), LEAF, [-.1, .6, 0], { ink: false });
  put(g, new THREE.SphereGeometry(.11, 14, 10), LEAF, [.1, .64, 0], { ink: false });
  return g;
}
// tree (base at local origin). young: leafy canopy. old: gnarled and bare, branches only.
function tree(S, x, z, s, old) {
  const g = new THREE.Group(); g.position.set(x, FLOOR, z); g.scale.setScalar(s); S.add(g);
  put(g, new THREE.CylinderGeometry(.5, .42, .45, 24), POT, [0, .22, 0]);
  put(g, new THREE.CylinderGeometry(.07, .11, 1.3, 10), BARK, [0, .9, 0]);
  if (old) {
    [[.15, 1.2, -.9, .5], [-.12, 1.35, .8, .45], [.05, 1.6, -.5, .4], [-.05, 1.75, .6, .35], [0, 1.9, 0, .25]]
      .forEach(([bx, by, a, len]) => put(g, new THREE.CylinderGeometry(.035, .05, len, 8), BARK, [bx, by, 0], { rot: [0, 0, a] }));
  } else {
    [[0, 1.5, .42], [-.3, 1.3, .32], [.3, 1.35, .32]].forEach(([bx, by, r]) => put(g, new THREE.SphereGeometry(r, 20, 14), LEAF, [bx, by, 0]));
  }
  return g;
}
function ghostify(g, op) { g.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = op; o.material.depthWrite = false; } }); }
// wall clock behind, greyed, no hands; hands group returned (scale 0 = no hands)
function clock(S, x, y, z) {
  put(S, new THREE.CylinderGeometry(.8, .8, .12, 36), GREYC, [x, y, z], { rot: [PI / 2, 0, 0] });
  const hg = new THREE.Group(); hg.position.set(x, y, z + .1); S.add(hg);
  put(hg, new THREE.BoxGeometry(.08, .45, .04), CORAL, [0, .22, 0], { ink: false });
  put(hg, new THREE.BoxGeometry(.05, .6, .04), CORAL, [0, .3, 0], { ink: false });
  return hg;
}
// watering can (coral) tilted over the plant
function can(S, x, y) {
  const g = new THREE.Group(); g.position.set(x, y, 0); g.rotation.z = -.5; S.add(g);
  put(g, new THREE.BoxGeometry(.5, .36, .36), CORAL, [0, 0, 0]);
  put(g, new THREE.CylinderGeometry(.035, .05, .5, 8), CORAL, [.42, .18, 0], { rot: [0, 0, -.9] });
  return g;
}

// ---------------- shot 1 (K1a+K1b, 0-3.83): if there were no time, how is a thing in potential? a seed; a ghost (translucent) tree above it; greyed clock behind; a coral "?" pops between ----------------
function b01() {
  const { Wd, S } = scene(t => [[0, 1.2, 0, 1.6, 1.6, .6]], 3.83, { camZ: 6.5 });
  clock(S, 0, FLOOR + 2.3, -1.6);
  seed(S, 0);
  const ghost = tree(S, 0, 0, .8, false); ghostify(ghost, .35); ghost.position.y = FLOOR + 1.3;
  const q = sign(S, CORAL, [0, FLOOR + .85, .3], 1);
  Wd.on(t => {
    q.scale.setScalar(Math.max(.001, .9 * sm(t, 1.2, 1.6) * (1 - .9 * sm(t, 3.0, 3.6))));
    q.rotation.y = .12 * Math.sin(t * 2.5);
    ghost.scale.setScalar(.8 * (1 + .025 * Math.sin(t * 9)));
  });
  return Wd;
}

// ---------------- shot 2 (K2, 3.83-13.74): what axis? the navy rail draws out from the seed, ticks pop, stages rise; the seed opens and the sprout hops one stage, then another; the clock gets two hands ----------------
function b02() {
  const { Wd, S } = scene(t => [[-.6, .9, 0, 1.0, 1.0, .5]], 9.91, { camZ: 9, x0: -.3, x1: .3 });
  const R = rail(S);
  const tk = ticks(S);
  const st1 = stage(S, -1.2, .3), st2 = stage(S, 1.2, .6);
  const hands = clock(S, 0, FLOOR + 2.3, -1.6);
  const sd = seed(S, -1.8);
  const sp = sprout(S, -1.8); sp.scale.setScalar(.001);
  Wd.on(t => {
    R.set(sm(t, .2, 1.6));
    tk.forEach((k, i) => { k.scale.y = pop(t, 1.4 + i * .3, 1.8 + i * .3); });
    st1.scale.y = pop(t, 4.4, 4.9); st2.scale.y = pop(t, 5.6, 6.2);
    sd.scale.setScalar(Math.max(.001, 1 - sm(t, 1.0, 1.4)));
    sp.scale.setScalar(pop(t, 1.2, 1.6));
    const [x, y] = track(t, [[1.6, -1.8, FLOOR], [4.6, -1.2, FLOOR + .3], [7.6, 1.2, FLOOR + .6]]);
    sp.position.set(x, y, 0);
    hands.scale.setScalar(pop(t, 6.4, 6.9));
    hands.rotation.z = -t * 1.8;
  });
  return Wd;
}

// ---------------- shot 3 (K4, 13.74-20.16): growing = potential to actual; the sprout (near) and a big tree (far) are the same one; a thin gold thread joins them; the ghost over the sprout fills ----------------
function b03() {
  const { Wd, S } = scene(t => [[0, 1.0, -.2, 1.9, 1.6, .8]], 6.42, { camZ: 9.5 });
  rail(S);
  const sp = sprout(S, -1.0); sp.scale.setScalar(.8);
  const tr = tree(S, 1.0, -1.2, 1.4, false); tr.scale.setScalar(.001);
  const ghost = tree(S, -1.0, 0, .8, false); ghostify(ghost, .4);
  const thread = put(S, new THREE.BoxGeometry(2.0, .04, .04), GOLD, [0, FLOOR + .9, 0], { ink: false, mat: { emissive: GOLD_L, emissiveIntensity: .6 } });
  Wd.on(t => {
    sp.scale.setScalar(.8 + .3 * sm(t, .5, 4.0));
    ghost.scale.setScalar(Math.max(.001, .8 * (1 - sm(t, .5, 4.0))));
    tr.scale.setScalar(pop(t, 1.0, 2.5) * 1.4);
    thread.material.emissiveIntensity = .3 + .5 * (.5 + .5 * Math.sin(t * 3));
    thread.scale.x = Math.max(.001, sm(t, 2.5, 3.5));
  });
  return Wd;
}

// ---------------- shot 4 (K5, 20.16-23.02): every drop - one step: a small coral can drops blue drops one by one on the sprout; with each drop it hops one tick and grows a notch; ticks behind it light up ----------------
function b04() {
  const { Wd, S } = scene(t => [[0, .6, 0, 1.6, 1.4, .6]], 2.86, { camZ: 6.5 });
  rail(S);
  const tk = ticks(S);
  const cn = can(S, -1.4, FLOOR + 2.0);
  const sp = sprout(S, -.6);
  const landT = [.85, 1.65, 2.45];
  const drops = [0, 1, 2].map(() => put(S, new THREE.SphereGeometry(.08, 14, 10), BLUE, [0, FLOOR + 1.0, 0], { ink: false }));
  const SX = t => track(t, [[0, -.6, FLOOR], [.85, 0, FLOOR], [1.65, .6, FLOOR], [2.5, 1.2, FLOOR]]);
  Wd.on(t => {
    const [x] = SX(t);
    sp.position.x = x;
    const landed = landT.filter(lt => t >= lt).length;
    sp.scale.setScalar(.9 + .12 * landed);
    cn.rotation.z = -.5 - .25 * sm(t, .1, .3);
    drops.forEach((d, i) => {
      const t0 = .4 + i * .8, f = sm(t, t0, t0 + .45);
      const dx = SX(t0 + .45)[0];
      d.position.set(dx, lerp(FLOOR + 1.6, FLOOR + 1.0, f), 0);
      d.scale.setScalar(t < t0 || t > t0 + .45 ? .001 : 1);
    });
    tk.forEach((k, i) => {
      const lit = x > tickX[i] + .1;
      k.material.emissive.setHex(lit ? GOLD : 0x000000);
      k.material.emissiveIntensity = lit ? .9 : 0;
    });
  });
  return Wd;
}

// ---------------- shot 5 (K6, 23.02-26.83): but without time, from a baby, at once old: rail, ticks and stages retract, the clock loses its hands; the sprout SNAPS in one pop to a huge old gnarled bare tree with a dust puff ----------------
function b05() {
  const { Wd, S } = scene(t => [[0, 1.2, 0, 1.4, 1.6, .6]], 3.81, { camZ: 6.5 });
  const R = rail(S);
  const tk = ticks(S);
  const st1 = stage(S, -1.2, .3), st2 = stage(S, 1.2, .6);
  const hands = clock(S, 0, FLOOR + 2.3, -1.6);
  const sp = sprout(S, 0); sp.scale.setScalar(1.4);
  const old = tree(S, 0, 0, 1.6, true); old.scale.setScalar(.001);
  const puff = spr(glowTex(), 1.6, 0, DUST); puff.position.set(0, FLOOR + .4, .3); S.add(puff);
  Wd.on(t => {
    R.set(1 - sm(t, .2, .9));
    tk.forEach(k => { k.scale.y = Math.max(.001, 1 - sm(t, .2, .9)); });
    st1.scale.y = Math.max(.001, 1 - sm(t, .2, .9)); st2.scale.y = Math.max(.001, 1 - sm(t, .2, .9));
    hands.scale.setScalar(Math.max(.001, 1 - sm(t, .2, .9)));
    const snap = t >= 1.0;
    sp.scale.setScalar(snap ? .001 : 1.4);
    old.scale.setScalar(snap ? 1.6 : .001);
    puff.material.opacity = .7 * sm(t, 1.0, 1.1) * (1 - sm(t, 1.2, 1.9));
    puff.scale.setScalar(1.2 + sm(t, 1.0, 1.9) * 1.2);
  });
  return Wd;
}

// ---------------- shot 6 (K7, 26.83-29.03): no process at all: the old tree stands on bare floor, the camera rises a little; in the last second the rail and the stages glide back in, soft gold ----------------
function b06() {
  const { Wd, S } = scene(t => [[0, 1.4, 0, 1.4, 1.6, .6]], 2.2, { camZ: 6.5, rise: .5 });
  const old = tree(S, 0, 0, 1.6, true);
  const R = rail(S);
  R.set(0.001);
  const tk = ticks(S);
  const st1 = stage(S, -1.2, .3), st2 = stage(S, 1.2, .6);
  tk.forEach(k => { k.scale.y = .001; }); st1.scale.y = .001; st2.scale.y = .001;
  Wd.on(t => {
    const g = sm(t, 1.2, 2.2);
    R.set(g);
    R.bar.material.emissive.setHex(GOLD_L); R.bar.material.emissiveIntensity = .8 * g;
    tk.forEach((k, i) => { k.scale.y = Math.max(.001, sm(t, 1.3 + i * .05, 1.9 + i * .05)); k.material.emissive.setHex(GOLD); k.material.emissiveIntensity = .6 * g; });
    st1.scale.y = Math.max(.001, sm(t, 1.4, 2.0)); st1.material.emissive.setHex(GOLD); st1.material.emissiveIntensity = .5 * g;
    st2.scale.y = Math.max(.001, sm(t, 1.5, 2.1)); st2.material.emissive.setHex(GOLD); st2.material.emissiveIntensity = .5 * g;
  });
  return Wd;
}

const SH = (id, dur, caps, capAt, build) => ({ id, dur, wide: true, caps, capAt, build });
film({
  W: 1080, H: 1920, xf: .0001, vault: 'captions_vault.json',
  shots: [
    SH('s01', 3.83, ['G_CAP_01'], [0.0, 3.83], b01),
    SH('s02', 9.91, ['G_CAP_04', 'G_CAP_08'], [0.0, 4.67, 9.91], b02),
    SH('s03', 6.42, ['G_CAP_11'], [0.0, 6.42], b03),
    SH('s04', 2.86, ['G_CAP_16'], [0.0, 2.86], b04),
    SH('s05', 3.81, ['G_CAP_17'], [0.0, 3.81], b05),
    SH('s06', 2.2, ['G_CAP_21'], [0.0, 2.2], b06),
  ]
});
</script>
</html>
