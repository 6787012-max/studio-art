<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>khs 95 film a</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>window.__T0=0.0000; window.__HQ_RENDER=true;</script>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
// khs_95 / film_a (short95, phase B, rev 2). Portrait 1080x1920, OBJECTS ONLY (no people, hands, arms, feet, faces, silhouettes).
// 6 shots, 9 caption boxes: s01 = CAP_01-08, s02 = CAP_09-10, s03 = CAP_11-13, s04 = CAP_14-15, s05 = CAP_16-22, s06 = CAP_23-28.
// Look: dusty-rose morning sky to cream horizon, terracotta floor, ochre hill face, olive growth, burgundy books, soft gold light.
// Side-view camera moves only (no orbit, no vertical crane). In-scene Hebrew (LBL_A..LBL_G) comes from captions_vault.json; no Hebrew here.
window.CLIP_DUR = 40.24;
import { film, world, THREE, ease, clamp, lerp, mesh, toon, label } from '../../lib/stage3d.js';
import { installRichness } from '../../lib/richness.js';
const VAULT = await (await fetch('captions_vault.json')).json();

const PI = Math.PI;
const FLOOR = -1.2, SLOPE = .45, SL = Math.atan(SLOPE);
const ROSE = 0xe9a79d, CREAM = 0xfff1d6, TERRA = 0xc8704a, OCHRE = 0xd9a441, OLIVE = 0x7d8f3a, OLIVE_L = 0xa4b565;
const BURG = 0x6b1e2e, PAGE = 0xfff4e0, GOLD = 0xf2c14e, GOLD_L = 0xffe08a, STONE = 0xe8d5b5, STONE_D = 0xd9b98f;
const WOOD = 0x9a6b44, INK = 0x4a2a2a, TRUNK = 0x7a4a2c, ROCK = 0xb9a58a, PINK = 0xd9475f, CLOUD = 0xfff8f0;
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const sm = (t, a, b) => ease.sm(P(t, a, b));
const mk = (geo, color, o) => { o = o || {}; const m = mesh(geo, toon(color, o.mat), Object.assign({ inkW: .008, inkColor: INK }, o)); m.castShadow = false; return m; };
const put = (parent, geo, color, pos, o) => { const m = mk(geo, color, Object.assign({ pos }, o || {})); parent.add(m); return m; };
const sY = x => SLOPE * x + .12;     // top of the hill face at x: stones and bushes sit on it
const SX = i => -3.2 + i * .95;      // path stone i (0..7)

function heroBox(Wd, fn) {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial()); m.visible = false; g.add(m); Wd.add(g);
  Wd.on(t => { const bs = fn(t).filter(Boolean); if (!bs.length) return; const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const b of bs) for (let q = 0; q < 3; q++) { lo[q] = Math.min(lo[q], b[q] - b[q + 3]); hi[q] = Math.max(hi[q], b[q] + b[q + 3]); }
    g.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2); g.scale.set(Math.max(hi[0] - lo[0], .01), Math.max(hi[1] - lo[1], .01), Math.max(hi[2] - lo[2], .01)); });
  Wd.hero = g; return g;
}
function scene(heroFn) {
  const Wd = world({ fogColor: 0xfbe6d0, fogNear: 40, fogFar: 120, skyTop: ROSE, skyBottom: CREAM, hemiSky: 0xffffff, hemiGround: 0xf3d9b8, hemi: 1.0, sunColor: 0xfff3dc, sun: .7, sunPos: [3, 10, 8], shadowExt: 8, skyR: 260 });
  const S = Wd.scene;
  put(S, new THREE.BoxGeometry(260, .4, 260), TERRA, [0, FLOOR - .2, 0], { ink: false, mat: { emissive: TERRA, emissiveIntensity: .25 } });
  put(S, new THREE.BoxGeometry(16, .9, 9), OCHRE, [.18, -.41, -1], { ink: false, rot: [0, 0, SL] });   // the hill face, rising to the right
  const h1 = put(S, new THREE.SphereGeometry(1, 36, 20), OLIVE_L, [-4.5, -.9, -8], { ink: false }); h1.scale.set(7, 2.6, 1);
  const h2 = put(S, new THREE.SphereGeometry(1, 36, 20), TERRA, [4.5, -1.3, -9], { ink: false }); h2.scale.set(8, 2.2, 1);
  heroBox(Wd, heroFn);
  const rich = installRichness(S); Wd.on(rich.onFrame);   // scene-richness probe for verify_scene.py
  return { Wd, S };
}
// side-view camera: camera and look-at move linearly; z = distance
function track(Wd, dur, c0, c1, l0, l1, z0, z1) {
  Wd.cam = lt => { const u = ease.sm(clamp(lt / dur, 0, 1));
    return { pos: [lerp(c0[0], c1[0], u), lerp(c0[1], c1[1], u), lerp(z0, z1, u)], look: [lerp(l0[0], l1[0], u), lerp(l0[1], l1[1], u), 0], fov: 50 }; };
}
function stones(S, i0, i1) {
  for (let i = i0; i <= i1; i++) { const x = SX(i); put(S, new THREE.CylinderGeometry(.32, .36, .16, 14), i % 2 ? STONE : STONE_D, [x, sY(x) + .06, 0], { ink: false }); }
}
// olive tree / bush: trunk + two leaf balls, stands on the hill face at x (z: depth)
function tree(S, x, s, z) {
  const g = new THREE.Group(); g.position.set(x, sY(x), z || 0); S.add(g);
  put(g, new THREE.CylinderGeometry(.04, .05, .3, 8), TRUNK, [0, .15, 0], { ink: false });
  put(g, new THREE.SphereGeometry(.32, 16, 12), OLIVE, [0, .42, 0], { ink: false });
  put(g, new THREE.SphereGeometry(.22, 14, 10), OLIVE_L, [.2, .6, .05], { ink: false });
  g.scale.setScalar(s || 1); return g;
}
function rock(S, x) { put(S, new THREE.DodecahedronGeometry(.13, 0), ROCK, [x, sY(x) + .07, .2], { ink: false }); }
function flower(S, x) { put(S, new THREE.SphereGeometry(.07, 10, 8), PINK, [x, sY(x) + .1, .25], { ink: false, mat: { emissive: PINK, emissiveIntensity: .4 } }); }
function cloud(S, x, y, z, s) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); S.add(g);
  const cm = { emissive: CLOUD, emissiveIntensity: .45 };
  put(g, new THREE.SphereGeometry(.9, 20, 14), CLOUD, [0, 0, 0], { ink: false, mat: cm });
  put(g, new THREE.SphereGeometry(.7, 20, 14), CLOUD, [.8, -.15, 0], { ink: false, mat: cm });
  put(g, new THREE.SphereGeometry(.6, 20, 14), CLOUD, [-.8, -.2, 0], { ink: false, mat: cm });
  return g;
}
// lantern position at local time t: hops stone to stone from i0 to i1 between t0 and t1
function lanternAt(t, i0, i1, t0, t1) {
  const u = P(t, t0, t1) * (i1 - i0); const i = Math.min(i0 + Math.floor(u), i1 - 1); const f = clamp(u - (i - i0), 0, 1);
  const x = lerp(SX(i), SX(i + 1), ease.sm(f));
  return [x, sY(x) + .26 + .3 * Math.sin(PI * f), .3];
}
function lantern(S) {
  const g = new THREE.Group(); S.add(g);
  put(g, new THREE.SphereGeometry(.17, 18, 14), 0xffb440, [0, 0, 0], { ink: false, mat: { emissive: 0xffa230, emissiveIntensity: 1.6 } });
  put(g, new THREE.SphereGeometry(.3, 18, 14), GOLD_L, [0, 0, 0], { ink: false, mat: { transparent: true, opacity: .5, emissive: GOLD_L, emissiveIntensity: 1.0 } });
  return g;
}
// in-scene sign: wooden pole, cream board sized to the Hebrew text, and the label on it (sprite is userData.text for the probe)
function sign(Wd, S, x, y, z, text, o) {
  o = o || {};
  const up = o.up || 1.05;
  const sp = label(Wd, text, { size: 64, height: o.h || .42, bg: null, color: '#6b1e2e', weight: 800, pos: [x, y + up, z + .14] });
  sp.userData.text = true;
  const g = new THREE.Group(); S.add(g);
  put(g, new THREE.BoxGeometry(sp.scale.x + .3, sp.scale.y + .2, .06), CREAM, [x, y + up, z + .05], { ink: true });
  put(g, new THREE.CylinderGeometry(.035, .035, up, 8), WOOD, [x, y + up / 2, z], { ink: false });
  return { g, sp };
}
// open prayer book: burgundy cover, two cream pages hinged at the spine (z axis), opening in a V (angle a)
function flap(B, a) { B.lp.rotation.z = -a; B.rp.rotation.z = a; }
function openBook(S, x, y, z, s, a) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); S.add(g);
  const cover = put(g, new THREE.BoxGeometry(.46, .03, .3), BURG, [0, .015, 0], { ink: false });
  const lp = new THREE.Group(); lp.position.set(0, .03, 0); g.add(lp);
  const pl = put(lp, new THREE.BoxGeometry(.2, .02, .26), PAGE, [-.1, .01, 0], { ink: false });
  const rp = new THREE.Group(); rp.position.set(0, .03, 0); g.add(rp);
  const pr = put(rp, new THREE.BoxGeometry(.2, .02, .26), PAGE, [.1, .01, 0], { ink: false });
  const B = { g, lp, rp, pl, pr, cover };
  flap(B, a === undefined ? .4 : a);
  return B;
}
function pedestal(S, x, h) { return put(S, new THREE.CylinderGeometry(.42, .5, h, 24), STONE, [x, sY(x) - .1 + h / 2, 0], { ink: false }); }

// shot 1 (CAP_01-08, 0.00-9.04): life advances, new perception, not at bar-mitzva age.
// Camera follows the lantern; the lantern hops stone to stone up the path; sun rises; signs LBL_B and LBL_A; clouds, bushes, rocks, flowers.
function b1() {
  const { Wd, S } = scene(t => { const p = lanternAt(t, 0, 5, .5, 6.0); return [[p[0], p[1], 0, 1.0, 1.0, .5]]; });
  Wd.cam = lt => { const p = lanternAt(lt, 0, 5, .5, 6.0); return { pos: [p[0], p[1], 11], look: [p[0], p[1], 0], fov: 50 }; };
  stones(S, 0, 7);
  tree(S, -2.3, .7, 0); tree(S, 1.9, .8, 0); tree(S, 3.0, 1.0, 0);
  flower(S, -2.6); flower(S, -0.9); flower(S, .9); flower(S, 2.6);
  rock(S, -1.7); rock(S, 2.3);
  cloud(S, -1.5, 4.4, -6, 1.0); cloud(S, 1.2, 5.0, -7, 1.3); cloud(S, 3.4, 4.2, -6, .9);
  const sun = put(S, new THREE.SphereGeometry(1.5, 32, 20), GOLD_L, [2.8, .8, -7], { ink: false, mat: { emissive: GOLD_L, emissiveIntensity: .9 } });
  const L = lantern(S);
  const sB = sign(Wd, S, SX(0), sY(SX(0)), 0, VAULT.LBL_B, { h: .42 });
  const sA = sign(Wd, S, SX(3), sY(SX(3)), 0, VAULT.LBL_A, { h: .42 });
  Wd.on(t => {
    sun.position.y = lerp(.8, 3.4, sm(t, 0, 9.04));
    sA.g.visible = sA.sp.visible = t >= 3.0;
    sB.g.visible = sB.sp.visible = t >= 6.0;
    const p = lanternAt(t, 0, 5, .5, 6.0); L.position.set(p[0], p[1], p[2]);
  });
  return Wd;
}

// shot 2 (CAP_09-10, 9.04-12.56): perception changes. Camera on the axis: lens in front, olive tree behind it.
// Inside the lens the tree goes faded/small -> sharp/full, twice.
function b2() {
  const LX = .3, LY = 1.0;
  const { Wd, S } = scene(t => [[LX, LY, .5, .95, .95, .3]]);
  Wd.cam = lt => ({ pos: [LX, .03, 8.0 - .5 * ease.sm(clamp(lt / 3.52, 0, 1))], look: [LX, .03, 0], fov: 50 });
  stones(S, 2, 7);
  const tr = tree(S, LX, 1.6, -1.5);            // behind the lens, on the camera axis
  tree(S, -1.8, .6, 0); tree(S, 2.1, .7, 0);
  rock(S, -2.3); rock(S, 1.4); flower(S, -.8); flower(S, 1.9);
  put(S, new THREE.TorusGeometry(.95, .06, 14, 48), GOLD, [LX, LY, .5], { ink: false });
  const glass = put(S, new THREE.CircleGeometry(.92, 40), 0xcfeeff, [LX, LY, .5], { ink: false, mat: { transparent: true, opacity: .3 } });
  Wd.on(t => {
    const pulse = clamp(sm(t, .6, 1.5) - sm(t, 1.8, 2.4) + sm(t, 2.6, 3.5), 0, 1);
    tr.scale.setScalar(.6 + 1.0 * pulse);
    const c = new THREE.Color(0xa9b59a).lerp(new THREE.Color(OLIVE), pulse);
    tr.children.forEach(m => m.material.color.copy(c));
    glass.material.opacity = .34 - .12 * pulse;
  });
  return Wd;
}

// shot 3 (CAP_11-13, 12.56-17.37): the same prayer at 13 and at 70 stays a child's prayer.
// Two pedestals, an identical open burgundy book on each; signs "13" and "70" beside them; LBL_D between.
function b3() {
  const { Wd, S } = scene(t => [[0, .9, 0, 2.6, 2.0, 1.4]]);
  Wd.cam = lt => ({ pos: [0, 3.0, 10.5 - 2 * ease.sm(clamp(lt / 4.81, 0, 1))], look: [0, .3, 0], fov: 50 });
  stones(S, 2, 4);
  pedestal(S, -1.0, .5); pedestal(S, 1.0, 1.25);
  openBook(S, -1.0, sY(-1) - .1 + .5, 0, 1.0, .4);
  openBook(S, 1.0, sY(1) - .1 + 1.25, 0, 1.0, .4);
  sign(Wd, S, -1.7, sY(-1.7) - .05, 0, VAULT.LBL_B, { h: .4 });
  sign(Wd, S, 1.7, sY(1.7) - .05, 0, VAULT.LBL_C, { h: .4 });
  sign(Wd, S, 0, 1.6, 0, VAULT.LBL_D, { h: .34 });
  return Wd;
}

// shot 4 (CAP_14-15, 17.37-21.76): he must pray a completely different prayer.
// A big open book (about 40% of the width), pages glowing gold, rays and sparks, LBL_E above.
function b4() {
  const BY = sY(0) + .04;
  const { Wd, S } = scene(t => [[0, BY + .3, 0, 1.0, .8, .6]]);
  Wd.cam = lt => ({ pos: [0, .6, 8.2 - .6 * ease.sm(clamp(lt / 4.39, 0, 1))], look: [0, .6, 0], fov: 50 });
  stones(S, 2, 5); rock(S, -1.2); tree(S, -1.7, .7, -.5); flower(S, 1.1); flower(S, -.9);
  const B = openBook(S, 0, BY, 0, 4.0, .3);
  const RY = BY + .2;
  const rays = new THREE.Group(); rays.position.set(0, RY, -.3); S.add(rays);
  for (let i = 0; i < 12; i++) { const a = 2 * PI * i / 12; put(rays, new THREE.BoxGeometry(.05, .8, .05), GOLD_L, [1.3 * Math.cos(a), 1.3 * Math.sin(a), 0], { ink: false, rot: [0, 0, a - PI / 2], mat: { emissive: GOLD_L, emissiveIntensity: 1 } }); }
  const sparks = [];
  for (let i = 0; i < 12; i++) sparks.push(put(S, new THREE.SphereGeometry(.04, 8, 6), GOLD_L, [0, 0, .2], { ink: false, mat: { emissive: GOLD_L, emissiveIntensity: 1 } }));
  const lab = label(Wd, VAULT.LBL_E, { size: 60, height: .36, bg: 'rgba(255,246,228,.92)', color: '#6b1e2e', weight: 800, pos: [0, BY + 1.7, .3] });
  lab.userData.text = true;
  Wd.on(t => {
    flap(B, .25 + .2 * sm(t, 0, 2.4));
    B.pl.material.emissive.setHex(GOLD); B.pr.material.emissive.setHex(GOLD);
    B.pl.material.emissiveIntensity = B.pr.material.emissiveIntensity = .9 * sm(t, .4, 2.2);
    rays.scale.setScalar(Math.max(.001, sm(t, .6, 2.2))); rays.rotation.z = .3 * t;
    sparks.forEach((s, i) => { const k = (t * .5 + i / 12) % 1; s.visible = t > 1.0;
      s.position.set(1.2 * Math.sin(i * 2.1 + t), RY + .2 + k * 1.6, .2); });
    lab.material.opacity = sm(t, 1.4, 2.6);
  });
  return Wd;
}

// shot 5 (CAP_16-22, 21.76-31.12): at bar mitzva he prays because everyone prays.
// Six identical open books on a shelf fill most of the width, flapping in unison; metronome; LBL_F above.
// From about 29.5 s one book (the middle-left one) stops and dims.
function b5() {
  const { Wd, S } = scene(t => [[0, .9, 0, 3.4, 1.0, 1.4]]);
  Wd.cam = lt => ({ pos: [0, .6, 9.5 - 1.0 * ease.sm(clamp(lt / 9.36, 0, 1))], look: [0, .6, 0], fov: 50 });
  put(S, new THREE.BoxGeometry(5.4, .18, 1.0), WOOD, [0, 1.31, 0], { ink: false });
  put(S, new THREE.CylinderGeometry(.08, .08, 2.5, 8), WOOD, [-2.4, .05, 0], { ink: false });
  put(S, new THREE.CylinderGeometry(.08, .08, 2.5, 8), WOOD, [2.4, .05, 0], { ink: false });
  const xs = [-1.4, -.84, -.28, .28, .84, 1.4];
  const BK = xs.map(x => openBook(S, x, 1.4, 0, 1.6, .3));
  const met = new THREE.Group(); met.position.set(2.0, 1.4 + .9, 0); S.add(met);
  put(S, new THREE.ConeGeometry(.2, .9, 4), WOOD, [2.0, 1.4 + .45, 0], { ink: false, rot: [0, PI / 4, 0] });
  put(met, new THREE.BoxGeometry(.035, .8, .035), INK, [0, -.4, 0], { ink: false });
  put(met, new THREE.BoxGeometry(.12, .12, .12), GOLD, [0, -.2, 0], { ink: false });
  sign(Wd, S, 0, 1.4, 0, VAULT.LBL_F, { h: .34 });
  const dark1 = new THREE.Color(0x4a4650), dark2 = new THREE.Color(0x2a2430), STOP = 7.74;
  Wd.on(t => {
    const a = .25 + .45 * (.5 + .5 * Math.sin(2 * PI * t / 1.6));   // all books flap in unison, open V
    BK.forEach((b, k) => flap(b, k === 2 && t >= STOP ? .05 : a));
    met.rotation.z = .35 * Math.sin(2 * PI * t / 1.2);
    const k = sm(t, STOP, STOP + .8);                                 // the stopped book dims ("not really praying")
    BK[2].pl.material.color.set(PAGE).lerp(dark1, k); BK[2].pr.material.color.set(PAGE).lerp(dark1, k);
    BK[2].cover.material.color.set(BURG).lerp(dark2, k);
  });
  return Wd;
}

// shot 6 (CAP_23-28, 31.12-40.24): prayer becomes part of life, connected to Hashem.
// Glowing open book on a pedestal at the left, a golden thread of beads rises along the path to a light at the top,
// an olive sapling grows beside the thread to about a quarter of the frame height, LBL_G lights up, LBL_E glows, slow pull-back.
function b6() {
  const BX = -2.2;
  const { Wd, S } = scene(t => [[0, .9, 0, 4.4, 2.6, 2]]);
  Wd.cam = lt => ({ pos: [0, .9, 11 + 2 * ease.sm(clamp(lt / 9.12, 0, 1))], look: [0, .9, 0], fov: 50 });
  stones(S, 1, 6);
  const topY = sY(BX) + .9;
  pedestal(S, BX, 1.0);
  const B = openBook(S, BX, topY, 0, 1.5, .3);
  B.pl.material.emissive.setHex(GOLD); B.pr.material.emissive.setHex(GOLD);
  B.pl.material.emissiveIntensity = B.pr.material.emissiveIntensity = .9;
  const end = [2.2, sY(2.2) + .9, .1], start = [BX, topY + .3, .1], N = 16, beads = [];
  for (let k = 0; k < N; k++) {
    const u = k / (N - 1);
    const pos = [lerp(start[0], end[0], u), lerp(start[1], end[1], u) + .45 * Math.sin(PI * u), .1];
    const b = put(S, new THREE.SphereGeometry(.09, 12, 10), GOLD_L, pos, { ink: false, mat: { emissive: GOLD, emissiveIntensity: 1.1 } });
    b.visible = false; beads.push(b);
  }
  put(S, new THREE.SphereGeometry(.4, 24, 16), GOLD_L, end, { ink: false, mat: { emissive: GOLD_L, emissiveIntensity: 1.2 } });
  const glow = put(S, new THREE.SphereGeometry(.8, 24, 16), GOLD_L, end, { ink: false, mat: { transparent: true, opacity: .25, emissive: GOLD_L, emissiveIntensity: .8 } });
  const sap = tree(S, .6, 1.0, -1.0);
  const sG = sign(Wd, S, .7, sY(.7), 0, VAULT.LBL_G, { h: .36, up: .4 });
  const sE = sign(Wd, S, -1.2, sY(-1.2) - .05, 0, VAULT.LBL_E, { h: .32 });
  sG.sp.material.opacity = .8;
  Wd.on(t => {
    beads.forEach((b, k) => { b.visible = t >= 1.9 + k * .12; b.scale.setScalar(lerp(.6, 1.2, sm(t, 1.0, 7.0))); });
    glow.material.opacity = .18 + .14 * Math.sin(t * 2.2);
    sap.scale.setScalar(lerp(1.0, 4.4, sm(t, .5, 6.5)));
    sG.sp.material.opacity = .8 + .2 * sm(t, 1.9, 4.5);
    sE.sp.material.opacity = .6 + .4 * sm(t, 6.0, 8.0);
    flap(B, .3);
  });
  return Wd;
}

window.CAP_FS_SCALE = 0.85;  // one font step smaller in every box, so each box fits 3 lines
const SH = (id, dur, caps, capAt, build) => ({ id, dur, wide: true, caps, capAt, build });
film({
  W: 1080, H: 1920, xf: .0001, vault: 'captions_vault.json',
  shots: [
    SH('s01', 9.04, ['G_CAP_01', 'G_CAP_05'], [0, 5.01, 9.04], b1),
    SH('s02', 3.52, ['G_CAP_09'], [0, 3.52], b2),
    SH('s03', 4.81, ['G_CAP_11'], [0, 4.81], b3),
    SH('s04', 4.39, ['G_CAP_14'], [0, 4.39], b4),
    SH('s05', 9.36, ['G_CAP_16', 'G_CAP_20'], [0, 4.86, 9.36], b5),
    SH('s06', 9.12, ['G_CAP_23', 'G_CAP_26'], [0, 4.33, 9.12], b6),
  ]
});
</script>
</html>
